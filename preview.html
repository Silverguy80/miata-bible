const procedures = [
  {id:'safe-lift',book:'orientation',system:'Safety',title:'Lift and support the Miata safely',applies:['NA','NB','NC','ND'],tags:['lift','jack','stands','safety'],difficulty:'Foundational',time:'30–45 min',symptoms:'Before any under-car inspection or repair.',tools:['Quality floor jack','Four rated stands','Wheel chocks','Flat working surface'],safety:'Never work under a vehicle supported only by a jack. Confirm the stand points for your generation before loading them.',steps:['Park on a hard, level surface and set the parking brake.','Chock the wheels that remain on the ground.','Use the correct front or rear lift point for the chassis, then place stands at verified structural support points.','Lower the car onto the stands, test stability, and keep the jack lightly positioned only as a secondary support.'],verify:'The vehicle is stable, level enough for the job, and cannot roll or rock under controlled hand pressure.',mistakes:'Using a pinch weld that is already rust-thinned; lifting one corner when the procedure requires a level car.',...common},
  {id:'fitment-id',book:'fitment',system:'Identification',title:'Build a fitment record before ordering parts',applies:['NA','NB','NC','ND'],tags:['fitment','vin','part number','trim'],difficulty:'Foundational',time:'15 min',symptoms:'Any repair or modification with multiple trim or market variants.',tools:['Phone camera','Notebook or build log'],safety:'A fitment record prevents expensive mistakes; it does not replace checking the current parts catalog.',steps:['Record VIN, production date, generation, engine, transmission, market, body style, ABS status, and current wheel/brake setup.','Photograph the original part, connector, mounting pattern, and label.','Record the old part number and compare it to the replacement supplier’s application notes.','Keep uncertain fitment marked as conditional until a physical or catalog match is confirmed.'],verify:'The part can be traced to the car’s exact configuration and the replacement number is documented.',mistakes:'Assuming all NB, ND, or “Club” parts are interchangeable.',...common},

function createGarageStore(key, defaultsFactory){
  return {
    load(){
      try{
        const raw=JSON.parse(localStorage.getItem(key)||'null');
        return raw ? {...defaultsFactory(),...raw,profile:{...defaultsFactory().profile,...(raw.profile||{})}} : defaultsFactory();
      }catch{return defaultsFactory()}
    },
    save(value){
      try{localStorage.setItem(key,JSON.stringify(value));return {ok:true,status:'local'}}
      catch{return {ok:false,status:'offline'}}
    },
    clear(){try{localStorage.removeItem(key)}catch{}}
  };
}

const generationManuals = [
  {
    "id": "NA",
    "title": "NA generation field manual",
    "docs": [
      {
        "file": "docs/research/na-nb/01-na-electrical.md",
        "title": "NA Miata electrical: starting, charging, grounds, lighting, and fuse strategy",
        "markdown": "# NA Miata electrical: starting, charging, grounds, lighting, and fuse strategy\n\n**Scope.** Original-generation MX-5/Miata NA, broadly 1990–1997. This is an original diagnostic outline, not a reproduction of Mazda diagrams, tables, connector pinouts, or factory wording. The public 1997 wiring reference separates charging, automatic- and manual-transmission starting, ground distribution, power distribution, exterior lamps, and headlamps into different circuit views [1]. Treat it as a navigation aid only; confirm the car’s own fuse/relay labels and wiring for its model year, market, transmission, engine, ABS/DRL equipment, and modifications.\n\n## Diagnostic procedures\n\n### 1. Establish the symptom and baseline power state\n\n**Use for:** no crank, click/no crank, slow crank, dimming lights, battery warning, or repeated flat battery.\n\n**Safety:** Park/neutral, parking brake set, ignition off for inspection, and keep hands/leads away from belts and fans. When cranking for a test, disable fuel/ignition if needed so the engine cannot start; Fluke explicitly recommends this approach for starter voltage-drop work [3].\n\n**Tools:** DMM, eye protection, battery terminal brush, known-good charger or load tester, serviceable jumper leads.\n\n**Steps:**\n1. Record whether the starter is silent, clicks, cranks slowly, or cranks at normal speed but the engine does not fire. Do not call a crank-no-start a starter fault.\n2. Inspect battery posts, clamps, the main positive cable, engine/body ground straps, alternator belt, starter connections, and the under-hood high-current fuse/fusible-link area for looseness, heat damage, or corrosion.\n3. Measure directly at the battery posts, not on a convenient accessory feed. Check resting voltage after the battery has been allowed to stabilize, then perform a proper battery load/conductance test if the resting result or symptom is suspect.\n4. If voltage collapses under cranking or the battery fails its test, repair/charge or replace the battery before condemning the starter. If battery voltage is credible, continue with voltage-drop tests.\n\n**Tests:** Compare battery-post voltage with the same reading at the cable clamps; a meaningful difference indicates a connection problem. A battery test is required before interpreting starter or alternator results.\n\n**Verify:** The car now has a known-good, charged battery and clean, tight primary connections, with the original symptom reproduced under controlled conditions.\n\n**Mistakes:** Replacing a starter or alternator because an old battery reads near 12 V at rest; measuring on painted/corroded surfaces; confusing “cranks normally but will not start” with “does not crank.”\n\n### 2. Isolate a no-crank or slow-crank fault with voltage drop\n\n**Use for:** slow cranking, a single click, intermittent no-crank, hot-start trouble, or a starter that tests good off the car.\n\n**Safety:** Transmission in neutral/park, parking brake on, wheels secured. Disable fuel/ignition before repeated cranking. Keep the probes from bridging adjacent terminals.\n\n**Tools:** DMM with min/max or a helper, back-probe leads, wiring diagram for the exact year/market.\n\n**Steps:**\n1. For the positive side, place the meter across the battery positive post and the starter motor’s main battery stud; crank for a few seconds and capture the peak drop. Fluke describes this placement and interprets excessive drop as cable/connection resistance [3].\n2. For the ground side, place one lead on the battery negative post and the other on clean starter housing/engine-block metal; crank again.\n3. If either side is high, move the probes in smaller sections: post-to-clamp, clamp-to-cable, cable-to-starter stud, battery negative-to-body, and engine/starter housing-to-battery negative. The section that accounts for the drop contains the likely fault.\n4. Clean and tighten the identified connection or replace a damaged cable/strap, then repeat the same test. Do not use a temporary jumper as the final repair.\n\n**Tests:** Fluke gives a practical total starter-circuit guideline of about 0.2–0.5 V, with roughly 0.3 V positive-side and 0.2 V or less ground-side examples; use the exact vehicle service specification when available [3].\n\n**Verify:** Cranking speed is consistent hot and cold, the key-start signal reaches the starter control path, and both side drops remain within the chosen specification during a repeat crank.\n\n**Mistakes:** Ohming a cable with no load and declaring it good; probing the battery clamp instead of the post; assuming a visual ground inspection proves a low-resistance ground.\n\n### 3. Confirm charging output and alternator-circuit integrity\n\n**Use for:** charge warning lamp, low battery after driving, dimming with loads, overcharging, or alternator replacement decisions.\n\n**Safety:** Keep clothing and probes clear of the rotating belt/pulleys. Do not disconnect the battery with the engine running. Stop if the belt is damaged, slipping, or contaminated.\n\n**Tools:** DMM, belt-tension/inspection tools, clamp meter if available, exact-year wiring reference.\n\n**Steps:**\n1. Inspect belt condition, alignment, and tension before electrical conclusions. DENSO lists belt condition/tension, battery connections, fuses/fusible links, and wiring among the first checks [2].\n2. With the engine running, measure at the alternator output and at the battery. DENSO’s general passenger-vehicle check uses about 2,000 rpm and expects approximately 13–15 V, then repeats with headlights, blower, and defroster loads; the car-specific specification takes precedence [2].\n3. Measure positive-side charging drop from alternator output stud to battery positive post, and negative-side drop from alternator case/ground strap to battery negative post. DENSO gives 0.2 V or less on each side as its general target [2].\n4. If alternator output is present but battery voltage is low, trace the cable, fusible link/high-current fuse, grounds, and sense/indicator wiring before replacing the alternator. If output is high, investigate regulation and sense connections; protect the battery and electronics from continued overvoltage.\n\n**Tests:** Compare no-load and loaded voltage, alternator-to-battery drop, belt condition, and battery condition. A good alternator cannot overcome a high-resistance cable.\n\n**Verify:** Charging remains in the vehicle-specific range at idle and approximately 2,000 rpm, with normal loads applied, and the charge warning behavior is normal after a restart.\n\n**Mistakes:** Testing only at the alternator; ignoring belt slip; accepting a brief no-load voltage as proof of charging health; installing a new alternator before checking the high-current path.\n\n### 4. Trace lighting and accessory failures by branch, ground, and load\n\n**Use for:** one lamp out, one side dim, headlights/turn/brake lights interacting, intermittent lamps, or radio/blower changes when lights are switched.\n\n**Safety:** Switch the lighting circuit off before opening connectors or removing fuses. Use fused test equipment; do not probe airbag/SRS wiring or short a lighting socket.\n\n**Tools:** DMM/test light, back-probes, wiring reference for exact year/market, terminal-cleaning tools, correct replacement bulbs and fuses.\n\n**Steps:**\n1. Classify the failure: one bulb, one side, an entire function, or several loads changing together. Several loads changing together favors a shared feed, ground, switch/relay, or distribution issue over multiple bulbs.\n2. Verify the bulb, socket contact, connector condition, and ground under load. Measure voltage at the socket while the lamp is commanded on, then measure voltage drop on the ground side from socket ground to battery negative/body ground.\n3. Work upstream in order: socket → branch connector → switch/relay output → fuse output → fuse input → main feed. Probe both sides of a fuse with the circuit energized; a fuse can look intact while its holder or upstream feed is corroded.\n4. For a blown fuse, find the short/overload before replacement. Fit only the same type and rating shown for that vehicle; never bridge a fuse or substitute a higher rating.\n\n**Tests:** Compare left/right lamp voltage and ground drop under the same load. DENSO’s general method likewise emphasizes checking every component, connections, wires, and voltage drop rather than jumping straight to a part [2].\n\n**Verify:** The affected lamp/function operates at normal brightness, related loads no longer interact, and the fuse survives repeated operation with the original load.\n\n**Mistakes:** Replacing bulbs repeatedly; testing continuity with the circuit off but never testing loaded voltage; adding a larger fuse; assuming a modern LED conversion follows the stock load behavior.\n\n### 5. Check the NA fuse/distribution strategy without trusting a generic map\n\n**Use for:** multiple dead accessories, intermittent electrical resets, recurring fuse failures, or corrosion around the engine-bay distribution area.\n\n**Safety:** Disconnect the negative battery cable before removing high-current links or cleaning exposed high-current hardware. The main feed can remain live until the battery is disconnected; avoid tools bridging the feed to body metal.\n\n**Tools:** Exact-year owner/service wiring reference, DMM, test light, terminal tools, contact cleaner, replacement fuses/fusible links of the specified type and rating.\n\n**Steps:**\n1. Use the vehicle’s fuse-box cover/manual and VIN/year/market match first. The public 1997 reference shows that power distribution, ground distribution, starting/charging, exterior lamps, and headlamps are separate circuit groups [1]; it is not a universal NA fuse chart.\n2. Inspect the fuse/relay box, high-current links, mounting hardware, and nearby connectors for oxidized contact surfaces, heat discoloration, water entry, or loose fasteners.\n3. With the battery reconnected, test for power at fuse input and output under the relevant key/switch state. A missing input points upstream; input present but no output with a good fuse points to the fuse/holder; output present but load dead points downstream.\n4. After repair, load the circuit and recheck voltage drop and heat. Document any non-factory alarm, audio amplifier, lighting, or engine-swap wiring before declaring the stock circuit faulty.\n\n**Tests:** Fuse continuity is only a first screen. Loaded voltage on both sides and voltage drop across the holder/connection are more diagnostic.\n\n**Verify:** All related branches operate, no fuse or high-current connection heats abnormally, and the repair remains stable after vibration and a repeat load test.\n\n**Mistakes:** Using an internet fuse map from another year; cleaning only the visible blade while ignoring the holder/feed; replacing a fusible link with ordinary wire; overlooking aftermarket wiring.\n\n## Simplified wiring notes\n\n### Starting path (conceptual)\n\n**Diagram:** `Battery + → main protection/distribution → ignition/start switch → transmission safety path (if equipped) → starter solenoid/control → starter motor → engine/transmission case → engine/body ground strap → battery −`\n\n**Explanation:** A no-crank diagnosis follows control permission and high-current delivery separately. Manual- and automatic-transmission starting circuits are shown as distinct in the public 1997 reference [1]. Use voltage drop while the starter is loaded to find resistance; do not infer cable health from an unloaded resistance check.\n\n**Limits:** Exact relay placement, switch logic, connector names, and market equipment vary. This is intentionally not a pinout or factory diagram.\n\n### Charging path (conceptual)\n\n**Diagram:** `Alternator output → high-current cable/protection → battery + / distribution`; `alternator case → engine ground → battery −`; `ignition/indicator and sense wiring → regulator/control path`\n\n**Explanation:** Charging is a loop, not just an alternator test. Belt condition, battery connections, the positive cable/protection path, and the ground path all affect battery voltage. DENSO recommends positive- and negative-side charging voltage-drop checks at roughly 0.2 V or less each, plus loaded output testing [2].\n\n**Limits:** Output targets and regulator/sense details are general guidance, not a universal NA specification. Confirm 1.6 vs 1.8, year, market, and replacement-alternator configuration.\n\n### Lighting and fuse branching (conceptual)\n\n**Diagram:** `Battery/distribution → fuse or fusible link → switch/relay → branch fuse/feed → lamp/socket → body ground`\n\n**Explanation:** The 1997 public wiring index separates exterior lamps, headlamps, power distribution, and ground distribution [1]. A shared symptom across radio, blower, and lights makes the common feed/ground/distribution path more likely than several independent bulbs. Test at the load with the circuit energized, then move upstream.\n\n**Limits:** DRL-equipped and non-DRL markets differ in lamp control; bulb wattage, added relays, LED conversions, alarms, and audio wiring can change loads and failure modes. Do not apply a generic fuse number or color without the car-specific source.\n\n## Model-year and evidence caveats\n\nThe NA spans 1990–1997 and includes 1.6 L and later 1.8 L cars, manual and automatic transmissions, and market/equipment differences. The accessible public wiring reference is specifically labeled 1997 and includes separate DRL/non-DRL lamp views [1], so it supports system relationships but not every earlier NA fuse or connector detail. The Manualslib-hosted Miata service information is a secondary reproduction; it emphasizes checking battery connections, fuses, and electrical connections before deeper starting/engine diagnosis [4]. The Miata Forum discussion is enthusiast evidence only: it reports real-world intermittent voltage/ground and high-current fuse-box corrosion observations, but its anecdotal measurements and advice are not factory specifications [5].\n\n## References\n\n[1]: https://www.mellens.net/mazda/Mazda-Miata-1997/wiring.pdf \"1997 Mazda MX-5 Miata System Wiring Diagrams\"\n[2]: https://www.densoautoparts.com/reference-charging-system-troubleshooting/ \"DENSO Charging System Troubleshooting\"\n[3]: https://www.fluke.com/en-us/learn/blog/digital-multimeters/how-to-check-starter-circuit-voltage-drop-with-a-multimeter \"Fluke: How to Check Starter Circuit Voltage Drop with a Multimeter\"\n[4]: https://www.manualslib.com/manual/1001464/Mazda-Miata.html \"Mazda Miata Service Manual reproduction\"\n[5]: https://forum.miata.net/vb/showthread.php?t=472045 \"MX-5 Miata Forum: Ground Problem or Voltage Supply Problem?\"\n",
        "references": "## References\n\n[1]: https://www.mellens.net/mazda/Mazda-Miata-1997/wiring.pdf \"1997 Mazda MX-5 Miata System Wiring Diagrams\"\n[2]: https://www.densoautoparts.com/reference-charging-system-troubleshooting/ \"DENSO Charging System Troubleshooting\"\n[3]: https://www.fluke.com/en-us/learn/blog/digital-multimeters/how-to-check-starter-circuit-voltage-drop-with-a-multimeter \"Fluke: How to Check Starter Circuit Voltage Drop with a Multimeter\"\n[4]: https://www.manualslib.com/manual/1001464/Mazda-Miata.html \"Mazda Miata Service Manual reproduction\"\n[5]: https://forum.miata.net/vb/showthread.php?t=472045 \"MX-5 Miata Forum: Ground Problem or Voltage Supply Problem?\""

        "title": "NA engine mechanical, fuel, ignition, emissions, and no-start diagnosis",
        "markdown": "# NA engine mechanical, fuel, ignition, emissions, and no-start diagnosis\n\nThis note covers first-generation MX-5/Miata (NA, roughly 1989–1997) diagnosis without reproducing factory manual language, diagrams, or proprietary connector pinouts. The safest order is to prove the failure mode before replacing parts: battery/cranking, ECU power and codes, mechanical timing, spark, fuel delivery/injection, then emissions-control faults. A “new coil,” “pump noise,” or wet plug is not proof that the complete subsystem works.\n\n## Model-year and market caveats\n\n- NA cars use more than one engine/control configuration. Early cars are commonly 1.6 L B6; later cars commonly 1.8 L BP. Harness routing, sensors, relay logic, emissions equipment, and test values vary by year, market, transmission, and California/non-California specification. Use the VIN/year-specific service information for any numerical limit or connector identification.\n- The public Miata fault-code reference describes two-digit self-diagnosis for 1990–1993 and a different 1994–1995 code set; it also says 1996-on cars use OBD and need a scanner. Treat that as a strong model-year guide, not a substitute for confirming the car’s market and ECU. [1]\n- The public 1991 wiring reference is useful for circuit relationships, but it is explicitly a 1991 diagram. Do not transfer its wire colors, terminal numbers, or relay details to every NA. [2]\n- Mazda’s owner information is newer than NA, but its general safety point remains relevant: ignition, fuel, and emissions systems are interdependent and should not be tampered with; inspect fuel lines/hoses, battery, air filter, evaporative equipment, and exhaust as applicable to the actual car. [3]\n\n## Procedure 1 — Establish the symptom and make the car safe\n\n**Symptom:** “Won’t start” is ambiguous: no crank, slow crank, crank/no-fire, starts then stalls, or runs badly. Separate it before testing.\n\n**Safety:** Work outdoors or with strong ventilation. Keep sparks, cigarettes, and hot lamps away from fuel vapour. Disable ignition/fuel as appropriate before extended cranking. Support the hood and keep hands, clothing, and test leads clear of belts and fans.\n\n**Tools:** Charged battery or approved jump pack, multimeter, insulated hand tools, eye protection, scan/code-reading equipment appropriate to year.\n\n**Steps:** Confirm fuel level and battery condition; observe whether the starter turns the engine at a normal, even speed. Note whether the check-engine lamp illuminates with key ON. Inspect for loose grounds, disconnected intake hoses, damaged wiring, blown fuses, rodent damage, and obvious timing-belt debris. Do not use repeated starting-fluid tests as a repair strategy.\n\n**Tests:** If there is no crank, test battery voltage under load, starter control, and starter current path before investigating fuel or spark. If it cranks, stop treating the starter circuit as the primary fault and proceed to the engine-control checks.\n\n**Verify:** The symptom is recorded as one precise state, with key-ON lamp behavior and any recent work or event documented.\n\n**Mistakes:** Replacing plugs, wires, coil, pump, or ECU because the engine “sounds like” a fuel or ignition fault; continuing to crank with a flooded cylinder or a weak battery.\n\n## Procedure 2 — Check ECU power, diagnostic status, and mechanical timing\n\n**Symptom:** Cranks but does not fire, or the check-engine lamp is absent when it should be on.\n\n**Safety:** Disconnect battery power before disturbing fuses or major connectors; reconnect only when the work area is safe. Never bridge random diagnostic terminals. A paper clip method is only for the specific diagnostic procedure and terminal labels verified for that car.\n\n**Tools:** Year-appropriate code reader or a verified NA self-diagnosis procedure, multimeter, timing-light or inspection tools, helper.\n\n**Steps:** Record codes before clearing them. For early NA self-diagnosis, the published procedure uses the under-hood diagnostic connector and the car’s GND/TEN positions; later configurations require the applicable procedure or scanner. [1] If the check-engine lamp does not illuminate at key ON, check the relevant fuses, main relay/ECU supply, grounds, lamp circuit, and ignition-switch feed rather than assuming the ECU has failed. Remove the oil filler cap and observe cam movement while cranking; absent cam motion strongly indicates a broken timing belt or valvetrain drive fault. If the cam turns, verify crank/cam timing marks before pursuing sensors.\n\n**Tests:** Confirm battery voltage remains adequate during cranking. Confirm ECU power and grounds with a voltage-drop test under load. Retrieve and document codes; a no-code result does not prove the system is healthy. A moving cam does not prove correct valve timing.\n\n**Verify:** There is a documented power/ground result, code result, and mechanical-timing result before parts are replaced.\n\n**Mistakes:** Treating an old stored code as the current cause; using a 1991 wiring diagram or 1990–1993 blink-code procedure on a different year/market without verification; assuming a spinning cam means the belt has not jumped.\n\n## Procedure 3 — Prove ignition output and engine-position signaling\n\n**Symptom:** Crank/no-fire with dry plugs, no visible spark, intermittent spark, or a sudden stall.\n\n**Safety:** Use an approved adjustable spark tester or an insulated test method; do not hold a plug wire by hand. Keep the tester away from fuel vapour. Do not repeatedly crank with disconnected high-tension leads.\n\n**Tools:** Spark tester, multimeter, service data for the exact coil/igniter/CAS configuration, timing light if the engine can run.\n\n**Steps:** Test for spark at more than one cylinder, not just by fitting a new plug. If all cylinders lack spark, work upstream: ignition-switch/relay/fuse power, coil feed, igniter control, engine-position/CAS signal, ECU grounds, and the ECU’s ignition command. If one cylinder differs, inspect that lead, plug, coil tower, and mechanical condition. If spark is present but badly timed, return to belt alignment and position-signal checks. Use resistance checks only as a screen; a component can pass an ohms test and fail under heat or load.\n\n**Tests:** Compare coil supply voltage during crank with battery voltage; perform voltage-drop checks on grounds; observe spark strength and consistency during repeated cranking. Do not infer spark from a new coil or wires. The 1991 public wiring reference shows the ECU, igniter, coil, crank-angle signal, injectors, airflow meter, and circuit-opening relay as connected parts of one control system, which is why a single “bad ignition part” assumption is unsafe. [2]\n\n**Verify:** A repeatable spark result is recorded for each tested cylinder, and timing is verified if spark exists.\n\n**Mistakes:** Testing only one plug; confusing an ignition-power fault with an ECU-command fault; declaring a CAS or igniter bad before checking power, ground, connectors, and timing.\n\n## Procedure 4 — Prove fuel-pump power, pressure, and injector operation\n\n**Symptom:** Cranks with strong spark but does not run; plugs remain dry; starts briefly only with enrichment.\n\n**Safety:** Relieve fuel pressure using the exact vehicle procedure. Use a rated fuel-pressure gauge and catch fuel safely. Do not clamp old or brittle hoses aggressively. Wipe spills and wait for vapour to clear before sparking or cranking.\n\n**Tools:** Fuel-pressure gauge and adapters, multimeter, noid light or injector test equipment, mechanic’s stethoscope, fused jumper only where the verified diagnostic procedure calls for it.\n\n**Steps:** Listen for the pump only as an initial clue. Prove power at the pump with the correct diagnostic test and verify the circuit-opening relay, fuse, grounds, and harness. The enthusiast no-start guide describes an FP-to-ground diagnostic test for applicable NA layouts; verify terminal labels and year before using it. [4] Measure pressure while cranking/running against the exact engine’s service specification. Check injector electrical feed and listen for consistent injector operation; a wet plug proves fuel reached that cylinder but not that pressure, pulse width, or spray quality is correct.\n\n**Tests:** If pump power is present but pressure is low, distinguish pump/filter/line restriction from regulator or return-path faults using the service procedure. If pressure is correct but injectors do not pulse, check injector power, ECU ground, engine-position signal, and ECU control. If one cylinder differs, compare injector resistance and pulse with the others rather than replacing the whole rail.\n\n**Verify:** Pressure, hold/decay behavior, injector power, and injector pulse are each recorded; the engine responds consistently to a controlled fuel test only if it is safe and permitted by the service information.\n\n**Mistakes:** Equating pump noise with correct pressure; bypassing a relay and leaving the pump powered; using starting fluid near an intake backfire risk; replacing the pump before testing voltage drop and pressure.\n\n## Procedure 5 — Diagnose emissions and mixture faults after basic operation is proven\n\n**Symptom:** Starts but stalls, runs rich/lean, has unstable idle, fails emissions, or logs sensor/evaporative/EGR/oxygen-related faults.\n\n**Safety:** Exhaust gas is toxic; run only outdoors or with extraction. Do not defeat emissions equipment as a “test.” Avoid probing sealed connectors with oversized probes.\n\n**Tools:** Year/market-appropriate scanner or blink-code method, multimeter, vacuum gauge or smoke tester, fuel-pressure gauge, exhaust-gas analyzer if available, service information.\n\n**Steps:** First repair vacuum leaks, intake restrictions, poor grounds, and ignition misfire. Then use codes as direction, not verdict: the published NA list includes airflow, coolant-temperature, intake-temperature, throttle-position, oxygen, purge, EGR, and idle-control faults depending on year. [1] Compare sensor plausibility cold and warm; check wiring and reference/ground circuits before condemning a sensor. Inspect purge and EGR hoses/solenoids for routing, leaks, and stuck valves. Check fuel pressure and ignition timing under the condition that creates the complaint.\n\n**Tests:** Clear codes only after recording them, reproduce the symptom, and rescan. Verify closed-loop behavior only after the engine reaches operating temperature and has a stable ignition/fuel base. Confirm exhaust leaks near the oxygen sensor before interpreting oxygen readings.\n\n**Verify:** The repair changes the measured condition (mixture, vacuum, pressure, sensor plausibility, or code state) and the vehicle completes a cold/warm road test without the original symptom.\n\n**Mistakes:** Replacing an oxygen sensor for every emissions code; adjusting the airflow meter or ignition timing to hide a vacuum/fuel fault; applying modern OBD-II assumptions to an earlier NA.\n\n## Simplified wiring notes\n\n### 1. ECU power and ground are prerequisites, not a diagnosis\n\n**Diagram:** `Battery → fuses/main relay/ignition switch → ECU + engine-control loads; engine/body grounds → battery negative`\n\n**Explanation:** The ECU, igniter, injectors, sensors, and relays need both stable supply and low-resistance grounds. A relay click or a static 12 V reading does not prove usable voltage during cranking; measure voltage drop under load. The 1991 public diagram shows the ECU in the same control network as the main relay, injector feed, ignition switch, and diagnostic connector. [2]\n\n**Limits:** This is a functional block diagram, not a pinout. Wire colours, terminal numbers, fuses, and relay layouts vary by year and market.\n\n### 2. The fuel-pump path is conditional\n\n**Diagram:** `Key/ECU logic + safety inputs → circuit-opening relay → pump → fuel rail → regulator/return`\n\n**Explanation:** Pump operation is controlled through a relay and safety/airflow logic on applicable NA configurations; the public NA guide uses a verified diagnostic jumper to separate relay/control faults from pump and wiring faults. [4] Use pressure measurement to confirm delivery rather than listening for a brief prime.\n\n**Limits:** Do not assume every NA has identical relay logic or diagnostic-terminal behavior. Never leave a bypass jumper installed for normal driving.\n\n### 3. Ignition is a chain from position signal to spark\n\n**Diagram:** `Crank/CAS signal → ECU timing decision → igniter/coil → plug wires → plugs → cylinder`\n\n**Explanation:** No spark can originate from missing position information, ECU power/ground, igniter control, coil supply, high-tension hardware, or mechanical timing. The public 1991 diagram identifies these functional links without making them interchangeable across all NA years. [2]\n\n**Limits:** The diagram intentionally omits proprietary connector pinouts and does not provide resistance/voltage limits; use exact service data.\n\n### 4. Emissions sensors influence mixture but do not replace fundamentals\n\n**Diagram:** `Airflow/throttle/temperature inputs → ECU → injector/ignition commands; oxygen feedback + purge/EGR status → corrections/diagnostics`\n\n**Explanation:** NA self-diagnostics can report sensor and actuator circuits, but a code can be caused by wiring, vacuum leaks, exhaust leaks, or a real mechanical/mixture problem. Mazda’s owner guidance reinforces treating ignition, fuel, and emissions as linked systems. [1] [3]\n\n**Limits:** California and export cars may have additional emissions hardware. Confirm equipment by VIN and under-hood labels before testing or deleting anything.\n\n## References\n\n[1]: https://www.miata.net/garage/faultcodes.html \"Miata Engine Computer Self Diagnostics\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/1991_wiring.pdf \"1991 Mazda MX-5 Miata Wiring Diagrams\"\n[3]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07020100.html \"Mazda MX-5 Scheduled Maintenance and Emission Control Guidance\"\n[4]: https://forum.miata.net/vb/showthread.php?t=279746 \"Miata No-Start Troubleshooting Guide\"\n[5]: https://forum.miata.net/vb/showthread.php?p=9468381 \"Miata Forum No-Start Diagnostic Discussion\"\n[6]: https://archive.org/details/1990-mazda-mx-5-miata-workshop-manual \"1990 Mazda MX-5 Miata Workshop Manual scan listing\"\n",
        "references": "## References\n\n[1]: https://www.miata.net/garage/faultcodes.html \"Miata Engine Computer Self Diagnostics\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/1991_wiring.pdf \"1991 Mazda MX-5 Miata Wiring Diagrams\"\n[3]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07020100.html \"Mazda MX-5 Scheduled Maintenance and Emission Control Guidance\"\n[4]: https://forum.miata.net/vb/showthread.php?t=279746 \"Miata No-Start Troubleshooting Guide\"\n[5]: https://forum.miata.net/vb/showthread.php?p=9468381 \"Miata Forum No-Start Diagnostic Discussion\"\n[6]: https://archive.org/details/1990-mazda-mx-5-miata-workshop-manual \"1990 Mazda MX-5 Miata Workshop Manual scan listing\""

        "title": "NA Miata cooling, heating, belts, hoses, and overheating diagnosis",
        "markdown": "# NA Miata cooling, heating, belts, hoses, and overheating diagnosis\n\n## Scope and model caveats\n\nThis note covers first-generation NA MX-5/Miata cooling and heater diagnosis, with emphasis on safe sequencing rather than parts swapping. NA cars are commonly divided into 1.6 L cars (roughly 1990–1993) and 1.8 L cars (roughly 1994–1997), but production dates, engines, emissions equipment, A/C fitment, and fan control details vary by market. Confirm the VIN, engine, market, and any cooling reroute, aftermarket radiator, fan, or A/C modification before using a component location or test. Public electrical references here are location/circuit summaries, not a substitute for the correct year-specific wiring diagram.\n\nA hot gauge or steam is a stop-and-cool event, not a reason to keep driving. Mazda owner guidance says to confirm fan operation, shut down after temperature falls, and, when cool, check coolant level and look for leaks at the radiator and hoses [1]. The public 1990–95 reference warns that the fan can start with the key off and that the radiator cap must not be removed hot [2].\n\n## Procedure 1: Triage an active overheat safely\n\n**Symptom:** Gauge higher than its normal position, steam/sweet coolant smell, coolant loss, or fan not heard during a hot idle.\n\n**Safety:** Pull off safely, switch off the engine if temperature continues to rise or coolant is escaping, keep hands away from the fan, and never open the cap hot. Let the system cool fully. Do not use the heater as a license to continue driving; it is only a temporary heat-load reduction and diagnostic clue.\n\n**Tools:** Gloves and eye protection; flashlight; absorbent cloth; coolant-safe catch pan; infrared thermometer if available.\n\n**Steps:** (1) Record whether the fault occurred in traffic, with A/C on, at speed, on a hill, or immediately after service. (2) Once cool, inspect the radiator, cap/neck, upper and lower hoses, heater hoses, water-pump area, and belt path for wetness, dried deposits, split rubber, collapse, or rubbing. (3) Check the radiator and reservoir levels only when cold; do not infer a full radiator from the reservoir alone. (4) Look for a missing shroud/ducting or debris blocking the radiator. (5) If the engine was run low on coolant, treat air entry and possible head-gasket damage as unresolved until tested.\n\n**Tests:** Compare the gauge with an independent temperature measurement at the thermostat housing/radiator inlet, recognizing that infrared readings depend on surface emissivity. Pressure-test the cold system and cap with appropriate equipment if a leak is not visible. A combustion-gas test or leak-down/compression test is warranted when coolant is repeatedly expelled, bubbles persist after proper bleeding, or overheating returns without an external leak.\n\n**Verify:** After repair, refill and bleed using the correct coolant procedure for the installed layout, warm from cold while monitoring level and hose temperature, confirm stable gauge behavior, and recheck for leaks after a complete cool-down.\n\n**Mistakes:** Opening a hot cap; trusting a normal-looking reservoir; continuing after the gauge rises; replacing a thermostat before proving coolant level, air, fan operation, and leaks.\n\n## Procedure 2: Distinguish airflow/fan faults from circulation faults\n\n**Symptom:** Overheats mainly while idling or in traffic, or fan does not run when temperature rises; alternatively, overheats at road speed where fan airflow should be less decisive.\n\n**Safety:** Disconnect the fan connector before working near the blades; the fan may start unexpectedly, including after key-off [2]. Keep jumper leads fused and away from belts.\n\n**Tools:** Multimeter or test lamp; fused 12 V jumper; wiring diagram for the exact year/market; infrared thermometer; basic hand tools.\n\n**Steps:** (1) With the engine cold and key off, inspect fan blades, shroud, connector, grounds, and wiring for damage. (2) Verify the relevant fuses before condemning a motor. The public 1990–95 listing identifies a 30 A main cooling-fan fuse, a 15 A interior engine-cooling-fan fuse, and a separate A/C additional-fan fuse, but fuse assignments can vary by year/market [3]. (3) Test the fan motor directly with a fused battery feed and confirm it spins freely without abnormal current draw. (4) If the motor works, trace the control side through the thermoswitch, relay, power, and ground. (5) If the fan runs but the car overheats at speed, inspect radiator blockage, missing duct seals/undertray, collapsed hose, incorrect thermostat, pump circulation, and combustion-gas symptoms before adding a manual fan switch.\n\n**Tests:** A direct motor test separates motor failure from control failure. Voltage-drop testing across the fan ground and supply while loaded is more useful than continuity alone. Observe whether the fan-control circuit is being commanded as temperature rises; do not substitute a permanent ground as a repair.\n\n**Verify:** Fan starts at the expected operating condition for the exact configuration, runs quietly, and cycles off after temperature falls. Confirm A/C operation does not create a second-fan or relay fault where fitted.\n\n**Mistakes:** Bridging random terminals; using an unfused jumper; assuming a fan that spins freely has a healthy electrical load; fitting a lower-temperature switch to mask poor airflow or low coolant.\n\n## Procedure 3: Check belts, hoses, thermostat, cap, and water-pump circulation in a logical order\n\n**Symptom:** Overheating, weak/no cabin heat, squeal, coolant smell, unexplained level loss, or an upper hose that warms too early or stays cold after the engine is hot.\n\n**Safety:** Inspect belts with the engine off and cold. Keep clear of moving pulleys and the fan during any running test. Coolant can burn and is toxic to people and animals.\n\n**Tools:** Flashlight; belt-tension method or gauge appropriate to the belt; cooling-system pressure tester; cap tester; infrared thermometer; drain pan; correct replacement clamps/hoses; service information for the exact engine.\n\n**Steps:** (1) Inspect accessory and timing-belt service history; look for glazing, cracking, oil contamination, fraying, slack, pulley misalignment, and bearing noise. A belt failure can stop an accessory and, on some engine designs, coolant circulation; establish the NA engine-specific drive arrangement rather than assuming from a generic belt diagram [4]. (2) Cold-squeeze radiator and heater hoses. Cracks, abrasion, dried deposits, hard/crunchy rubber, excessive softness, swelling, or oil soak are replacement findings, consistent with AAA inspection guidance [4]. (3) Pressure-test the system cold and inspect hose ends, radiator tanks, cap/neck, heater circuit, and pump area. (4) From cold, monitor hose temperatures: an upper hose warming immediately suggests thermostat leakage/opening too early; an upper hose remaining cold while the engine is genuinely hot suggests a closed thermostat, air pocket, or absent circulation. This is a screening test, not a substitute for removing and testing the thermostat. (5) If thermostat and fill/bleed are correct, assess pump circulation, impeller condition, belt timing, radiator restriction, and internal blockage.\n\n**Tests:** Test the thermostat in heated water with a thermometer against its specified opening behavior for the installed engine; do not rely on a generic temperature. Check cap pressure with a tester. Compare heater-hose temperatures with the heater valve open: a large difference suggests restricted heater-core flow or trapped air, while similar hot hoses with cold cabin air points toward HVAC door/valve/blower issues. Gates identifies the radiator, heater core, fan, thermal switch, hoses, thermostat, pump, and caps as interdependent parts of heat absorption, transport, and rejection [5].\n\n**Verify:** No pressure loss or external seepage; belt tracks correctly; thermostat behavior is plausible; heater produces stable heat; radiator has an even temperature pattern after warm-up; gauge remains stable through idle and road test.\n\n**Mistakes:** Replacing a thermostat without testing for trapped air; tightening clamps onto damaged hose necks; over-tensioning belts; treating an old brown/yellow plastic radiator tank as merely cosmetic. The last point is a clearly labeled enthusiast warning, not an official Mazda interval: 949 Racing describes aged discolored NA/NB plastic tanks as brittle and high-risk [6].\n\n## Procedure 4: Diagnose “overheats with no heat” and rule out internal engine damage\n\n**Symptom:** Engine overheats while cabin heater stays cold, coolant disappears, reservoir overflows, hoses become abnormally hard soon after cold start, or the system repeatedly traps air.\n\n**Safety:** Do not run an engine with an empty radiator. Avoid opening any pressurized system hot. Stop if coolant sprays, the belt is damaged, or oil/coolant cross-contamination is suspected.\n\n**Tools:** Cooling-system pressure tester; combustion-gas/block tester; compression or leak-down tester; spark-plug tools; cooling-system fill/bleed equipment; service data for the exact engine.\n\n**Steps:** (1) Confirm coolant level cold and verify the heater-control valve/air-mix controls before concluding there is no heater flow. (2) Compare heater-hose temperatures and inspect for kinked hoses or restricted core. (3) Pressure-test cold and inspect for external loss. (4) If pressure falls without an external leak, or if the system pressurizes unusually quickly from cold, test for combustion gases and perform compression/leak-down testing. (5) Inspect oil for coolant contamination and coolant for oil contamination, but treat visual checks as screening only. (6) If the engine has overheated severely, do not assume a new radiator or thermostat cured it; repeat the pressure and combustion-gas tests after the first complete heat cycle.\n\n**Tests:** A cold pressure test finds external leaks; a combustion-gas test addresses an internal leak. Leak-down bubbles in the cooling system or consistently abnormal compression support head-gasket/head/crack investigation, but results must be interpreted with engine-specific test conditions. A cold heater with a hot engine can reflect low coolant/air, restricted core, closed heater valve, or HVAC control trouble; it does not by itself prove a head gasket.\n\n**Verify:** Stable cold level after several heat/cool cycles, no unexplained reservoir rise, no external seepage, normal heater output, and repeatable temperature behavior under both idle and road-load conditions.\n\n**Mistakes:** Using cabin heat as the primary cooling strategy; declaring “head gasket” from bubbles alone; ignoring a leaking heater hose or radiator cap; bleeding repeatedly without finding why air entered.\n\n## Simplified electrical notes\n\n- **NA fan control is a switched-power circuit, not a single sensor-to-motor wire.** In the public 1991 component locator, the cooling-fan relay is in the engine-compartment fuse/relay block and the cooling-fan thermoswitch is on the thermostat housing [7]. Conceptually: battery/fused supply → relay contacts → fan motor → ground; a temperature switch/control path energizes the relay. Exact polarity, connector cavities, and A/C interaction vary; use the year-specific diagram and test loaded circuits rather than copying a pinout.\n\n- **There are separate protection paths worth checking.** The public 1990–95 reference lists a 30 A cooling-fan fuse in the main block, a 15 A engine-cooling-fan fuse in the interior panel, and a 20 A A/C additional-fan fuse [3]. These labels are useful for triage, not permission to install a larger fuse. A blown fuse is evidence of overload, short, seized motor, or wiring damage; find the cause.\n\n- **Fan operation is a safety hazard during diagnosis.** The public reference says the thermostatic fan may start or continue for up to about 15 minutes after shutdown [2]. Treat the fan as live whenever the system is connected; disconnect the motor before hands-on work and restore the connector before functional testing.\n\n## Differences and uncertainty\n\n- NA 1.6 and 1.8 engines, A/C-equipped and non-A/C cars, and different markets can use different fuse labels, relay logic, connector routing, and component locations. The cited locator is explicitly a 1991 reference; do not transfer its locations or colors blindly to 1994–1997 cars.\n- 949 Racing’s airflow, OEM coolant-routing, and plastic-tank observations are enthusiast/aftermarket technical commentary. They are useful hypotheses for a modified or track-driven car, but they do not establish a Mazda service interval or prove that every stock NA will overheat.\n- Temperature-gauge position is not a precision measurement. Confirm with an independent measurement and compare behavior over time. Infrared readings are affected by surface finish and location.\n- Public owner information available through Mazda’s current manual site is for newer MX-5 generations, so the safe “cool, then check level/leaks/fan” principle is transferable, but NA-specific procedures and specifications must come from the correct NA manual or equivalent service data.\n\n## References\n\n[1]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18/contents/08050100.html \"Mazda MX-5 owner information, overheating\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/fuses.pdf \"1990–95 Mazda Miata fuses and safety cautions\"\n[3]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/fuses.pdf \"1990–95 Mazda Miata fuse assignments\"\n[4]: https://exchange.aaa.com/wp-content/uploads/2012/09/AAA-Car-Care-Belts-Hoses.pdf \"AAA Car Care: belts and hoses\"\n[5]: https://www.gatestechzone.com/content/dam/documents-library/operating-manuals/cooling-system-troubleshooting-guide-gb-en.pdf \"Gates Cooling System Troubleshooting Guide\"\n[6]: https://949racing.com/supermiata/tech-info/na-nb-cooling-system-performance/ \"949 Racing: 90–05 NA/NB Miata cooling system performance\"\n[7]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/electrical_component_locations.pdf \"1991 Mazda Miata electrical component locations\"\n",
        "references": "## References\n\n[1]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18/contents/08050100.html \"Mazda MX-5 owner information, overheating\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/fuses.pdf \"1990–95 Mazda Miata fuses and safety cautions\"\n[3]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/fuses.pdf \"1990–95 Mazda Miata fuse assignments\"\n[4]: https://exchange.aaa.com/wp-content/uploads/2012/09/AAA-Car-Care-Belts-Hoses.pdf \"AAA Car Care: belts and hoses\"\n[5]: https://www.gatestechzone.com/content/dam/documents-library/operating-manuals/cooling-system-troubleshooting-guide-gb-en.pdf \"Gates Cooling System Troubleshooting Guide\"\n[6]: https://949racing.com/supermiata/tech-info/na-nb-cooling-system-performance/ \"949 Racing: 90–05 NA/NB Miata cooling system performance\"\n[7]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/electrical_component_locations.pdf \"1991 Mazda Miata electrical component locations\""

        "markdown": "# NA chassis: clutch, transmission, differential, brakes, steering, suspension, rust, and top\n\n**Scope.** First-generation MX-5/Miata NA, generally 1989–1997, with US-market references where stated. This is an original diagnostic outline, not a reproduction of factory procedures, diagrams, tables, torque values, or connector pinouts. Mazda’s current owner portal is useful for locating the correct year/market owner material, but its readily indexed content is primarily for later cars; do not substitute a later manual for an NA specification. [1]\n\n## What is solid, and what is conditional\n\nThe NA chassis is a rear-wheel-drive, four-wheel independent-suspension car with hydraulic service brakes and a hydraulic clutch on manual-transmission cars. A 1991 public wiring reference shows the clutch switch, starter-interlock circuit, brake-stop-light switch, parking-brake switch, brake-fluid level sensor, ABS controller/hydraulic unit (where fitted), diagnostic connector, fuse block, ignition switch, and starter as separate circuit elements. [2] The exact equipment is conditional: engine, transmission, differential, ABS, steering wheel position, emissions package, and option package vary by year and market.\n\nA useful model-year anchor is the 1994 change to the 1.8 L car with additional bracing, larger brakes, and availability of the Torsen differential; earlier 1.6 cars and some non-US cars cannot be assumed to share those parts. [3] Treat buyer-guide claims and forum procedures as enthusiast evidence, not as universal specifications. The strongest rust/top consensus is practical rather than a single factory interval: blocked soft-top drains allow water to remain in the sill/rocker area, so inspection must include drain flow and hidden structural metal, not just visible paint. [4] [5]\n\n## Diagnostic procedures\n\n### 1. Clutch disengagement and manual-transmission complaint\n\n**Symptom.** Hard selection into first/reverse, clutch drag, slipping under load, a low or changing pedal, or a gearbox noise that changes when the pedal is pressed.\n\n**Safety.** Chock wheels, keep the engine off for static selection tests, support the car on rated stands at stable points, and never place any body part under a car supported only by a jack. Brake/clutch fluid damages paint; clean spills promptly.\n\n**Tools.** Light, inspection mirror, catch bottle and hose, correct brake/clutch fluid, basic hand tools, ruler or vernier, and a pressure bleeder or a helper.\n\n**Steps.** Start with pedal travel, free play, reservoir level/condition, and evidence of leakage at the master cylinder, line, hose, and slave cylinder. With the engine off, select each gear; then compare reverse and first with the clutch fully depressed. Inspect the slave-cylinder pushrod movement while an assistant operates the pedal. If travel is short or inconsistent, repair the leak/air ingress and bleed before touching the clutch assembly. If travel is normal but the clutch still drags, check release-fork movement, pilot-bearing symptoms, clutch disc installation history, and engine/transmission alignment. For slip, compare engine speed rise against road speed in a high gear under controlled load; do not infer a worn disc solely from a high engagement point.\n\n**Tests.** Repeat the engagement test cold and warm; check whether pumping the pedal changes release; inspect fluid for contamination; road-test only after the hydraulic system is firm and the car can select reverse without grinding.\n\n**Verify.** A successful repair gives repeatable pedal height, full release without gear clash, no external wetness, and no slip in a controlled load test.\n\n**Mistakes.** Replacing a clutch before proving hydraulic travel; using a later NB part assumption; over-pressurizing a brittle old hose; and treating a transmission noise as proof of gearbox failure before checking release bearing, pilot bearing, fluid level, and mounts.\n\n### 2. Driveline noise: transmission, propeller shaft, differential, and axles\n\n**Symptom.** Whine, rumble, clunk on throttle transition, vibration, or noise that follows vehicle speed rather than engine speed.\n\n**Safety.** Do not run a raised car in gear unless using professional restrained equipment and a controlled procedure. Keep hands clear of rotating shafts and hot exhaust parts.\n\n**Tools.** Chassis ears or mechanic’s stethoscope, pry bar, dial indicator if available, drain pan, magnet, and a level lift/stands.\n\n**Steps.** First identify whether the noise changes with engine rpm, selected gear, clutch state, throttle load, or road speed. Inspect transmission and differential housings for impact damage and wet seals, confirm lubricant level with the car level, and inspect drained fluid for abnormal metal without treating a magnet finding as a diagnosis by itself. Check propeller-shaft flange fasteners, universal-joint play, differential mounting bushings, axle boots, wheel bearings, and engine/transmission mounts. A coast-versus-acceleration comparison helps separate gear-mesh load from tires, bearings, and exhaust contact. Only after external checks should a gearbox or differential be removed for internal inspection.\n\n**Tests.** On a quiet road, log the noise in the same gear during acceleration, steady cruise, and closed-throttle coast; compare left/right turns for wheel-bearing changes; check backlash/play only with the manufacturer-appropriate method for the installed differential.\n\n**Verify.** Confirm the repaired component is the one whose sound and load dependence changed, then recheck lubricant leaks and fastener security after a short reinspection drive.\n\n**Mistakes.** Assuming every NA has the same differential; confusing tire cupping or wheel bearings with final-drive whine; tightening or shimming internal gears by feel; and copying a torque value from a different engine, year, or market.\n\n### 3. Brake pull, low pedal, vibration, or ABS warning\n\n**Symptom.** Pulling, a soft/low pedal, dragging wheel, steering shake under braking, or an ABS lamp on an equipped car.\n\n**Safety.** Brakes are safety-critical. Support the car securely, use eye protection, do not reuse contaminated fluid, and do not drive until the pedal is firm and all four corners have been checked.\n\n**Tools.** Brake-fluid tester or clean sample container, pressure bleeder, flare-nut tools, infrared thermometer, dial indicator where available, and a scan/test method appropriate to the installed ABS system.\n\n**Steps.** Verify fluid level and condition, inspect every hose and hard line, and look for caliper/slider leaks. Measure pad/disc condition and compare wheel temperatures after a cautious stop; a hotter corner suggests drag, while a much cooler corner may indicate poor application. Check wheel bearing play, caliper piston/slider freedom, hose restriction, and rear parking-brake mechanism before blaming the master cylinder. If equipped with ABS, inspect the warning circuit and sensor wiring, but do not bypass the system. A low pedal that improves after pumping points toward air, excess clearance, or hydraulic leakage; a firm pedal with poor stopping points toward friction, tire, or mechanical issues.\n\n**Tests.** Static pedal-hold test with the engine off and then assisted; controlled low-speed stop for pull; wheel-temperature comparison; and ABS self-test/diagnostic check only with year-specific information.\n\n**Verify.** The car stops straight, the pedal remains firm during a sustained hold, no wheel overheats, and the warning lamp behavior matches the vehicle’s actual equipment.\n\n**Mistakes.** Bleeding only the visibly bad corner; using ABS assumptions on a non-ABS car; machining/replacing discs without checking bearings and calipers; and relying on pad thickness alone.\n\n### 4. Steering and suspension looseness, wandering, or uneven tire wear\n\n**Symptom.** Wandering, shimmy, clunks, poor return-to-center, uneven wear, or a car that feels different left-to-right.\n\n**Safety.** Inspect on level ground with the car supported at approved points; use a helper for steering movement and keep fingers away from pinch points. Any cracked structural metal or major ball-joint looseness is a stop-driving finding.\n\n**Tools.** Tire gauge, pry bar, dial indicator if available, light, alignment equipment or a reputable alignment shop, and a tread-depth gauge.\n\n**Steps.** Set tire pressures to the vehicle’s correct cold values and inspect tire age, damage, and wear pattern before chassis conclusions. Check wheel-bearing play, tie-rod ends, ball joints, steering rack mounts, control-arm bushings, sway-bar links, dampers, springs, and upper mounts. Use a helper to move the steering wheel through a small arc while observing rack and joint movement. Compare ride height and left/right clearance, then obtain a four-wheel alignment only after worn parts and bent wheels are addressed. Do not use alignment to hide a loose joint or bent arm.\n\n**Tests.** Wheel shake at the correct unloaded positions, pry-bar bushing observation, bounce/settling comparison, and road test on a safe straight section with hands ready to correct.\n\n**Verify.** No measurable unsafe play, matched response on both sides, stable braking/acceleration tracking, and an alignment printout that is plausible for the installed suspension and tire setup.\n\n**Mistakes.** Replacing shocks before checking tires and bearings; tightening suspension fasteners with bushings preloaded at full droop; treating aftermarket ride height as an OEM target; and applying NB/1.8 geometry assumptions to an early 1.6 car.\n\n### 5. Rust, water ingress, and soft-top/drain assessment\n\n**Symptom.** Wet carpet, sloshing water, musty smell, bubbling paint, soft jacking points, rocker/quarter-panel corrosion, or a top that leaks or will not latch/stack correctly.\n\n**Safety.** Wear gloves and eye protection, ventilate when using cleaners, and do not jack on corroded metal. Structural corrosion around sills, suspension pick-up areas, chassis rails, or seat-belt mounts requires qualified body/structural assessment.\n\n**Tools.** Flashlight, trim-safe drain probe/brush, small amount of clean water, magnet, inspection pick used gently, borescope if available, and moisture meter.\n\n**Steps.** Inspect the top fabric, seams, rear window, header seal, side seals, frame pivots, and latch alignment without forcing old material. Clear debris from the top-drain inlets using a flexible, non-puncturing tool; flow-test with a small water pour and verify discharge beneath the car. Inspect the drain outlets, sill/rocker cavities, jacking points, rear quarter areas, floor pans, front chassis rails, suspension pick-up points, and subframe mounts from both sides. Lift carpets only after documenting wetness; trace the water path rather than sealing the first visible seam. Surface rust can be cleaned and protected, but perforation or distortion in load paths is not a cosmetic repair.\n\n**Tests.** Water-flow test, dry-car moisture recheck after 24 hours, magnet/pick comparison between suspect and sound metal, and a professional lift inspection when corrosion is more than superficial.\n\n**Verify.** Drains discharge freely, the cabin remains dry after a controlled water test, the top latches and folds without abnormal force, and no structural corrosion is being mistaken for a top or seal problem.\n\n**Mistakes.** Blasting compressed air into a blocked drain and dislodging a tube; drilling new holes before understanding the original drainage path; coating over scale; and buying a replacement top before locating the leak and checking the frame and header alignment.\n\n## Simplified wiring notes\n\n1. **Start/interlock path (1991 reference).** Battery power is distributed through the main fuse/relay area and ignition switch; the manual-transmission starter-interlock/clutch-switch path then permits the starter-control circuit to operate. A no-crank diagnosis should therefore proceed from battery/grounds and fuse protection to ignition-switch output, clutch/interlock switch operation, relay/control continuity, and starter feed—not by jumping the interlock first. The reference explicitly lists the clutch switch, starter-interlock switch, ignition switch, main relay, fuse block, and starter motor. [2]\n\n2. **Brake input versus ABS control.** The stop-light switch and brake-fluid level sensor are separate low-voltage inputs from the ABS hydraulic/control system shown on ABS-equipped 1991 diagrams. A brake lamp, low-fluid indication, and ABS warning are not interchangeable diagnoses. Confirm which lamp is active, check fluid/leaks and stop-lamp operation, then use year-specific ABS information for sensor or hydraulic faults. [2]\n\n3. **Market/year limits.** The public repository lists separate system diagrams from 1990 through 1997 and later NB years, which is a warning against carrying wire colors, fuse locations, or connector identities across years. Use the diagram matching VIN/year/market and treat the simplified path above as functional orientation only; it intentionally omits proprietary pinouts. [6]\n\n## Differences and uncertainty\n\n- NA production is commonly described as 1989–1997, but registration year, build date, market, engine, emissions package, and option package can differ. Confirm the VIN/build information before parts selection.\n- 1994–1997 1.8 cars generally have the larger-brake/bracing package and different drivetrain details from early 1.6 cars; Torsen availability is option- and market-dependent. [3]\n- ABS was optional or equipment-dependent; never infer its presence from a generic diagram or a replacement-part listing.\n- Enthusiast drain and rust advice is valuable for failure patterns but is not a substitute for a structural inspection. Forum posts can be anecdotal and may describe modified cars.\n\n## References\n\n[1]: https://www.mazdausa.com/owners/how-to-use-my-mazda \"Mazda USA owner resources\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/1991_wiring.pdf \"1991 Mazda MX-5 Miata public wiring reference\"\n[3]: https://www.hagerty.com/media/buying-and-selling/1990-97-mazda-miata-buyers-guide/ \"Hagerty 1990–1997 Mazda Miata buyer guide\"\n[4]: https://forum.miata.net/vb/archive/index.php/t-579357.html \"MX-5 Miata Forum NA drainage discussion\"\n[5]: https://www.octane-magazine.com/articles/buying-guides/mazda-mx-5-mk1-na-buying-guide-history-and-model-review/ \"Octane Mazda MX-5 Mk1 buying guide\"\n[6]: https://www.miataforumz.com/how-40/mazda-miata-wiring-diagrams-1990-2002-a-497/ \"MiataForumz 1990–2002 wiring repository index\"\n",
        "references": "## References\n\n[1]: https://www.mazdausa.com/owners/how-to-use-my-mazda \"Mazda USA owner resources\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/1991_wiring.pdf \"1991 Mazda MX-5 Miata public wiring reference\"\n[3]: https://www.hagerty.com/media/buying-and-selling/1990-97-mazda-miata-buyers-guide/ \"Hagerty 1990–1997 Mazda Miata buyer guide\"\n[4]: https://forum.miata.net/vb/archive/index.php/t-579357.html \"MX-5 Miata Forum NA drainage discussion\"\n[5]: https://www.octane-magazine.com/articles/buying-guides/mazda-mx-5-mk1-na-buying-guide-history-and-model-review/ \"Octane Mazda MX-5 Mk1 buying guide\"\n[6]: https://www.miataforumz.com/how-40/mazda-miata-wiring-diagrams-1990-2002-a-497/ \"MiataForumz 1990–2002 wiring repository index\""
