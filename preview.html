  <noscript><main class="noscript"><h1>Modified Miata Bible</h1><p>This workshop requires JavaScript for its manual reader, garage, and build tools.</p></main></noscript>

const generations = [
  { id:'NA', years:'1990–1997 US', engine:'1.6L / 1.8L BP', note:'The original lightweight roadster. Pop-up lamps, simple systems, and the widest restoration spread.', image:'https://raw.githubusercontent.com/Silverguy80/miata-bible/main/assets/na.jpg', imageCredit:'Ondroeu / Wikimedia Commons', source:'https://commons.wikimedia.org/wiki/File:Mazda_MX-5_NA.jpg', watch:['Rust in sills, rails, and front chassis legs','Cooling-system age and brittle plastics','Timing-belt service history'] },
  { id:'NB', years:'1999–2005 US', engine:'1.8L BP / Mazdaspeed', note:'Fixed lamps, sharper bodywork, and a familiar mechanical core with more trim variation.', image:'https://raw.githubusercontent.com/Silverguy80/miata-bible/main/assets/nb.jpg', imageCredit:'Elise240SX / Wikimedia Commons', source:'https://commons.wikimedia.org/wiki/File:1999_Mazda_MX-5_Miata_Base_in_Highlight_Silver_Metallic,_Front_Left,_08-06-2022.jpg', watch:['Front frame rails and rocker corrosion','Variable trim and brake-package fitment','Timing-belt and cooling history'] },
  { id:'NC', years:'2006–2015 US', engine:'2.0L MZR', note:'A larger, more planted generation. More room, more weight, and more powertrain variations.', image:'https://raw.githubusercontent.com/Silverguy80/miata-bible/main/assets/nc.jpg', imageCredit:'M 93 / Wikimedia Commons', source:'https://commons.wikimedia.org/wiki/File:Mazda_MX-5_NC_front.JPG', watch:['Chassis weight and ride-height choices','PRHT hardware and drains','Cooling, belt, and suspension wear'] },
  { id:'ND', years:'2016–present US', engine:'1.5L / 2.0L SKYACTIV-G', note:'Modern lightness with electronic systems, ND1/ND2/ND3 changes, and the RF fastback.', image:'https://raw.githubusercontent.com/Silverguy80/miata-bible/main/assets/nd.jpg', imageCredit:'Flyz1 / Wikimedia Commons', source:'https://commons.wikimedia.org/wiki/File:Mazda_MX-5_(MSP16).jpg', watch:['ND1/ND2/ND3 engine and ECU deltas','Electronic diagnostics before parts swapping','RF roof and body-seal inspection'] }
];

const miataHistory = [
  {period:'1989–1993 · NA early years',generation:'NA',years:'1990–1993 model years in the United States',headline:'The lightweight roadster arrives',summary:'The NA introduced Mazda’s front-engine, rear-wheel-drive two-seat roadster formula to the United States. Early cars used the 1.6L engine, five-speed manual, pop-up lamps, and a very low curb weight. Automatic transmission and ABS became available for 1991; special editions followed, including British Racing Green and Sunburst Yellow.',milestones:['1989: Chicago Auto Show debut; U.S. sale begins as a 1990 model.','1991: Automatic transmission and ABS become available; first U.S. special edition arrives.','1992: Sunburst Yellow special edition.','1993: Black/red-leather Limited Edition with Bilstein dampers and BBS wheels.'],service:'Early-car priorities: rust, cooling plastics, timing-belt history, seals, brakes, and evidence of chassis repair.',source:'https://www.mazdausa.com/discover/mazda-mx-5-miata-fans'},
  {period:'1994–1997 · NA late years',generation:'NA',years:'1994–1997 model years in the United States',headline:'More displacement, protection, and electronics',summary:'The 1.8L engine replaced the original 1.6L in the U.S. lineup for 1994, bringing more power, larger brakes, additional bracing, and a passenger airbag. The available Torsen limited-slip differential replaced the earlier viscous unit in applicable packages. OBD-II arrived for 1996.',milestones:['1994: 1.8L engine, larger brakes, additional bracing, passenger airbag, and new option structure.','1994–1997: R Package and M Edition variants add suspension, wheel, and trim differences.','1996: OBD-II controls and a power increase for the 1.8L.','1997: Final NA model year; STO and M Edition close the generation.'],service:'Late NA fitment depends heavily on 1.6 versus 1.8, brake package, ABS, differential, and OBD generation.',source:'https://www.caranddriver.com/features/g26111823/mazda-mx-5-miata-history/'},
  {period:'1998–2000 · NB launch',generation:'NB',years:'1999–2000 model years in the United States',headline:'Fixed lamps and a deeper mechanical package',summary:'The NB replaced the pop-up headlights with fixed lamps and introduced new bodywork and interior while retaining the familiar lightweight rear-drive character. The U.S. 1.8L received generation-specific intake, exhaust, control, and chassis changes. The early NB is not simply an NA parts catalog with a different nose.',milestones:['1997: NB debuts at the Tokyo Motor Show.','1999: NB goes on sale in the United States with fixed headlamps and redesigned body/interior.','2000: Additional chassis and engine updates arrive; the model reaches a Guinness-recognized sales milestone.'],service:'Confirm NB year, engine control system, brakes, immobilizer/security equipment, and market before ordering parts.',source:'https://www.mazdausa.com/discover/mazda-mx-5-miata-fans'},
  {period:'2001–2005 · NB development',generation:'NB',years:'2001–2005 model years in the United States',headline:'Special editions, variable valve timing, and Mazdaspeed',summary:'The NB matured through trim and calibration changes, special editions, and later performance variants. The Mazdaspeed MX-5 added factory turbocharging and its own cooling, intake, exhaust, clutch, ECU, and chassis considerations. Not every NB engine, brake, sensor, or ECU part is interchangeable.',milestones:['2001: Mid-generation updates bring revised equipment and engine-control changes.','2002–2003: Special editions and trim packages create fitment variation.','2004–2005: Mazdaspeed MX-5 turbo model adds factory forced-induction hardware and unique calibration.'],service:'Use exact year, engine, turbo/non-turbo status, brake package, and market when following NB procedures.',source:'https://www.caranddriver.com/features/g26111823/mazda-mx-5-miata-history/'},
  {period:'2005–2008 · NC launch',generation:'NC',years:'2006–2008 model years in the United States',headline:'A larger platform with the MZR 2.0L',summary:'The NC launched after its 2005 international debut with a larger, more planted chassis and a 2.0L MZR engine in the U.S. The retractable hardtop became an important body-style branch soon afterward. NC service planning must account for greater mass, different suspension geometry, electronic systems, and PRHT hardware.',milestones:['2005: Third-generation NC launches internationally.','2006: NC reaches the U.S. market with the 2.0L engine.','2007: Power Retractable Hard Top becomes available.','2008: Trim and equipment changes continue while the core platform remains NC.'],service:'Check soft-top versus PRHT, transmission, ABS/DSC, engine-control, and underbody hardware before parts selection.',source:'https://www.mazdausa.com/discover/mazda-mx-5-miata-fans'},
  {period:'2009–2012 · NC refresh',generation:'NC',years:'2009–2012 model years in the United States',headline:'NC2 refresh and equipment development',summary:'The NC received a substantial refresh during this period, with changes to styling, engine control, equipment, and trim. Special editions and suspension packages can change brakes, wheels, dampers, and alignment assumptions.',milestones:['2009: Refreshed body and equipment; generation-specific service and body parts matter.','2010–2011: Trim and special-edition combinations continue to vary.','2012: Late-NC equipment and color changes lead toward the final refresh.'],service:'Do not assume every NC electrical, body, or suspension part crosses NC1/NC2/NC3 without verification.',source:'https://www.caranddriver.com/features/g26111823/mazda-mx-5-miata-history/'},
  {period:'2013–2015 · NC final years',generation:'NC',years:'2013–2015 model years in the United States',headline:'Final NC revisions and Club focus',summary:'The final NC years added revised trim and performance equipment while preserving the third-generation platform. Later cars can have different brakes, dampers, wheels, electronics, and interior/body details from earlier NCs.',milestones:['2013: Late refresh and Club-oriented equipment expand the setup choices.','2014: Special editions and final-year trim combinations continue.','2015: Final NC model year before the ND transition.'],service:'Treat late NC as its own fitment branch when selecting chassis, brake, body, and control parts.',source:'https://www.caranddriver.com/features/g26111823/mazda-mx-5-miata-history/'},
  {period:'2014–2017 · ND launch and RF',generation:'ND',years:'2016–2017 model years in the United States',headline:'The fourth generation returns to compact lightness',summary:'The ND was unveiled in the United States in 2014 and went on sale for the 2016 model year. It returned to a smaller, lighter footprint while introducing SKYACTIV-G engines, modern networked electronics, and new suspension/body architecture. The RF retractable fastback joined for 2017.',milestones:['2014: ND unveiled in the United States.','2016: First U.S. ND model year with SKYACTIV-G powertrains.','2017: RF retractable fastback joins the roadster.'],service:'Separate ND soft-top and RF procedures, and confirm 1.5L/2.0L, transmission, market, and electronic revision.',source:'https://www.mazdausa.com/discover/mazda-mx-5-miata-fans'},
  {period:'2018–2023 · ND2 development',generation:'ND',years:'2018–2023 model years in the United States',headline:'More power and revised safety/electronic content',summary:'Later ND cars received important engine, control, trim, and safety changes. The 2.0L upgrade commonly called ND2 is not a universal retrofit assumption; calibration, engine, transmission, intake/exhaust, and chassis compatibility must be verified.',milestones:['2018: Important 2.0L and equipment updates arrive for applicable cars.','2019: 30th Anniversary Racing Orange edition marks three decades of MX-5.','2020–2023: Trim, safety, color, and equipment changes continue across soft-top and RF forms.'],service:'Use the exact model year and engine-control revision for ECU, engine, clutch, exhaust, and sensor work.',source:'https://www.caranddriver.com/features/g26111823/mazda-mx-5-miata-history/'},
  {period:'2024–present · ND3 era',generation:'ND',years:'2024 model year onward in the United States',headline:'Updated electronics, safety, and continued roadster formula',summary:'The current ND era continues the lightweight roadster and RF formats while adding newer electronic, safety, interface, and trim revisions. Current-year fitment and software should be checked against the VIN and authorized information before service.',milestones:['2024: ND3-era updates begin with revised equipment and electronic content.','Current: Roadster and RF body styles continue with market-specific trim and calibration differences.'],service:'Treat current cars as VIN- and software-sensitive; use current service information for network, safety, ADAS, and calibration work.',source:'https://www.mazdausa.com/discover/mazda-mx-5-miata-fans'}
];

const books = [
  {id:'orientation', number:'01', title:'Orientation & workshop practice', pages:18, description:'How to use this manual, work safely, identify the car, and set up a repeatable inspection.'},
  {id:'fitment', number:'02', title:'Identification & fitment', pages:16, description:'Generation, engine, market, transmission, trim, and part-number discipline.'},
  {id:'maintenance', number:'03', title:'Maintenance & inspection', pages:22, description:'Service cadence, fluids, belts, hoses, storage, and inspection sheets.'},
  {id:'diagnostics', number:'04', title:'Troubleshooting & fault-finding', pages:86, description:'Symptom-first diagnosis for no-starts, overheating, charging, drains, rough running, warning lights, driveline complaints, brake pull, leaks, noises, and electrical faults.'},
  {id:'engine', number:'05', title:'Engine mechanical systems', pages:34, description:'Compression, leak-down, timing, lubrication, sealing, and mechanical health.'},
  {id:'fuel', number:'06', title:'Fuel, intake, ignition & emissions', pages:22, description:'Air metering, fuel delivery, ignition, sensors, vacuum, and ECU context.'},
  {id:'cooling', number:'07', title:'Cooling, heating & A/C', pages:18, description:'Thermal management, fans, radiators, thermostats, HVAC, and refrigerant safety.'},
  {id:'driveline', number:'08', title:'Clutch, transmission & driveline', pages:28, description:'Clutch hydraulics, gearboxes, differential, axles, hubs, and driveline noise.'},
  {id:'chassis', number:'09', title:'Brakes, steering & suspension', pages:34, description:'Brake systems, ABS, steering, alignment, suspension, tires, and chassis setup.'},
  {id:'body', number:'10', title:'Body, top, leaks & corrosion', pages:18, description:'Soft tops, RF/PRHT notes, drains, seals, rust triage, glass, and trim.'},
  {id:'electrical', number:'11', title:'Electrical, lighting & accessories', pages:22, description:'Lighting, windows, instruments, charging, starting, switches, and accessories.'},
  {id:'generation', number:'12', title:'Generation books: NA / NB / NC / ND', pages:54, description:'Known differences, recurring checks, engine families, and fitment deltas by chassis.'},
  {id:'builds', number:'13', title:'Performance builds & track engineering', pages:96, description:'Street, autocross, HPDE, track, naturally aspirated, forced-induction, cooling, braking, suspension, safety, data logging, and repeatable setup.'},
  {id:'index', number:'14', title:'Indexes, forms & job sheets', pages:14, description:'Symptom index, component index, sources, inspection logs, and printable worksheets.'}
];

const common = {tools:['Floor jack and stands','Torque wrench','Inspection light','Nitrile gloves'], sources:['Mazda owner/service information for the exact VIN and market','OEM parts catalog or verified supplier fitment'], related:[]};

const procedures = [
  {id:'safe-lift',book:'orientation',system:'Safety',title:'Lift and support the Miata safely',applies:['NA','NB','NC','ND'],tags:['lift','jack','stands','safety'],difficulty:'Foundational',time:'30–45 min',symptoms:'Before any under-car inspection or repair.',tools:['Quality floor jack','Four rated stands','Wheel chocks','Flat working surface'],safety:'Never work under a vehicle supported only by a jack. Confirm the stand points for your generation before loading them.',steps:['Park on a hard, level surface and set the parking brake.','Chock the wheels that remain on the ground.','Use the correct front or rear lift point for the chassis, then place stands at verified structural support points.','Lower the car onto the stands, test stability, and keep the jack lightly positioned only as a secondary support.'],verify:'The vehicle is stable, level enough for the job, and cannot roll or rock under controlled hand pressure.',mistakes:'Using a pinch weld that is already rust-thinned; lifting one corner when the procedure requires a level car.',...common},
  {id:'fitment-id',book:'fitment',system:'Identification',title:'Build a fitment record before ordering parts',applies:['NA','NB','NC','ND'],tags:['fitment','vin','part number','trim'],difficulty:'Foundational',time:'15 min',symptoms:'Any repair or modification with multiple trim or market variants.',tools:['Phone camera','Notebook or build log'],safety:'A fitment record prevents expensive mistakes; it does not replace checking the current parts catalog.',steps:['Record VIN, production date, generation, engine, transmission, market, body style, ABS status, and current wheel/brake setup.','Photograph the original part, connector, mounting pattern, and label.','Record the old part number and compare it to the replacement supplier’s application notes.','Keep uncertain fitment marked as conditional until a physical or catalog match is confirmed.'],verify:'The part can be traced to the car’s exact configuration and the replacement number is documented.',mistakes:'Assuming all NB, ND, or “Club” parts are interchangeable.',...common},
  {id:'maintenance-baseline',book:'maintenance',system:'Inspection',title:'Create a first-day condition baseline',applies:['NA','NB','NC','ND'],tags:['inspection','baseline','used car'],difficulty:'Foundational',time:'2–4 hr',symptoms:'A newly purchased or newly acquired Miata with incomplete records.',tools:['Tire gauge','Flashlight','Paper towels','Paint marker'],safety:'Do not road-test a car with an active fuel leak, unsafe tire, severe brake fault, or loose wheel.',steps:['Photograph the car, odometer, warning lights, engine bay, underbody, tires, and fluid reservoirs.','Record cold-start behavior, idle quality, temperature behavior, clutch feel, brake feel, steering feel, and noises.','Mark urgent safety items separately from deferred maintenance and cosmetic work.','Create a parts-and-evidence list before buying anything.'],verify:'The baseline separates “must not drive,” “service soon,” and “monitor” items.',mistakes:'Starting with cosmetic upgrades before verifying brakes, tires, fluids, cooling, and rust.',...common},
  {id:'oil-service',book:'maintenance',system:'Lubrication',title:'Plan an engine oil and filter service',applies:['NA','NB','NC','ND'],tags:['oil','filter','service'],difficulty:'Foundational',time:'45–75 min',symptoms:'Routine service, unknown history, or oil contamination concern.',tools:['Drain pan','Filter wrench','Correct oil and filter','New sealing washer if specified'],safety:'Confirm the exact oil specification and capacity for the engine before filling. Keep hot oil off skin.',steps:['Confirm engine, market, capacity, filter, and service interval.','Warm the engine appropriately, then secure the vehicle if access requires lifting.','Drain into a clean pan and inspect for coolant, fuel smell, glitter, or unusual debris.','Install the correct filter and sealing hardware, fill in stages, check the level, and inspect for leaks.'],verify:'Oil level is correct on the specified measurement surface and the filter/drain area remains dry after running.',mistakes:'Overfilling; relying on a generic capacity; tightening a filter dry or with the wrong seal.',...common},
  {id:'cooling-triage',book:'cooling',system:'Cooling',title:'Diagnose an overheating complaint',applies:['NA','NB','NC','ND'],tags:['overheating','radiator','fan','thermostat'],difficulty:'Intermediate',time:'1–3 hr diagnosis',symptoms:'Temperature rise, coolant loss, fan concern, hot smell, or heater output change.',tools:['Cooling-system pressure tester','Infrared thermometer','Scan tool where supported'],safety:'Never open a hot pressurized cooling system. Let the car cool fully before removing a cap or hose.',steps:['Record when the temperature rises: idle, highway, load, or after shutdown.','Inspect level, cap, radiator airflow, hoses, belt routing, and visible leak paths cold.','Verify fan command and actual fan operation using the generation-appropriate procedure.','Pressure-test only with a cool system and trace leaks before replacing parts.','Refill and bleed using the correct method for the chassis and confirm stable temperature.'],verify:'The original symptom is reproduced or eliminated, and the system holds pressure without unexplained loss.',mistakes:'Replacing a thermostat without checking airflow, fan control, cap, leaks, or trapped air.',...common},
  {id:'no-start',book:'diagnostics',system:'Starting / ignition / fuel',title:'No-start: crank but will not fire',applies:['NA','NB','NC','ND'],tags:['no start','crank','spark','fuel','diagnosis'],difficulty:'Intermediate',time:'1–4 hr diagnosis',symptoms:'Starter turns the engine but it does not run.',tools:['Multimeter','Approved spark tester','Fuel-pressure test method for the model','Scan tool where supported'],safety:'Fuel vapors ignite easily. Do not create sparks and do not open a pressurized system without the correct procedure.',steps:['Confirm battery voltage and cranking speed before interpreting other tests.','Record diagnostic codes and freeze-frame data if available.','Establish whether the engine has the required spark, fuel delivery, injector command, compression, and timing signal.','Test power, ground, fuses, relays, connectors, and grounds with the wiring diagram.','Change one variable at a time and document the result.'],verify:'The failed requirement is identified before a component is replaced.',mistakes:'Swapping sensors based on internet folklore; clearing codes before recording them; ignoring low cranking voltage.',...common},
  {id:'parasitic-draw',book:'diagnostics',system:'Electrical',title:'Find a parasitic battery draw',applies:['NA','NB','NC','ND'],tags:['battery','draw','electrical','sleep'],difficulty:'Advanced',time:'1–3 hr diagnosis',symptoms:'Battery goes flat after sitting despite charging correctly while driving.',tools:['Fused current meter','Battery charger','Wiring diagram'],safety:'Never place an unfused meter in a high-current path or crank the engine through the meter.',steps:['Fully charge the battery and confirm it can hold charge.','Allow the vehicle to enter its normal sleep state, accounting for alarms, accessories, and modules.','Measure the baseline current using the correct fused setup.','Remove one fuse or isolate one circuit at a time, then trace the changed circuit to the component or wiring fault.','Restore the system and confirm the final draw after sleep.'],verify:'The draw is repeatable and the suspect circuit is isolated without relying on guesswork.',mistakes:'Pulling fuses before the car sleeps; waking modules during the test; using a meter without a fused lead.',...common},
  {id:'compression-plan',book:'engine',system:'Engine mechanical',title:'Plan a useful compression test',applies:['NA','NB','NC','ND'],tags:['compression','engine health','leakdown'],difficulty:'Intermediate',time:'1–2 hr',symptoms:'Hard starting, low power, misfire, oil use, or pre-purchase engine-health check.',tools:['Compression gauge','Battery charger','Model-specific disabling method'],safety:'Follow the exact engine-specific method for disabling fuel and ignition. Keep connectors and fuel vapors controlled.',steps:['Warm the engine as required, then prepare the approved fuel/ignition disable method.','Use a consistent battery state and record the number of pulses per cylinder.','Compare cylinders to one another and to current service limits.','If a cylinder is low, plan a wet test or leak-down test to separate ring, valve, and head-gasket clues.'],verify:'The result includes conditions, readings, and comparison notes—not just one number.',mistakes:'Testing with a weak battery; comparing different pulse counts; treating one low reading as a diagnosis.',...common},
  {id:'clutch-hydraulic',book:'driveline',system:'Clutch hydraulics',title:'Diagnose a low or inconsistent clutch pedal',applies:['NA','NB','NC','ND'],tags:['clutch','master','slave','bleed'],difficulty:'Intermediate',time:'1–2 hr',symptoms:'Engagement changes, hard shifting, pedal sinks, or clutch drags.',tools:['Flashlight','Correct fluid','Bleed equipment'],safety:'Keep fluid off paint and never let the reservoir run dry during bleeding.',steps:['Record pedal height, free play, bite point, and changes between cold and warm operation.','Inspect master, line, fittings, slave, and bellhousing area for dampness.','Check for air or contaminated fluid using the correct bleed sequence.','After service, confirm release, engagement, and leak-free operation.'],verify:'The pedal is consistent and the clutch releases without forcing gears or creeping.',mistakes:'Replacing the clutch before checking hydraulics; letting the reservoir empty; ignoring a damp firewall or slave.',...common},
  {id:'brake-inspection',book:'chassis',system:'Brakes',title:'Perform a brake safety inspection',applies:['NA','NB','NC','ND'],tags:['brakes','pads','rotors','fluid'],difficulty:'Foundational',time:'60–90 min',symptoms:'Routine inspection, noise, pull, vibration, or track preparation.',tools:['Wheel chocks','Tread-depth gauge','Brake measurement tools','Torque wrench'],safety:'Brake work is safety-critical. Do not drive with a soft pedal, severe leak, loose caliper, or damaged hose.',steps:['Inspect pad thickness, rotor condition, hose condition, caliper hardware, and fluid level.','Look for uneven wear, overheating, contamination, and seized guide hardware.','Measure against the correct generation and brake-package limits.','After any work, restore pedal pressure and test at low speed in a safe area.'],verify:'All four corners are documented and any measurement is tied to the correct brake package.',mistakes:'Mixing brake fitment across trims; lubricating friction surfaces; judging by pad thickness alone.',...common},
  {id:'alignment-baseline',book:'chassis',system:'Suspension / alignment',title:'Create an alignment and tire-wear baseline',applies:['NA','NB','NC','ND'],tags:['alignment','tires','suspension','handling'],difficulty:'Intermediate',time:'1–2 hr inspection',symptoms:'Pulling, wandering, uneven wear, or a new suspension setup.',tools:['Tire gauge','Tread-depth gauge','Ride-height notes','Alignment shop worksheet'],safety:'Inspect for loose or damaged suspension parts before driving to an alignment shop.',steps:['Record cold pressures, tire sizes, date codes, and tread depth at multiple points.','Measure ride height consistently and note steering-wheel position.','Inspect ball joints, tie rods, bushings, wheel bearings, and spring/damper fitment.','Obtain a four-wheel alignment and record the actual before/after values.'],verify:'Tire wear, ride height, and alignment values can be compared at the next inspection.',mistakes:'Chasing alignment numbers before fixing worn joints; changing several variables without notes.',...common},
  {id:'wheel-torque',book:'chassis',system:'Wheels / tires',title:'Install a wheel and verify torque',applies:['NA','NB','NC','ND'],tags:['wheels','lug nuts','torque','safety'],difficulty:'Foundational',time:'30–45 min',symptoms:'Wheel removal, tire service, or new wheel installation.',tools:['Torque wrench','Correct socket','Brush','Wheel chocks'],safety:'Use the correct seat type and hardware. Never rely on an impact gun for final torque.',steps:['Inspect wheel seats, studs, nuts, hub faces, and wheel clearance.','Start every fastener by hand and snug in a star pattern.','Lower enough to prevent rotation, then torque to the verified value for the exact hardware.','Recheck after the first short drive when a wheel has been removed.'],verify:'Hardware type and torque value are recorded in the build log.',mistakes:'Mixing cone and ball seats; anti-seize on studs without manufacturer approval; skipping the recheck.',...common},
  {id:'soft-top-drains',book:'body',system:'Convertible top / water management',title:'Clean and verify soft-top drains',applies:['NA','NB','NC','ND'],tags:['soft top','drains','water leak','convertible'],difficulty:'Foundational',time:'45–90 min',symptoms:'Wet carpets, water in the seat-belt tower, mildew, or slow drainage.',tools:['Flexible purpose-made drain tool','Gentle water source','Dry towels'],safety:'Do not use a rigid wire that can puncture a drain or force debris into the body cavity.',steps:['Remove loose debris from the top well and drain entrances.','Use a gentle cleaning method and watch below the car for the expected exit path.','Inspect header, side, and quarter seals for gaps or tears.','Dry the cabin and repeat a controlled water test.'],verify:'Water exits through the intended drains and the cabin remains dry after testing.',mistakes:'Pressure-washing seals; pushing debris deeper; sealing over rust or blocked drains.',...common},
  {id:'rust-triage',book:'body',system:'Body / chassis',title:'Triage rust before modifying the car',applies:['NA','NB','NC','ND'],tags:['rust','corrosion','chassis','restoration'],difficulty:'Intermediate',time:'2–4 hr inspection',symptoms:'Bubbling paint, flaking underbody, soft seams, or an unknown-history car.',tools:['Inspection light','Camera','Small probe for sound metal only','Cleaning supplies'],safety:'Do not puncture weakened structural areas or assume undercoating means protection.',steps:['Wash and dry the car so corrosion and seam damage are visible.','Inspect rocker seams, floor drains, subframes, suspension mounts, wheel arches, and windshield surrounds.','Photograph and date each finding before removing trim or coatings.','Separate cosmetic surface rust from structural corrosion that needs qualified fabrication.'],verify:'Each concern has a location, photo, severity, and recommended next action.',mistakes:'Hiding rust with undercoating; treating a structural area like a cosmetic paint job.',...common},
  {id:'charging-check',book:'electrical',system:'Starting / charging',title:'Check charging voltage and ground quality',applies:['NA','NB','NC','ND'],tags:['alternator','battery','ground','voltage drop'],difficulty:'Foundational',time:'45–90 min',symptoms:'Slow cranking, battery warning, dim lights, or repeated battery failure.',tools:['Multimeter','Battery charger','Back-probe leads'],safety:'Keep probes clear of belts and pulleys. Prevent accidental shorts at the positive terminal.',steps:['Inspect terminals, hold-down, battery grounds, engine ground strap, and belt condition.','Test rested battery voltage, cranking behavior, and charging voltage under sensible loads.','Use voltage-drop tests across positive and ground paths rather than relying only on static resistance.','Repair the connection or charging fault, then repeat the test.'],verify:'Battery, cable, ground, and alternator results are documented separately.',mistakes:'Replacing an alternator before checking grounds; trusting a clean-looking terminal; measuring resistance only.',...common},
  {id:'lighting-fault',book:'electrical',system:'Lighting',title:'Diagnose one exterior light that does not work',applies:['NA','NB','NC','ND'],tags:['headlight','tail light','fuse','connector'],difficulty:'Foundational',time:'30–90 min',symptoms:'One lamp, side, or function is dark or intermittent.',tools:['Multimeter or test light','Wiring diagram','Replacement bulb only after testing'],safety:'Some systems use switched grounds, modules, or high-current circuits. Test according to the diagram.',steps:['Confirm the symptom with the switch in each relevant position.','Inspect bulb, socket, connector, grounds, fuse, and wiring for heat or corrosion.','Check for power and ground at the socket under load.','Repair the root cause and verify all related lamps.'],verify:'The test identifies whether the fault is supply, control, ground, connector, or lamp.',mistakes:'Installing a bulb repeatedly into a melted socket; assuming a fuse is the only possible fault.',...common},
  {id:'pre-track',book:'builds',system:'Track preparation',title:'Prepare a street Miata for a track day',applies:['NA','NB','NC','ND'],tags:['track','safety','tires','brakes'],difficulty:'Advanced',time:'4–8 hr',symptoms:'Preparing a road car for a first event or new season.',tools:['Inspection tools','Tire gauge','Torque wrench','Notebook'],safety:'Track use raises heat and load. A street inspection is not a substitute for a qualified inspection of a modified car.',steps:['Inspect brakes, fluid, pedal, tires, wheel torque, hubs, leaks, belts, battery hold-down, and loose trim.','Verify seat, belt, helmet, and roll-bar geometry where applicable.','Start with conservative tire pressures and log hot pressures and temperatures.','Change one setup variable at a time and record what the car actually did.'],verify:'The car has a written inspection record, baseline pressures, and a plan for returning to road trim.',mistakes:'Adding power before tires and brakes; chasing internet setup numbers without measuring the car.',...common},
  {id:'na-nb-clutch-lightweight-flywheel',book:'driveline',system:'Clutch / driveline',title:'NA/NB clutch upgrade and lightweight flywheel — complete job plan',applies:['NA','NB'],tags:['clutch','flywheel','lightweight','transmission','pilot bearing','release bearing','hydraulics','break-in'],difficulty:'Advanced',time:'10–16 hr first-time DIY',symptoms:'Slipping under load, clutch chatter, high engagement point, noisy release bearing, leaking rear main seal, or a planned torque-capacity and response upgrade.',tools:['Transmission jack or stable transmission-support solution','Full socket and wrench set with long extensions and universal joints','Clutch alignment tool matched to the replacement disc','Pilot-bearing puller or approved extraction method','Torque wrench covering the exact fastener ranges','Brake cleaner or non-petroleum friction-surface cleaner','Drain pan, line plugs, paint marker, inspection light','New clutch kit, matched flywheel, pilot bearing/bushing, release bearing, rear cover gasket/seal as needed, fresh gearbox oil'],safety:'This is a heavy under-car job. Support the vehicle on rated stands at verified structural points, support the transmission before removing the PPF/tunnel hardware, disconnect the battery before starter work, and never use the transmission bolts to pull a misaligned gearbox into the engine. Keep friction surfaces dry and stop if the bellhousing, flywheel, crank flange, or chassis threads are damaged.',steps:['Confirm the exact car before buying parts. Record year, engine, transmission, market, clutch diameter, input-spline pattern, flywheel type, and whether the car has a turbo kit or other torque increase. The 1.6, 1.8, Mazdaspeed, five-speed, and six-speed combinations are not a single universal fitment.','Choose the clutch by use and torque, not by the largest stage number. A street organic disc generally preserves smoother engagement; more aggressive compounds can raise pedal effort, noise, heat sensitivity, and driveline shock. A flywheel and clutch must be a matched working set when the kit requires it.','Before disassembly, road-test and record the symptom: slip in a high gear, chatter on takeoff, gear clash with the pedal down, bearing noise, or hydraulic fade. Check pedal free play, master/slave travel, fluid condition, and leaks so a hydraulic fault is not mistaken for a worn disc.','Measure and photograph the existing setup. Mark driveshaft-to-differential orientation, label electrical connectors, and bag hardware by location. Drain the transmission before lowering it; remove the shift lever and inspect the turret oil while access is easy.','Remove the exhaust and undertrays required for access, then disconnect the battery negative cable. Remove the driveshaft after marking its flange orientation. Keep the driveshaft supported and protect the seal and splines from dirt.','Unbolt the slave cylinder and hydraulic-line bracket, then move the slave aside without hanging its hose. Remove the starter and any sensors, grounds, braces, or brackets that cross the bellhousing. Do not open the hydraulic circuit unless you are replacing or bleeding it.','Support the transmission with a transmission jack. Remove the PPF/tunnel brace and transmission mount using a controlled sequence. Keep the differential supported as the driveline load changes; do not allow the powertrain to rotate onto a hose, harness, or shifter turret.','Remove the bellhousing fasteners and separate the transmission straight back. If it will not release, stop and find the remaining fastener or dowel bind. Never pry against a machined sealing surface and never draw the transmission in with bellhousing bolts.','Inspect the input shaft splines, pilot nose, front seal area, release fork, pivot ball, guide tube, and bellhousing for cracks or abnormal wear. Any oil on the friction disc requires source diagnosis before installing new parts.','Remove the pressure plate gradually in a crisscross pattern so spring load is released evenly. Remove the disc and flywheel with the crank locked using the correct tool; do not use the starter ring gear as a pry point.','Inspect the rear main seal area, rear cover, crank flange, flywheel locating surface, dowel pins, and threaded holes. Replace a leaking seal only after confirming the leak source; a new seal installed too deep, crooked, or on a worn seal track can create a new leak.','Replace the pilot bearing/bushing while access is available. Note the original depth, extract it without scoring the crank, lightly lubricate only where the bearing design permits, and drive the new unit squarely to the verified depth. Do not pack the cavity with grease or use a random depth from another engine.','Select the lightweight flywheel with a clear tradeoff in mind. Lower rotational inertia improves rev response and heel-toe feel, but can increase closed-throttle gear rattle, make takeoff less forgiving, and expose driveline lash. Weight is only one variable; inertia distribution, balance, friction-surface height, ring gear, and clutch diameter matter.','Have a used flywheel resurfaced only by a shop that can preserve the correct friction-surface height and step. Replace a flywheel that is cracked, heat-checked beyond service limits, warped, below minimum thickness, or incompatible with the new clutch. Follow the kit maker’s rule for single-mass conversions; do not assume an OEM dual-mass unit can be machined.','Clean the crank flange and flywheel mating surfaces. Install the replacement flywheel with new fasteners when required, the specified thread-sealing compound where the fastener enters an oil-wet area, and the exact year/engine torque sequence. Tighten in stages and a star pattern; record the source specification on the job sheet instead of using a generic internet number.','Clean both friction faces with non-petroleum cleaner. Install the disc in the correct orientation using the alignment tool. Confirm the hub springs and protruding hub face are on the side specified by the kit; an inverted disc can clamp but will not operate correctly.','Install the pressure plate over the dowels, start every bolt by hand, and tighten in a gradual crisscross pattern. Torque only to the exact clutch/flywheel specification. Remove the alignment tool only after the plate is fully and evenly seated.','Service the release fork and pivot. Apply only a thin film of the manufacturer-approved lubricant to the pivot and guide surfaces; keep grease off the disc, flywheel, pressure plate, and release-bearing face. Install the new release bearing and confirm the retaining spring is completely engaged.','Test-fit the transmission input shaft through the disc and pilot bearing. If the gearbox will not slide home with light hand pressure and small controlled rotation, remove it and correct alignment. Do not use bellhousing bolts to force engagement.','Reinstall the transmission, bellhousing, PPF, mount, driveshaft, starter, slave cylinder, exhaust, braces, shifter, and undertrays in the reverse sequence. Restore grounds and connectors. Refill the transmission with the correct fluid and level for the exact gearbox.','Bleed the clutch hydraulics only if the system was opened or pedal travel remains wrong. Set pedal free play to the vehicle-specific requirement. Verify the slave-cylinder pushrod is not preloading the release fork and that the clutch fully releases before driving.','Before starting, rotate the engine by hand if access allows, confirm no tool or wiring is trapped, check for leaks, and confirm the starter interlock and neutral-start behavior are intentional. Start in neutral, listen for abnormal contact, then select gears with the clutch depressed.','Perform a stationary test for reverse engagement and creep, then a low-speed road test. Check for clutch slip under controlled load, chatter, vibration, gear clash, release noise, fluid leaks, and driveline vibration. Stop immediately for a smell of burning friction material, severe chatter, or a pedal that does not return.','Break in the clutch using the kit maker’s instructions. As a conservative street baseline, avoid launches, high-rpm shifts, and repeated slip until the friction surfaces have completed their bedding period; EXEDY publishes a 500-city-mile or 1,000-highway-mile easy-driving recommendation for its OE replacement kits, but the supplied kit instructions control.','After break-in, recheck fluid leaks, pedal feel, fastener witness marks, and any new gear rattle. Record clutch brand, disc compound, flywheel weight, resurfacing or replacement decision, torque-source document, mileage, and break-in completion in the Modified Miata history.'],verify:'The pedal has consistent travel, the clutch releases without creep, all gears engage hot and cold, the clutch holds the engine’s actual torque without slip, the flywheel and clutch produce no unsafe vibration, and the system is leak-free after a complete heat cycle and road test.',mistakes:'Buying a clutch by generation alone; mixing a clutch and flywheel with different diameter or step height; reusing a heat-spotted flywheel; contaminating friction surfaces with grease; forgetting the pilot bearing; pulling the transmission in with bolts; leaving the slave cylinder preloaded; skipping break-in; or using a generic torque value when the exact engine/transmission source is available.',sources:['https://flyinmiata.com/products/fm-na-nb-clutch-flywheel-happy-meal','https://www.exedyusa.com/faq/','https://www.youtube.com/watch?v=kuW20YByn-4'],recommendations:[{name:'Flyin’ Miata NA/NB Happy Meal',kind:'Best supported all-in-one',why:'A matched clutch and lightweight-flywheel package covering 1990–2005 fitment, with pilot/release bearings included. It costs more than piecing together parts, but reduces compatibility risk and gives one supplier a documented installation path.',url:'https://flyinmiata.com/products/fm-na-nb-clutch-flywheel-happy-meal'},{name:'Flyin’ Miata Level 1 clutch',kind:'Value performance choice',why:'A sensible street/turbo-on-stock-internals option when you already have a compatible flywheel. Near-stock manners are more useful for most road cars than an aggressive race disc.',url:'https://flyinmiata.com/products/fm-level-1-clutch'},{name:'Flyin’ Miata NA/NB flywheel locking tool',kind:'Low-cost job tool',why:'A purpose-made locking tool is cheap insurance when breaking loose and accurately torquing flywheel fasteners; safer than improvising against the ring gear.',url:'https://flyinmiata.com/products/flywheel-locking-tool-na-nb'}],recommendationDisclosure:'Editorial links only. No paid sponsorship or affiliate relationship is claimed. Verify exact year, engine, transmission, clutch diameter, and current supplier fitment before ordering.',related:['clutch-hydraulics','driveline-noise']},
  {id:'nc-clutch-lightweight-flywheel',book:'driveline',system:'Clutch / driveline',title:'NC clutch and lightweight flywheel replacement — powertrain removal without shortcuts',applies:['NC'],tags:['NC','clutch','flywheel','transmission','PPF','pilot bearing','break-in'],difficulty:'Advanced',time:'12–20 hr first-time DIY',symptoms:'Clutch slip, release noise, failed pilot bearing, hydraulic release problems, or a planned street/track clutch and flywheel upgrade.',tools:['Transmission jack','Engine support or safe powertrain support plan','Clutch alignment tool for the NC kit','Pilot-bearing puller','Torque wrench and angle/sequence notes for the exact engine/transmission','Drain pans and line plugs','Non-petroleum friction cleaner','New flywheel and clutch hardware where specified'],safety:'The NC requires substantial underbody, exhaust, starter, shifter, cooling, and powertrain access. Support the transmission and powertrain independently before removing the mount or PPF. Protect oxygen-sensor wiring, heater hoses, coolant, and the aluminum bellhousing. Treat the supplier installation video as an orientation aid, not a substitute for the exact service procedure.',steps:['Identify NC1/NC2/NC3, manual transmission type, clutch diameter, flywheel type, and any turbo/supercharger torque increase. Confirm the replacement clutch is designed for the selected flywheel; some larger or performance kits require their supplied flywheel.','Baseline the complaint and inspect the hydraulic system before pulling the transmission. A low or inconsistent pedal, external leak, or air in the line can imitate a worn clutch.','Disconnect the battery. Remove center-console and shifter access parts, record connector locations, and drain the transmission before under-car removal.','Remove splash shields, braces, exhaust sections, oxygen-sensor connections, starter wiring, slave cylinder and hydraulic-line bracket, shifter components, driveshaft, and the transmission support hardware in a controlled sequence. Mark driveline orientation where the design requires it.','Support the transmission, remove the powertrain/PPF and mount hardware, then separate the transmission from the engine without hanging it from the input shaft or wiring.','Inspect the input shaft, pilot bearing, release fork, guide tube, bellhousing, rear main seal area, crank flange, dowels, and flywheel surface. Replace the pilot bearing and address any oil leak before installing new friction parts.','Replace or machine the flywheel only according to the clutch manufacturer and exact service limits. Preserve the specified friction-surface height and use new flywheel fasteners or sealing compound if required by the source.','Install the disc with the correct orientation and alignment tool. Install the pressure plate over the dowels and tighten evenly in a star pattern to the exact kit and vehicle specification.','Lubricate only the approved release-fork, pivot, guide-tube, and input-spline surfaces with a thin film; wipe all excess from the disc and flywheel. Confirm the release-bearing retaining hardware is seated.','Reinstall the transmission by aligning the input shaft through the disc and pilot bearing. If it does not seat with light hand pressure and small rotation, stop and realign.','Reinstall the starter, exhaust, oxygen-sensor connectors, driveshaft, shifter, slave cylinder, mount, braces, PPF, undertrays, and console. Refill the correct transmission fluid and restore every heat shield and ground.','Bleed and set the clutch hydraulics if opened. Confirm the release fork has free movement and the clutch does not drag or pre-load at rest.','Run a stationary gear-engagement test, low-speed release test, and controlled road test. Then follow the kit maker’s break-in distance and driving limits before track use.','After the first heat cycle and after break-in, inspect for leaks, abnormal gear rattle, driveline vibration, fastener movement, and clutch slip.'],verify:'The transmission is fully seated without forced fasteners, all wiring and heat shields are restored, the clutch releases cleanly, the engine holds torque without slip, and the vehicle passes a controlled post-install road test.',mistakes:'Treating the NC like an NA/NB; leaving exhaust or oxygen-sensor hardware unsecured; using a flywheel step from another engine; omitting the pilot bearing; or taking a street clutch straight to track abuse before bedding.',sources:['https://www.youtube.com/watch?v=kuW20YByn-4','https://www.exedyusa.com/faq/'],recommendations:[{name:'ACT ZM10-HDSS street-sprung clutch kit',kind:'Street / mild track benchmark',why:'A documented NC application with a sprung street disc and higher clamp load. It is a reasonable middle ground when the stock clutch is marginal but a harsh race disc would make the car worse on the street.',url:'https://www.advancedclutch.com/zm10-hdss-act-heavy-duty-performance-street-sprung-clutch-kit'},{name:'ACT 601140 XACT Streetlite flywheel',kind:'Matched lightweight-flywheel option',why:'A purpose-built NC flywheel from the clutch manufacturer, with published application data and a durable steel construction. Use the clutch maker’s compatibility list rather than mixing random pressure plates and flywheels.',url:'https://www.advancedclutch.com/601140-act-xact-streetlite-clutch-flywheel'},{name:'EXEDY replacement / performance catalog',kind:'OEM-style alternative',why:'Use the OE-style route when smooth engagement and stock power are the priority. EXEDY documents flywheel resurfacing or replacement requirements, bearing contents, and break-in guidance, which is more valuable than a bargain kit with no installation support.',url:'https://www.exedyusa.com/'}],recommendationDisclosure:'Editorial links only. No paid sponsorship or affiliate relationship is claimed. Confirm NC1/NC2/NC3, transmission, clutch diameter, and flywheel requirements before ordering.',related:['na-nb-clutch-lightweight-flywheel']},
  {id:'nd-clutch-lightweight-flywheel',book:'driveline',system:'Clutch / driveline',title:'ND clutch upgrade and lightweight flywheel — electronic-era drivetrain workflow',applies:['ND'],tags:['ND','ND1','ND2','ND3','clutch','flywheel','transmission','RF','break-in'],difficulty:'Advanced',time:'12–22 hr first-time DIY',symptoms:'Slip, release-bearing noise, difficult engagement, clutch damage after a power upgrade, or a planned ND clutch/flywheel conversion.',tools:['Transmission jack','Stable lift and underbody support','ND-compatible clutch alignment tool','Pilot-bearing service tool','Torque wrench with exact fastener coverage','Scan/diagnostic capability if warning lamps or calibration are triggered','Drain pans, line plugs, non-petroleum cleaner','Exact ND clutch/flywheel installation documents'],safety:'ND1, ND2, and ND3 parts and calibrations are not automatically interchangeable. Disconnect the battery as directed by the vehicle and service information, protect sensor and network wiring, and do not disturb SRS, immobilizer, or CAN connectors casually. Confirm the replacement kit’s compatibility with the engine revision, transmission, RF/soft-top body, and intended use.',steps:['Record the VIN, ND revision, engine, transmission, body style, clutch history, modifications, and measured symptom. Do not order by “ND” alone.','Check the pedal, hydraulic fluid, slave-cylinder travel, clutch engagement, and stored diagnostic codes. A hydraulic or electronic fault should be resolved before declaring the friction assembly worn.','Plan the job around the ND’s access path. Disconnect the battery, remove the interior shifter access, underbody shields, exhaust sections, driveshaft, starter, sensors, harness brackets, and slave cylinder as required by the exact procedure.','Support the transmission and powertrain before removing its mount/crossmember. Keep the driveshaft and PPF-related hardware controlled and mark orientation if the service information requires it.','Separate the transmission from the engine straight back. Do not let the input shaft carry the transmission’s weight or contact the clutch fingers at an angle.','Inspect the pilot bearing, release bearing and fork, input shaft, bellhousing, rear main seal area, flywheel surface, dowels, and threaded holes. If the car has power modifications, inspect for heat damage and disc glazing rather than assuming the clutch rating alone explains the failure.','Use the clutch manufacturer’s compatibility chart. A performance clutch may require its own flywheel, different friction diameter, or different release characteristics. Do not mix a pressure plate, disc, and flywheel from unrelated kits.','Replace the pilot bearing if the kit or service procedure calls for it. Install it squarely to the verified depth and keep the crank bore clean.','Install the flywheel using the exact new-fastener, thread-sealant, staged-torque, and star-pattern instructions for the engine revision. Record the source and units on the job sheet; do not reuse the NC/NA/NB values.','Clean the new friction surfaces with non-petroleum cleaner. Align the disc in the correct orientation, seat the pressure plate on its dowels, and tighten gradually in a cross pattern to the exact kit specification.','Service the release fork and bearing with only the approved lubricant and only on the approved contact points. Any grease on the friction faces is a teardown-level mistake.','Reinstall the transmission without using bolts to force alignment. Reconnect every starter, sensor, ground, network, and oxygen-sensor connection before shields and undertrays hide the work.','Bleed the clutch only if the circuit was opened or air is present. Confirm pedal travel and release before starting, then check for warning lamps and scan data after reconnecting the battery.','Perform a stationary gear test, low-speed clutch-release test, and controlled road test. Monitor for clutch slip, chatter, release noise, vibration, warning lamps, and abnormal drivetrain sound.','Follow the clutch kit’s break-in procedure. Keep the car out of hard launches, repeated high-rpm shifts, and track use until the friction surfaces are bedded.','After break-in, repeat the leak, fastener, pedal, engagement, and diagnostic checks. Log the ND revision, kit, flywheel, software or calibration state, mileage, and break-in completion.'],verify:'The clutch releases cleanly, the ND has no new diagnostic warnings, all network and sensor functions operate, the flywheel/clutch produce no unsafe vibration, and the car holds the intended torque after break-in.',mistakes:'Treating all NDs as one fitment; mixing ND1/ND2/ND3 parts; losing a network ground; forcing the transmission onto the engine; using a generic torque figure; contaminating the disc; or skipping a post-repair scan when the vehicle reports a fault.',sources:['https://www.youtube.com/watch?v=vdTbxB89Ahw','https://www.exedyusa.com/faq/'],recommendations:[{name:'Flyin’ Miata ND Happy Meal',kind:'Supported ND conversion path',why:'A complete ND clutch and lightweight-flywheel package from a Miata specialist. The supplier publishes fitment and torque-capacity notes, but ND1/ND2/ND3 and warranty implications still need to be checked for the specific car.',url:'https://flyinmiata.com/products/fm-nd-happy-meal'},{name:'ACT ND clutch and flywheel catalog',kind:'Documented comparison option',why:'ACT publishes ND application-specific kits and installation guidance. A cataloged match is preferable to combining an unknown pressure plate with an unrelated flywheel.',url:'https://www.advancedclutch.com/'},{name:'EXEDY OEM replacement catalog',kind:'OEM-manners value route',why:'For a stock or lightly modified ND, a quality OE-style kit can be the better buy than a race clutch: predictable pedal feel, easier street break-in, and less drivetrain shock.',url:'https://www.exedyusa.com/'}],recommendationDisclosure:'Editorial links only. No paid sponsorship or affiliate relationship is claimed. Verify ND1/ND2/ND3, engine, transmission, soft-top/RF body, warranty, and kit-specific flywheel requirements.',related:['nc-clutch-lightweight-flywheel']},
  {id:'performance-baseline',book:'builds',system:'Performance build planning',title:'Build a performance baseline before adding speed',applies:['NA','NB','NC','ND'],tags:['performance','baseline','street','track','build order'],difficulty:'Intermediate',time:'2–6 hr',symptoms:'Planning a faster car, entering autocross/HPDE, or trying to stop wasting money on mismatched upgrades.',tools:['Tire gauge','Inspection light','Compression or leak-down plan','Notebook / lap or road log','Torque wrench'],safety:'Do not add power to a car with unknown brakes, tires, cooling, oil pressure, battery security, rust, or drivetrain condition. Performance modifications increase heat and failure consequences.',steps:['Record the exact generation, engine, transmission, trim, market, current tires, brakes, suspension, differential, power modifications, and known faults.','Separate the project into safety, reliability, control, grip, thermal margin, power, and cosmetic categories.','Measure baseline tire pressures, tread depth, ride height, alignment, brake condition, fluid condition, engine health, and temperature behavior.','Choose one operating goal: reliable street, back-road, autocross, HPDE, time attack, or race. The correct part depends on the goal.','Build a staged plan where each upgrade has a required companion check, a budget, and a way to verify whether it helped.'],verify:'The car has a written baseline, a defined operating goal, a budget, and a change log before parts are ordered.',mistakes:'Starting with horsepower; copying a race setup onto a street car; ignoring tires and brakes; changing several variables at once; measuring only peak power.',...common},
  {id:'suspension-tuning',book:'builds',system:'Performance suspension',title:'Tune Miata suspension as a system',applies:['NA','NB','NC','ND'],tags:['coilovers','springs','damping','alignment','corner balance','handling'],difficulty:'Advanced',time:'1–3 sessions',symptoms:'Installing dampers, changing ride height, solving understeer/oversteer, or preparing for track use.',tools:['Ride-height gauge','Tire-pressure gauge','Alignment report','Corner-weight scales where available','Notebook'],safety:'A lower car can lose bump travel, damage tires, overload bump stops, or create unsafe clearance. Confirm steering, brake-line, wheel, exhaust, and top/RF clearances at full travel.',steps:['Choose tire and use case before choosing spring rates.','Set ride height with repeatable reference points and preserve usable bump and droop travel.','Verify spring preload, damper adjustment direction, bump-stop engagement, and fastener security.','Align the car after ride height changes; record actual values, not only target numbers.','Change one variable at a time and use tire temperatures, wear, driver feedback, and repeatable behavior to judge the result.','Corner-balance only after the car, driver/load assumptions, pressures, and alignment are settled.'],verify:'The car is stable at the intended limit, tires wear predictably, controls remain clear, and the setup can be returned to a documented baseline.',mistakes:'Using spring rates without checking damper compatibility; lowering until the chassis rides bump stops; chasing internet alignment numbers; interpreting tire heat without pressure and camber context.',sources:['https://www.mazdamotorsports.com/2020/04/07/baseline-setup-for-spec-miata/','https://949racing.com/supermiata/tech-info/miata-race-alignment-info/'],related:['alignment-baseline']},
  {id:'track-brake-thermal',book:'builds',system:'Track brakes and thermal margin',title:'Build a brake package for repeated track stops',applies:['NA','NB','NC','ND'],tags:['track','brakes','fluid','pads','rotors','heat'],difficulty:'Advanced',time:'4–8 hr plus testing',symptoms:'Long pedal, fade, smoke, pad knockback, cracked rotors, or preparing a street car for repeated high-energy stops.',tools:['Brake temperature method','Tire gauge','Torque wrench','Fluid service equipment','Inspection light'],safety:'Brake failure is an immediate stop condition. Do not solve fade by fitting an aggressive pad without matching fluid, rotor condition, cooling, tire grip, and driver expectations.',steps:['Measure the current brake package, pad compound, rotor thickness, hose condition, fluid age, tire grip, and event length.','Select a pad compound for the actual temperature range and accept its cold bite, dust, noise, and rotor tradeoffs.','Flush with a compatible high-temperature fluid and verify pedal consistency before the event.','Inspect caliper hardware, guide movement, hose routing, rotor cracks, wheel clearance, and pad taper.','Log hot pedal feel, tire pressure, pad condition, rotor condition, and temperature evidence after each session.','Change one brake variable at a time and retain a road-safe return-to-street plan.'],verify:'The pedal remains consistent, pad and rotor temperatures are controlled, the system has no leaks or cracks, and the car can return to the road without an unsafe compromise.',mistakes:'Using race pads on the street without understanding cold performance; ignoring fluid age; treating a long pedal as a pad problem; running a track session with unknown rotors.',...common},
  {id:'forced-induction-plan',book:'builds',system:'Forced induction',title:'Plan a Miata forced-induction build before buying the kit',applies:['NA','NB','NC','ND'],tags:['turbo','supercharger','boost','fuel','ECU','wideband','cooling'],difficulty:'Expert',time:'Planning: 6–12 hr',symptoms:'Considering turbocharging or supercharging, increasing torque, or diagnosing a boost project that was assembled in the wrong order.',tools:['Compression / leak-down tools','Fuel-pressure test plan','Wideband plan','Boost-leak test equipment','Wiring documentation','Budget sheet'],safety:'Forced induction can turn a small fuel, cooling, oil, ignition, clutch, or calibration error into engine or fire damage. Do not use a generic map, unknown fuel pressure, unsecured oil feed, or improvised high-current wiring.',steps:['Define power, fuel, emissions, response, noise, climate, and reliability goals before choosing a turbo, supercharger, intercooler, or ECU.','Baseline compression, leak-down, cooling performance, oil leaks, charging voltage, grounds, fuel delivery, ignition, and clutch condition.','Size injectors, pump, regulator, lines, intercooler, exhaust, oil control, and clutch as one torque and heat system.','Design wiring with proper fusing, relay control, grounds, heat protection, strain relief, and service access.','Plan wideband placement, boost reference, sensor calibration, fail-safes, and a conservative first-start procedure.','Tune on measured data with a qualified calibration strategy, then recheck plugs, oil, coolant, fasteners, belt/boost leaks, and driveline behavior.'],verify:'The car has documented baseline health, fuel and thermal margin, safe wiring, a calibration plan, a torque-capacity plan, and a conservative validation sequence.',mistakes:'Buying the biggest turbo; tuning around a fuel-pressure problem; grounding sensors randomly; routing oil or fuel lines near heat; skipping a wideband; adding boost before brakes and tires.',sources:['https://www.mazdamotorsports.com/technical-information/','https://www.tunedbyshawn.com/pages/haltech-kb/fuel-pump-wiring-7-4-2020'],related:['performance-baseline','cooling-triage']}

  {id:'trouble-no-crank',book:'diagnostics',system:'Starting',title:'No crank or slow crank: prove the starting circuit',applies:['NA','NB','NC','ND'],tags:['troubleshooting','no crank','battery','starter','voltage drop'],difficulty:'Intermediate',time:'45–120 min',symptoms:'The key is turned and the engine does not turn, turns slowly, clicks, or works intermittently.',tools:['Digital multimeter','Battery charger','Voltage-drop leads','Test light','Wiring diagram'],safety:'Keep hands, clothing, and tools away from belts and fans. Disable starting only using the correct model procedure.',steps:['Confirm the complaint and record whether the symptom is a single click, rapid clicks, silence, slow crank, or intermittent crank.','Test battery state of charge and terminal condition before condemning the starter.','Measure voltage at the battery while cranking and compare it with voltage at the starter feed and ground path.','Test the start-command path through the switch, clutch or neutral safety input, relay, immobilizer boundary, and starter solenoid as applicable.','Inspect grounds between battery, engine, chassis, and starter. Clean and retest before replacing a component.'],verify:'The failed portion is identified as battery capacity, cable/ground loss, control command, solenoid, or starter motor.',mistakes:'Replacing a starter because of a dirty ground; measuring open-circuit voltage only; ignoring an immobilizer or clutch-switch input.',...common},
  {id:'trouble-crank-no-start',book:'diagnostics',system:'Engine start',title:'Crank but no start: separate spark, fuel, compression, and timing',applies:['NA','NB','NC','ND'],tags:['troubleshooting','no start','spark','fuel','compression','timing'],difficulty:'Advanced',time:'1–4 hr',symptoms:'The starter turns the engine at normal speed but the engine will not run.',tools:['Battery support','Approved spark tester','Fuel-pressure method','Compression or leak-down tools','Scan tool where supported'],safety:'Control fuel vapors and ignition sources. Do not repeatedly spray starting fluid into an unknown engine system.',steps:['Record battery voltage during cranking, engine speed data, codes, and whether the engine briefly fires.','Establish the four requirements: adequate cranking speed, usable spark at the correct time, fuel delivery and injector command, and compression with correct mechanical timing.','Check power, grounds, fuses, relays, crank/cam signal plausibility, and immobilizer boundaries before replacing sensors.','If fuel is present, check for flooding, contaminated fuel, incorrect pressure, injector leakage, and a lost ignition reference.','If spark and fuel are present, move to compression, valve timing, and mechanical damage instead of swapping more electrical parts.'],verify:'At least one required condition is proven missing or out of specification before a part is ordered.',mistakes:'Calling a pump bad without measuring pressure; confusing a crank sensor code with proof the sensor is bad; ignoring mechanical timing.',...common},
  {id:'trouble-rough-idle',book:'diagnostics',system:'Air / fuel / ignition',title:'Rough idle, stalling, or hunting: test the air and control loop',applies:['NA','NB','NC','ND'],tags:['troubleshooting','rough idle','stall','vacuum leak','misfire'],difficulty:'Intermediate',time:'1–3 hr',symptoms:'Unstable idle, stalling at stops, hunting RPM, stumble after start, or intermittent misfire.',tools:['Scan tool where supported','Smoke-test method','Multimeter','Fuel-trim data','Ignition inspection tools'],safety:'Do not create an uncontrolled fuel or ignition hazard while testing. Keep the engine clear of loose clothing and rotating parts.',steps:['Capture the symptom cold, warm, loaded, unloaded, with accessories on, and during deceleration.','Record codes, misfire counters, fuel trims, coolant temperature plausibility, throttle position, and idle-control behavior where available.','Check unmetered air, cracked hoses, intake leaks, throttle-body contamination, PCV routing, and brake-booster leaks.','Confirm fuel pressure, injector balance clues, ignition condition, and correct plug heat range or gap for the engine.','Repair the proven cause, clear learned values only when appropriate, and verify the symptom through a repeatable drive cycle.'],verify:'The repair changes the measured evidence and the original symptom does not return under the same conditions.',mistakes:'Cleaning a throttle body as a universal cure; replacing oxygen sensors from a lean code without checking for air leaks; ignoring low battery voltage.',...common},
  {id:'trouble-overheat',book:'diagnostics',system:'Cooling',title:'Overheats in traffic, at speed, or after shutdown: classify the heat event',applies:['NA','NB','NC','ND'],tags:['troubleshooting','overheating','coolant','fan','air lock'],difficulty:'Advanced',time:'1–4 hr',symptoms:'Temperature rises in traffic, during highway load, after shutdown, on hills, or only with A/C operating.',tools:['Pressure tester','Infrared thermometer','Scan tool where supported','Cooling-system fill and bleed equipment'],safety:'Never open a hot pressurized system. Coolant can burn and fans can start unexpectedly.',steps:['Classify the event by speed, ambient temperature, engine load, A/C state, heater output, and whether coolant is lost.','Inspect for low level, cap failure, leaks, collapsed hoses, blocked airflow, belt problems, and incorrect coolant mix.','Verify fan command and actual fan operation, then check radiator temperature distribution and thermostat behavior.','Pressure-test cold, inspect for combustion-gas evidence when appropriate, and search for trapped air after service.','Bleed using the exact generation procedure and verify stable temperature under the original complaint conditions.'],verify:'The cooling system reaches and holds normal operating temperature without unexplained loss, fan failure, pressure loss, or repeatable temperature spikes.',mistakes:'Installing a thermostat without finding the leak; blaming the radiator before checking fan control; treating a trapped-air condition as a bad head gasket.',...common},
  {id:'trouble-charge',book:'diagnostics',system:'Charging',title:'Battery goes flat or voltage is unstable: test the charge path',applies:['NA','NB','NC','ND'],tags:['troubleshooting','alternator','charging','battery','voltage'],difficulty:'Intermediate',time:'1–3 hr',symptoms:'Dead battery, dim lights, charging warning, unstable accessories, or repeated battery replacement.',tools:['Multimeter','Battery tester or charger','Voltage-drop leads','Belt inspection tools'],safety:'Avoid shorting alternator terminals. Keep the meter on the correct range and protect the battery from sparks.',steps:['Test battery health separately from the charging system.','Measure charging voltage at the battery under idle, electrical load, and elevated speed where appropriate.','Measure positive and ground-side voltage drop between the alternator, battery, engine, and chassis.','Inspect belt tension, pulley condition, main fuses, connectors, grounds, and alternator control wiring.','After repair, verify cold and warm charging behavior and confirm the battery can recover from a normal start.'],verify:'The fault is attributed to battery capacity, belt drive, alternator output, wiring loss, control input, or an abnormal electrical load.',mistakes:'Replacing the alternator without measuring voltage drop; assuming 14 volts proves the battery is healthy; overlooking an intermittent belt slip.',...common},
  {id:'trouble-parasitic',book:'diagnostics',system:'Battery drain',title:'Battery dies while parked: isolate a parasitic draw without waking the car',applies:['NA','NB','NC','ND'],tags:['troubleshooting','parasitic draw','sleep current','accessories'],difficulty:'Advanced',time:'1–3 hr',symptoms:'A known-good battery goes flat after hours or days parked.',tools:['Fused current meter','Charger','Fuse map','Wiring diagram','Thermal camera optional'],safety:'Do not crank through an inline meter. Use fused leads and follow the correct sleep procedure for the generation.',steps:['Confirm the battery can hold charge and record how long the vehicle takes to fail.','Set up the vehicle so doors, hood, alarm, infotainment, and modules can reach their normal sleep state.','Measure baseline sleep current without repeatedly opening the car or pressing buttons.','Remove one fuse or isolate one accessory at a time, recording the current change and restoring the circuit after each test.','Trace the affected circuit to a relay, module, lamp, aftermarket accessory, wiring fault, or water intrusion.'],verify:'The draw is repeatable, the affected circuit is identified, and the final sleep current is confirmed after repair.',mistakes:'Testing before the modules sleep; using an unfused meter; blaming the battery when an accessory is keeping the car awake.',...common},
  {id:'trouble-brake-pull',book:'diagnostics',system:'Brakes / steering',title:'Pulling, wandering, or uneven braking: compare the four corners',applies:['NA','NB','NC','ND'],tags:['troubleshooting','brake pull','steering','tire wear','alignment'],difficulty:'Intermediate',time:'1–3 hr',symptoms:'The car pulls under braking, drifts on a level road, has a crooked wheel, or develops uneven tire wear.',tools:['Tire gauge','Tread-depth gauge','Infrared thermometer','Lift and inspection tools','Alignment report'],safety:'Do not continue driving if a wheel is loose, a hose leaks, a tire is damaged, or a caliper is binding severely.',steps:['Confirm road crown and wind are not being mistaken for a vehicle fault.','Swap or compare tire pressures, sizes, wear, and construction before changing alignment.','Inspect wheel bearings, ball joints, tie rods, bushings, caliper slides, hoses, pad wear, and rotor condition.','Compare corner temperatures only after a controlled test and allow for brake-use differences.','Obtain a four-wheel alignment after worn parts are corrected and record actual values.'],verify:'The direction of the pull is repeatable, the physical cause is identified, and the post-repair alignment and brake behavior are documented.',mistakes:'Adjusting alignment around a seized caliper; blaming road crown; replacing tires without checking a bent wheel or worn joint.',...common},
  {id:'trouble-noise-vibration',book:'diagnostics',system:'NVH / driveline',title:'Noise, vibration, and harshness: locate the operating condition',applies:['NA','NB','NC','ND'],tags:['troubleshooting','noise','vibration','driveline','wheel bearing'],difficulty:'Advanced',time:'1–4 hr',symptoms:'Hum, rumble, click, clunk, shudder, vibration, or harshness that changes with speed, RPM, gear, steering, braking, or load.',tools:['Road-test notes','Lift and stands','Chassis ears optional','Torque wrench','Inspection light'],safety:'Use a second person for road-test observations and never work near rotating driveline components unless the approved procedure allows it.',steps:['Record whether the symptom follows road speed, engine RPM, gear, throttle, steering angle, braking, or bumps.','Separate tire/wheel speed symptoms from engine and driveline speed symptoms.','Inspect wheel balance, tire defects, hubs, bearings, axle joints, driveshaft, PPF or mounts, exhaust contact, and loose shields.','Reproduce the symptom with one controlled variable at a time and document the exact speed or RPM band.','Repair the confirmed source, then repeat the same road test to verify the change.'],verify:'The symptom has a repeatable trigger and the repair changes that trigger without creating a new vibration or clearance issue.',mistakes:'Replacing wheel bearings based only on a noise description; ignoring tire defects; confusing engine resonance with driveshaft vibration.',...common},
  {id:'trouble-water-leak',book:'diagnostics',system:'Body / water management',title:'Find a water leak without guessing at the carpet',applies:['NA','NB','NC','ND'],tags:['troubleshooting','water leak','top','drains','seal'],difficulty:'Intermediate',time:'1–3 hr',symptoms:'Wet carpet, damp seat-belt tower, water in the trunk, mildew, or a leak that appears only when parked a certain way.',tools:['Dry towels','Low-pressure water source','Inspection light','Trim tools','Drain-cleaning tool'],safety:'Do not use high-pressure water against seals or force rigid wire into drains. Protect electrical modules and dry wet interiors promptly.',steps:['Dry the vehicle and map the wettest point, then work backward to the highest likely entry point.','Inspect top drains, cowl and windshield paths, trunk seals, lamps, grommets, door membranes, and body seams for the generation.','Introduce a small amount of water to one zone at a time while observing from inside.','Clear drains with a purpose-made flexible tool and repair seals or body seams only after the path is proven.','Dry insulation and carpet fully, then repeat the test in the original parking and weather condition.'],verify:'The water path is reproduced, repaired, and retested without merely masking the wet carpet.',mistakes:'Pouring water everywhere at once; sealing the lowest wet point; leaving insulation damp; using silicone where a replaceable seal is required.',...common}
