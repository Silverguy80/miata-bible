        "title": "NB electrical: starting, charging, grounds, lighting, and fuse strategy",
        "markdown": "# NB electrical: starting, charging, grounds, lighting, and fuse strategy\n\nThe NB (roughly 1998–2005) is best diagnosed from the symptom outward: first separate **no crank**, **slow crank**, and **normal crank/no fire**; then prove battery state, cable integrity, grounds, fuse feeds, and control signals before condemning a starter, alternator, relay, or ECU. The owner manual confirms 12-volt jump-start limits and warns against working around SRS wiring; the public Mazda service reference emphasizes voltage testing, continuity checks only on de-energized circuits, and replacing a fuse with the specified rating rather than increasing it [1] [2].\n\n## Procedures\n\n### 1. Establish battery, cable, and ground integrity before deeper testing\n\n**Symptom:** Multiple electrical systems are weak, intermittent, dim, or reset; starter clicks or cranks slowly.\n\n**Safety:** Wear eye protection. Keep sparks and flames away from the battery. Do not probe SRS/airbag connectors or add test power to them. Disable ignition and secure the car in neutral/park with the parking brake set.\n\n**Tools:** Digital multimeter; battery charger or known-good 12 V source; test light; small wire brush; insulated hand tools; optional carbon-pile/electronic load tester.\n\n**Steps:**\n1. Inspect battery case, terminals, hold-down, positive cable, negative cable, engine/chassis bonding strap, and the high-current connection at the under-hood fuse box. Look for looseness, white/green corrosion, heat discoloration, or aftermarket add-ons.\n2. With the car rested and loads off, measure directly across the battery posts, not on cable clamps. A low reading must be charged and retested; open-circuit voltage alone does not prove cranking capacity.\n3. Clean and retighten only after disconnecting the negative terminal. Recheck the battery-to-body and engine-to-body return paths.\n4. During a crank attempt, measure voltage at the battery posts and separately across each cable path. A large positive-side or ground-side drop points to a cable/connection fault rather than automatically to a bad starter.\n5. If symptoms change when headlights, blower, brake lamps, or indicators are switched on, measure at the battery and at the affected load while reproducing the fault. A convenient accessory or radio feed can show a drop that is not present at the battery.\n\n**Tests:** Rested battery voltage; crank-voltage observation; positive cable drop from battery positive post to starter feed; ground drop from starter case/engine metal to battery negative post; voltage at the under-hood fuse-box supply.\n\n**Verify:** The battery is charged and load-capable, the high-current path remains stable during cranking, and added accessories are isolated before further diagnosis.\n\n**Mistakes:** Treating “12 V” as proof of a healthy battery; measuring only at a remote ground; replacing an alternator when the real fault is a corroded high-current joint; using an ohmmeter on a live circuit.\n\n### 2. No-crank or single-click diagnosis\n\n**Symptom:** Turning the key to START produces no crank, a single click, or a slow/erratic crank.\n\n**Safety:** Keep hands and clothing clear of belts and fans. Do not bypass a starter or interlock unless the vehicle is secured and the bypass is used only as a controlled diagnostic test.\n\n**Tools:** Multimeter; test light; wiring reference for the exact year/market; remote starter switch only when safe; socket set.\n\n**Steps:**\n1. Confirm the battery/cable checks above and observe what other lamps do when START is selected.\n2. Check the relevant high-current and ignition/start feeds at both fuse boxes using a test light or meter on both sides of the fuse. A fuse that has power on only one side is open; a fuse with no power may be downstream of the ignition switch and not itself faulty.\n3. Confirm that the START command reaches the starter-control side only when the ignition switch is in START. Manual-transmission cars include a clutch interlock; automatic-market cars use a transmission/range interlock. Do not assume the same circuit or switch arrangement across markets.\n4. If the control command is present at the starter solenoid but the motor does not operate, recheck ground drop and the high-current positive path, then test the starter/solenoid. If the command is absent, trace backward through the ignition switch, interlock, relay/fuse feed, and connectors.\n5. If the starter spins without turning the engine, stop treating it as an electrical no-crank and inspect the starter drive/flywheel interface.\n\n**Tests:** Battery voltage during crank; voltage at starter main terminal; voltage at the starter control terminal only while START is selected; positive and ground voltage-drop tests; interlock input/output checks.\n\n**Verify:** The fault is assigned to battery/cabling, control-side command, interlock, or starter motor by a measured missing voltage or excessive drop—not by sound alone.\n\n**Mistakes:** Repeatedly jumping the starter, substituting a relay because it clicks, or assuming a clutch/range switch is the same on every NB. The 2003 public wiring reference shows separate start-feed, ignition, and interlock paths [3].\n\n### 3. Cranks normally but will not fire: prove ECU power and engine-control feeds\n\n**Symptom:** The engine turns at normal speed but does not start; the check-engine lamp or other key-on indicators may be absent.\n\n**Safety:** Do not back-probe airbag circuits. Avoid grounding power feeds with jumper wires. Disconnect the battery before removing a main fuse or unplugging major harnesses.\n\n**Tools:** Multimeter/test light; scan tool appropriate to the car; fuse puller; wiring reference; noid/spark tester as appropriate.\n\n**Steps:**\n1. With key ON, note whether the check-engine lamp and normal warning lamps illuminate. Their absence is a power/feed clue, not proof of a failed ECU.\n2. Check the cabin ROOM and ENGINE-related feeds and the under-hood fuel-injection/main feeds against the vehicle’s own lid label or exact-year reference. Inspect both sides of each fuse and the relay socket supply/control sides.\n3. Verify ECU/PCM constant and switched power and its ground at the harness using the exact year/market wiring information. Do not use a generic online pinout as a substitute for the correct diagram.\n4. If ECU power is good, move to independent engine requirements: crank/cam signal, ignition output, injector pulse, fuel pressure, and immobilizer/security behavior where fitted. Use scan data or fault codes as evidence, not as a parts list.\n5. Clear stale codes only after recording them, then retest the symptom and read the resulting codes again. The service reference identifies generator/PCM voltage-related codes, but code presence still requires circuit confirmation [2].\n\n**Tests:** Key-on lamp behavior; fuse voltage on both sides; relay feed and command; ECU constant/switched power and ground; scan communication; crank signal; spark/injector/fuel checks.\n\n**Verify:** The no-fire branch is narrowed to missing ECU power/ground, missing engine-speed reference, fuel/ignition delivery, or immobilizer/control logic.\n\n**Mistakes:** Copying an NA procedure onto an NB; treating a forum terminal label as authoritative; replacing the ECU because the MIL is dark without checking ROOM/ENGINE/main feeds; disconnecting the battery before recording codes.\n\n### 4. Charging-system and battery-lamp diagnosis under load\n\n**Symptom:** Battery/charge lamp stays on or flickers; battery repeatedly goes flat; lights dim or voltage changes with engine speed.\n\n**Safety:** Keep clear of the belt and rotating pulley. Never disconnect the battery with the engine running. Stop if the battery is hot, swollen, leaking, or frozen. The owner manual limits jump starting to a 12 V source [1].\n\n**Tools:** Multimeter; belt-tension/condition inspection tools; clamp ammeter if available; scan tool or data logger optional.\n\n**Steps:**\n1. Fully charge and test the battery first. A weak battery can imitate charging trouble and can be damaged by repeated deep discharge.\n2. Measure voltage at the battery posts with the engine off, idling, and at a modest raised speed. Repeat with headlights, blower, and rear defogger where equipped. The result should rise above resting voltage and remain stable; exact values vary with temperature, load, regulator strategy, and meter accuracy.\n3. Compare alternator output-terminal-to-case voltage with battery-post voltage. A meaningful difference identifies the positive cable/fuse-box path; compare alternator case/engine metal to battery negative to identify the ground path.\n4. Inspect belt slip, alternator connector, charge-lamp circuit, main fuse link, and high-current fuse-box joints before condemning the alternator.\n5. If the car is an early 1999–2000 variant, treat regulator architecture as a model-specific question: enthusiast reports disagree about how much regulation is internal versus ECU-associated. Verify by the exact alternator/wiring reference, not by a year-only assumption [4].\n\n**Tests:** Resting battery voltage; charging voltage at battery under load; alternator-to-battery voltage drop; charge-lamp behavior; belt and connector inspection; ripple test if charging voltage is abnormal.\n\n**Verify:** Charging failure is demonstrated by low/unstable output or excessive cable drop after the battery and belt are known good.\n\n**Mistakes:** Replacing the battery because the charge lamp is on; using a fixed “14.5 V” pass/fail rule in all conditions; testing only at idle with no load; disconnecting the battery to “test” the alternator.\n\n### 5. Lighting and fuse strategy: branch from the symptom\n\n**Symptom:** One headlamp, both headlamps, tail/park lamps, turn signals, brake lamps, or dash illumination fail; a fuse opens repeatedly.\n\n**Safety:** Use the specified fuse rating only. If a replacement opens again, stop and find the short/overload. Do not probe an SRS circuit or install higher-rated protection. Replace bulbs with the lamp circuit off and allow hot bulbs to cool.\n\n**Tools:** Test light or fused jumper for controlled short-finding; multimeter; fuse puller; correct bulb; wiring reference.\n\n**Steps:**\n1. Identify whether the failure is one side, one function, or an entire branch. This separates a bulb/socket/ground fault from a shared feed, switch, relay, or fuse fault.\n2. Check the cabin and under-hood fuse boxes at the fuse and load side. For 2002–2005 US references, the secondary fuse index groups left/right headlamps separately, while tail/parking/side-marker and turn/hazard functions use their own branches; exact equipment and ratings vary by year, market, DRL, ABS, fog lamps, and Mazdaspeed trim [3] [5].\n3. If a fuse is open, inspect the harness near lamp housings, bumper/quarter-panel transitions, trunk-lid movement, aftermarket lamps, trailer wiring, and wet/corroded sockets before fitting another fuse.\n4. If a fuse is good but the load is dead, test for power at the socket and test the return path to body ground. A shared ground can make several lamps dim or backfeed.\n5. For headlights, remember that the switch/relay/fuse arrangement differs between DRL and non-DRL diagrams. Use the exact-market diagram and trace the circuit from supply to switch/relay to left/right branch to ground [3].\n\n**Tests:** Both sides of fuse; voltage at lamp socket; continuity only with power removed; voltage drop on supply and ground under load; wiggle test at harness/socket; current draw if a fuse repeatedly opens.\n\n**Verify:** The repair restores the affected branch without an oversized fuse, and all lamps remain stable with other electrical loads operating.\n\n**Mistakes:** Copying a 2002–2003 fuse assignment to a 2004–2005 Mazdaspeed; assuming a good fuse proves power reaches the bulb; replacing a fuse repeatedly without finding the short; using a chassis ground far from the lamp and missing a bad local ground.\n\n## Wiring notes\n\n### Battery, main fuse, and distribution\n\n**Diagram:** `Battery + → high-current cable/main fuse link → under-hood fuse/relay box → ignition/start, engine-control, lighting, and cabin branches; battery − → body/engine bonding paths → component returns.`\n\n**Explanation:** The high-current distribution point is common to many apparently unrelated faults. A bad main connection can cause dimming, resets, no-crank, or low charging even when individual small fuses look intact. The 2003 public diagram shows a large main fuse and separate ignition/start and charging paths [3].\n\n**Limits:** This is a simplified topology, not a pinout or a substitute for the exact year/market schematic.\n\n### Start command path\n\n**Diagram:** `Ignition switch START → start/interlock logic (clutch or range, market-dependent) → starter control terminal → solenoid/motor; high-current battery feed supplies the starter separately.`\n\n**Explanation:** Testing the control terminal and the high-current terminal separately distinguishes an open command path from a bad starter or cable. A click proves movement/noise, not adequate contact or motor current.\n\n**Limits:** Automatic/manual, immobilizer, and market equipment change the control path; do not infer wire colors or terminal numbers from another NB.\n\n### Lighting branches\n\n**Diagram:** `Protected supply → light switch/relay or control module → function fuse → left/right lamp branch → local body ground; tail/park, turn/hazard, brake, and headlamp functions are separate branches.`\n\n**Explanation:** One dead side suggests socket, bulb, branch wire, or local ground; both sides suggest shared supply, switch/relay, or fuse feed. DRL-equipped diagrams add control logic and can change where the headlamp feed is switched [3].\n\n**Limits:** Fuse labels and ratings shown in secondary indexes are useful orientation only. Confirm the lid label and exact-market/year documentation before repair [5].\n\n## Model-year and market caveats\n\nThe NB spans 1998–2005, but the public 1999–2001 service reference, 2002 US owner manual, and 2003 wiring diagrams are not interchangeable as complete manuals. US 2002–2003 and 2004–2005 fuse assignments are broadly similar in the secondary index, but equipment differs, including Mazdaspeed fan/ABS/audio/fog options [5]. Headlight DRL versus non-DRL wiring, manual versus automatic transmission interlocks, immobilizer/security equipment, California/emissions controls, and non-US lighting rules can change circuit details. Use this note for test order and circuit logic only; use the car’s fuse-cover legend and exact-market wiring documentation for ratings, connector locations, and terminal identification.\n\n## References\n\n[1]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2002/mx5-miata/2002-mx-5-miata-owners-manual.pdf \"2002 Mazda MX-5 Miata Owner's Manual\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1999-2001.pdf \"Mazda Miata 1999–2001 public service reference\"\n[3]: https://www.mellens.net/mazda/mazda_miata_extra_manual/2003_wiring.pdf \"2003 Mazda MX-5 Miata system wiring diagrams\"\n[4]: https://forum.miata.net/vb/showthread.php?t=767251 \"Miata.net NB charging-voltage discussion\"\n[5]: https://fuse-box.info/mazda/mazda-mx-5-miata-nb-1999-2005-fuses \"Secondary NB fuse index, 2002–2005 coverage\"\n[6]: https://forum.miata.net/vb/archive/index.php/t-279746.html \"Miata.net enthusiast no-start troubleshooting discussion\"\n[7]: https://forum.miata.net/vb/showthread.php?t=472045 \"Miata.net enthusiast voltage-supply and ground discussion\"\n",
        "references": "## References\n\n[1]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2002/mx5-miata/2002-mx-5-miata-owners-manual.pdf \"2002 Mazda MX-5 Miata Owner's Manual\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1999-2001.pdf \"Mazda Miata 1999–2001 public service reference\"\n[3]: https://www.mellens.net/mazda/mazda_miata_extra_manual/2003_wiring.pdf \"2003 Mazda MX-5 Miata system wiring diagrams\"\n[4]: https://forum.miata.net/vb/showthread.php?t=767251 \"Miata.net NB charging-voltage discussion\"\n[5]: https://fuse-box.info/mazda/mazda-mx-5-miata-nb-1999-2005-fuses \"Secondary NB fuse index, 2002–2005 coverage\"\n[6]: https://forum.miata.net/vb/archive/index.php/t-279746.html \"Miata.net enthusiast no-start troubleshooting discussion\"\n[7]: https://forum.miata.net/vb/showthread.php?t=472045 \"Miata.net enthusiast voltage-supply and ground discussion\""

        "markdown": "# NB engine mechanical, fuel, ignition, emissions, and no-start diagnosis\n\n## Scope and model caveats\n\nThis note covers the second-generation MX-5/Miata (NB, broadly 1999–2005 in North America) and is intentionally a diagnostic outline rather than a reproduction of a workshop manual. The exact engine-control hardware varies by year, market, transmission, emissions package, and special model. In particular, 1999–2000 NB1 cars use a different intake strategy from 2001–2005 NB2 cars: the earlier cars use VICS, while NB2 uses intake-cam VVT and a revised ECU. The 2004–2005 Mazdaspeed is turbocharged and has a different calibration and hardware set; do not apply naturally aspirated assumptions to it. These generation changes are documented in the enthusiast buyer’s guide [4].\n\nMazda’s owner information is useful for operating warnings and safe starting/maintenance behavior, but it is not a complete fault-isolation manual. The owner manuals state that the check-engine lamp can indicate an emissions-control problem and warn against repeated long starter operation; they also emphasize that equipment descriptions can vary by model and option [1] [2].\n\n## Safe diagnostic sequence\n\nA crank/no-start should be treated as a missing requirement, not as a reason to replace parts. Establish: adequate cranking speed and stable battery voltage; correct mechanical timing and compression; a valid engine-speed signal; ignition spark at the correct time; injector command and fuel pressure/volume; then air, exhaust restriction, and emissions-control faults. Record fault codes and freeze-frame data before clearing anything. Keep fuel away from ignition sources, depressurize fuel lines safely, use an approved spark tester, and never probe an airbag/immobilizer circuit with improvised jumpers.\n\n## Procedures\n\n### 1. Classify the failure and capture baseline evidence\n\n**Symptom:** The engine does not crank, cranks slowly, cranks normally but never fires, or starts and immediately stalls.\n\n**Safety:** Neutral/park, parking brake set, wheels chocked. Do not crank continuously; Mazda’s owner guidance limits starter attempts and calls for a pause to protect the starter and battery [2].\n\n**Tools:** Battery tester or multimeter, scan tool, compression gauge, inspection light, notebook/camera.\n\n**Steps:**\n1. Confirm the complaint and distinguish no-crank from crank/no-start. Note whether the immobilizer/security indicator behaves normally for the car’s market and equipment.\n2. Check battery state, terminal tightness, engine/body grounds, and cranking speed. A weak battery can create misleading ignition and injector symptoms.\n3. With key ON, confirm the warning lamps perform their normal bulb check. A missing check-engine lamp or absent scan communication is evidence of a power, ground, fuse, connector, or module problem—not proof that the PCM is bad.\n4. Scan for stored and pending codes without erasing them. Treat an emissions code as a lead; it does not automatically explain a no-start.\n5. Inspect for recent work, water intrusion, rodent damage, disconnected grounds, loose intake ducting, and timing-belt history before testing individual components.\n\n**Tests:** Battery voltage at rest and during crank; scan-tool communication; visual fuse/ground/connector inspection; code capture.\n\n**Verify:** The failure mode and baseline electrical condition are documented before any part is substituted.\n\n**Mistakes:** Repeatedly cranking a weak battery, clearing codes before recording them, or assuming the most prominent code is the root cause.\n\n### 2. Check mechanical timing, compression, and engine-speed input\n\n**Symptom:** Strong cranking with no ignition, very low/uneven compression, a sudden loss of compression, or an intermittent hot no-start.\n\n**Safety:** Disable fuel/ignition as appropriate for the test plan; keep hands and clothing clear of belts and fans. Follow the exact engine-specific timing procedure for the installed engine.\n\n**Tools:** Compression gauge, remote starter switch or assistant, timing-mark light/inspection mirror, scan tool with live RPM if available, oscilloscope or back-probe tools where trained.\n\n**Steps:**\n1. Observe cranking sound and compare cylinder compression using the same test method on all cylinders. A uniform low result suggests test conditions, throttle position, valve timing, or battery speed; one or two low cylinders suggest a localized mechanical issue.\n2. Confirm cam-to-crank relationship at the timing marks. Do not infer belt integrity from the fact that the engine turns.\n3. During cranking, check whether the scan tool sees a plausible engine-speed signal. No RPM can point toward crank/cam sensing, wiring, power, or PCM input problems, but the exact sensor arrangement differs between NB variants.\n4. If timing is suspect, stop spraying fuel or repeatedly cranking until valve-train and belt condition are understood.\n\n**Tests:** Relative or cylinder compression; cam/crank correlation; live-RPM observation; continuity/power/ground checks against the correct year/market diagram.\n\n**Verify:** Compression and valve timing are adequate before condemning fuel or ignition control.\n\n**Mistakes:** Treating a sensor code as proof the sensor itself failed, using an unverified pinout, or timing the wrong engine variant.\n\n### 3. Separate ignition loss from fuel delivery and injector control\n\n**Symptom:** Cranks normally but does not even briefly fire, or runs only on a combustible spray (use only a controlled, manufacturer-safe method).\n\n**Safety:** Ignition produces high voltage; use an approved spark tester and keep fuel vapors away. Do not spray flammable liquid into an intake near an ignition source. Depressurize the rail before disconnecting fuel plumbing.\n\n**Tools:** Adjustable spark tester, noid light or injector current probe, multimeter, fuel-pressure gauge rated for the system, scan tool.\n\n**Steps:**\n1. Test for spark at a coil output/plug lead using the correct NB ignition arrangement. Check spark strength and repeatability while cranking; a single visible spark is not enough.\n2. If spark is absent, work backward through ignition power, coil/plug-lead condition, engine-speed input, grounds, and PCM control. Verify timing of the spark rather than only its presence.\n3. Check injector command with a noid light/current probe and confirm injector power supply. No command with valid RPM shifts attention to PCM power/grounds, immobilizer where fitted, sensor inputs, or wiring.\n4. If injector command exists, check whether plugs are dry, wet, or fuel-fouled. Wet plugs do not prove correct pressure or mixture; dry plugs do not prove a dead pump.\n5. Avoid a parts-swapping loop. Change one controlled variable and retest.\n\n**Tests:** Spark under cranking, injector pulse, injector supply, plug condition, and code/live-data correlation.\n\n**Verify:** The fault is assigned to ignition, injector control, or neither before proceeding to fuel-pressure diagnosis.\n\n**Mistakes:** Testing spark by holding a plug against random metal, using starting fluid as a substitute for pressure testing, or condemning the ECU before checking its power, grounds, and timing inputs.\n\n### 4. Test fuel-pump control, pressure/volume, and mixture/emissions causes\n\n**Symptom:** No fuel pressure, pressure that collapses during crank, lean start-and-stall, flooding, or an engine that runs but has a check-engine/emissions complaint.\n\n**Safety:** No smoking/open flame. Capture fuel in approved containers and use eye protection. Do not leave a diagnostic-box jumper installed while driving. Verify terminal identity for the specific year before applying any jumper.\n\n**Tools:** Fuel-pressure gauge and safe adapter, multimeter/test light, scan tool, vacuum gauge where useful, smoke tester for EVAP/intake leaks.\n\n**Steps:**\n1. Verify pump power and ground at the pump while it is commanded. On many Miata diagnostic boxes, an FP-to-ground test is used by owners to force the pump circuit for testing; the public reference explicitly warns that confusing battery-positive and ground can blow a fuse [5]. Treat this as a circuit-isolation test, not a factory universal procedure.\n2. If the pump runs, measure pressure and observe retention after shutdown. Low pressure can result from restricted filtration, weak pump, poor pump wiring, regulator problems, or a leak; pressure alone does not prove correct volume.\n3. If the pump does not run, test fuse, relay command, relay output, harness continuity, rear connector condition, and pump ground in that order. The public 2003 wiring reference shows the pump relay, PCM, fuse feeds, and rear fuel-pump circuit as separate parts of the system [3].\n4. Once the engine runs, investigate vacuum/intake leaks, coolant-temperature plausibility, MAF/air-meter signal, oxygen-sensor behavior, purge/EVAP faults, EGR where equipped, and exhaust restriction. A check-engine lamp is a prompt to diagnose the emissions system, not to replace the oxygen sensor automatically [2].\n5. For a suspected flooded engine, stop adding fuel, dry/replace fouled plugs as appropriate, verify oil is not fuel-diluted, and follow the year-specific clear-flood strategy rather than holding the throttle open blindly.\n\n**Tests:** Pump voltage drop, pressure and decay, fuel volume, injector leak/fueling evidence, smoke test, scan data, and code correlation.\n\n**Verify:** Fuel delivery is proven at the rail and the post-start mixture/emissions fault is separated from the original no-start.\n\n**Mistakes:** Assuming the pump must prime on key-ON, replacing the pump because it is quiet, trusting a pressure number without checking volume/voltage drop, or jumping an unlabeled diagnostic connector.\n\n## Wiring notes (simplified, not pinouts)\n\n### Fuel-pump control is a chain, not one component\n\n**Diagram:** `battery/fuse → main/engine relay feed → fuel-pump relay → rear harness/connector → pump → chassis ground`, with the PCM controlling the relay side.\n\n**Explanation:** The public 2003 system diagram presents the pump relay, PCM, fuse feeds, and pump unit as distinct elements [3]. Therefore, “no pump sound” should lead to voltage-at-pump and voltage-drop tests, not immediately to a pump replacement. An FP diagnostic-box test, where applicable, can bypass part of normal control for isolation [5].\n\n**Limits:** Connector location and terminal labeling vary by year/market. Use a verified diagram for the exact car and do not reproduce or rely on an unverified pinout.\n\n### Ignition and injector power share system dependencies\n\n**Diagram:** `ignition switch → fuse/relay feeds → coils/injectors and PCM power`, while `crank/cam signals → PCM → coil/injector control`.\n\n**Explanation:** A crank/no-start can remove both spark and injector pulse when a shared power, ground, engine-speed signal, or PCM input is missing. Test for supply and control separately. The 2003 wiring reference shows engine-performance circuits for crankshaft/camshaft position sensing, MAF, coils, injectors, and PCM connections [3].\n\n**Limits:** NB1/NB2, naturally aspirated/Mazdaspeed, LHD/RHD, and market emissions packages can change sensor/actuator hardware. Do not infer exact wire colors or connector cavities from another year.\n\n### Immobilizer is market/equipment dependent\n\n**Diagram:** `key/transponder (where fitted) → immobilizer coil/module → PCM authorization → normal engine-control operation`.\n\n**Explanation:** The 2003 wiring reference includes an immobilizer circuit, while owner manuals state that equipment descriptions vary by model and option [1] [2]. A security-indicator anomaly can inhibit starting on equipped cars, but it should be checked alongside PCM power, grounds, and engine-speed input.\n\n**Limits:** Do not assume every NB has the same immobilizer arrangement; early North American cars and other markets differ. Never jumper security wiring as a first-line test.\n\n## Model-year and market differences\n\n- North American 1999–2000 cars are generally NB1; 2001–2005 are NB2, with the VICS-to-VVT and ECU/intake/exhaust changes noted above [4].\n- 2004–2005 Mazdaspeed cars use turbo-specific engine management and hardware; naturally aspirated test assumptions may be unsafe or misleading [4].\n- Immobilizer, emissions equipment, diagnostic-box labeling, and OBD behavior can vary by market and equipment. Confirm the VIN, engine code, model year, and market before using a wiring diagram.\n- The enthusiast no-start discussion is useful only as anecdotal support for checking pump power, relay/harness condition, and sensor intermittency; it is not a specification source [6].\n\n## References\n\n[1]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2001/mx5-miata/2001-mx-5-miata-owners-manual.pdf \"2001 Mazda MX-5 Miata Owner's Manual\"\n[2]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2005/mx5-miata/2005-mx-5-miata-owners-manual.pdf \"2005 Mazda MX-5 Miata Owner's Manual\"\n[3]: https://www.mellens.net/mazda/mazda_miata_extra_manual/2003_wiring.pdf \"2003 Mazda MX-5 Miata System Wiring Diagrams\"\n[4]: https://www.onallcylinders.com/2025/02/13/1999-2005-mazda-miata-nb-buyers-guide-year-by-year-changes/ \"1999-2005 Mazda MX-5 Miata NB Buyer’s Guide: Year-by-Year Changes\"\n[5]: https://www.miataforumz.com/how-40/diagnostic-port-pinouts-349/ \"Miata Forumz Diagnostic Port Pinouts\"\n[6]: https://www.reddit.com/r/Miata/comments/ykes74/my_2000_nb_suddenly_wont_start_cranks_but_doesnt/ \"r/Miata: 2000 NB crank/no-start discussion\"\n",
        "references": "## References\n\n[1]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2001/mx5-miata/2001-mx-5-miata-owners-manual.pdf \"2001 Mazda MX-5 Miata Owner's Manual\"\n[2]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2005/mx5-miata/2005-mx-5-miata-owners-manual.pdf \"2005 Mazda MX-5 Miata Owner's Manual\"\n[3]: https://www.mellens.net/mazda/mazda_miata_extra_manual/2003_wiring.pdf \"2003 Mazda MX-5 Miata System Wiring Diagrams\"\n[4]: https://www.onallcylinders.com/2025/02/13/1999-2005-mazda-miata-nb-buyers-guide-year-by-year-changes/ \"1999-2005 Mazda MX-5 Miata NB Buyer’s Guide: Year-by-Year Changes\"\n[5]: https://www.miataforumz.com/how-40/diagnostic-port-pinouts-349/ \"Miata Forumz Diagnostic Port Pinouts\"\n[6]: https://www.reddit.com/r/Miata/comments/ykes74/my_2000_nb_suddenly_wont_start_cranks_but_doesnt/ \"r/Miata: 2000 NB crank/no-start discussion\""

        "title": "NB Miata cooling, heating, belts, hoses, and overheating diagnosis",
        "markdown": "# NB Miata cooling, heating, belts, hoses, and overheating diagnosis\n\n## Scope and evidence\n\nThis note covers the 1998–2005 MX-5/Miata NB family, with emphasis on safe diagnosis rather than replacing parts by guesswork. Mazda owner manuals are the safety baseline. A 2002 manual gives the same emergency sequence as the later 2005 manual; the 2005 manual adds explicit warnings about an unexpectedly running fan and hose condition. The 949 Racing article is a useful enthusiast/technical interpretation of NA/NB airflow and coolant-routing behavior, but it is not factory documentation and includes track-use opinions. The wiring observations below are simplified circuit logic, not a reproduced factory diagram or pinout.\n\n## Generation and market caveats\n\n- “NB” generally means 1998–2005, but the fan hardware, relay layout, connector details, engine (1.6 or 1.8), emissions package, transmission, and market can vary. Confirm the vehicle by VIN, engine, and the under-hood fuse/relay labels before probing.\n- NB1 (roughly 1998–2000) and NB2 (roughly 2001–2005) should not be assumed to share relay locations, fan-control details, or wire colors. The 1999–2000 enthusiast modification reference is specifically not a universal NB procedure.\n- The dashboard gauge is an indication of coolant temperature, not proof that coolant is circulating correctly. A normal gauge does not rule out a localized air pocket, poor flow, or a sensor/gauge fault.\n- The 949 Racing source is especially relevant to modified or track-driven cars. Its airflow conclusions should not be treated as a diagnosis for every stock street car.\n\n## Diagnostic procedures\n\n### 1. Immediate response to an overheating indication\n\n**Symptom:** Gauge moves toward H, loss of power, or abnormal pinging/knocking.\n\n**Safety:** Stop driving hard. Steam and pressurized coolant can burn; do not remove the radiator/cooling-system cap while hot. The fan may start unexpectedly with the ignition on, so keep hands, clothing, and tools clear.\n\n**Tools:** Gloves and eye protection; flashlight; phone or roadside assistance. No tool is required for the first stop.\n\n**Steps:**\n1. Reduce load, pull safely off the road, select Park or Neutral, and apply the parking brake.\n2. Turn the A/C off. Look for steam or active coolant escaping without putting your face or hands near the front of the car.\n3. If steam is present, stop the engine and wait until steam dissipates before opening the hood. If there is no steam or visible leak, allow the engine to idle only while monitoring it and stop the engine if temperature does not fall.\n4. Once cool, inspect the belt, hose connections, radiator area, and reservoir. Do not add coolant to a hot engine. If a belt is broken, coolant is leaking, or the fan is not operating, do not continue driving; arrange recovery.\n\n**Tests:** Compare the cold reservoir level with the marked range; inspect for wet trails, dried coolant residue, split hose ends, and belt damage. A cooling fan that does not operate during an overheating event is a stop condition, not an invitation to bypass the control circuit.\n\n**Verify:** After the root cause is repaired, refill with the correct coolant mixture, bleed air using the vehicle-specific service method, and confirm stable temperature during idle and a controlled road test.\n\n**Mistakes:** Opening the cap hot, standing over the radiator, continuing because the gauge later falls, or treating a temporary cool-down as a repair.\n\n### 2. Separate coolant loss, circulation, and airflow faults\n\n**Symptom:** Repeated overheating, low reservoir, gurgling, a cold heater, or temperature that rises at idle versus at speed.\n\n**Safety:** Work cold. Support the car securely if inspecting underneath. Keep the belt and fan clear during any running test.\n\n**Tools:** Flashlight; cooling-system pressure tester with the correct adapter if available; thermometer or scan tool; drain pan; inspection mirror.\n\n**Steps:**\n1. With the engine cold, establish the baseline: radiator/cooling-system level if accessible, reservoir level, hose condition, belt condition, and evidence of external leaks.\n2. Pressure-test only on a cold system and look for leaks at the radiator, hose joints, thermostat housing, heater hoses, water-pump area, and reservoir/cap interfaces.\n3. If level is correct and no external leak appears, check for circulation and trapped air. A heater that stays cold while the engine overheats suggests low coolant, air, or inadequate flow; it is not proof of a bad thermostat by itself.\n4. Compare symptom conditions. Overheating mainly at idle points toward fan operation, airflow, or an obstructed radiator; overheating mainly under sustained load or speed points toward heat rejection, restriction, coolant flow, combustion-gas intrusion, or vehicle modifications.\n5. If coolant disappears without an external leak, stop escalating parts replacement and test for combustion-gas intrusion or have a qualified shop perform that test.\n\n**Tests:** Pressure loss with no external wetness, repeated air return, bubbling after proper filling, oil/coolant contamination, or exhaust-gas evidence materially changes the diagnosis. Do not infer head-gasket failure from a single bubble or a single gauge event.\n\n**Verify:** No unexplained pressure loss; heater produces stable heat; fan and radiator airflow are adequate; temperature remains stable after warm-up, idle, and a measured road test.\n\n**Mistakes:** Replacing the thermostat before confirming coolant level and leaks; using only the reservoir as proof the radiator is full; ignoring a damaged undertray or blocked radiator fins; adding a thicker radiator before fixing airflow or leaks.\n\n### 3. Belt, hose, thermostat, and radiator inspection\n\n**Symptom:** Overheating after belt noise, visible hose deterioration, slow warm-up, rapid temperature rise, or unexplained coolant loss.\n\n**Safety:** Engine off and cold for contact inspections. Keep fingers away from the belt path. Use only the specified coolant chemistry and do not mix incompatible products.\n\n**Tools:** Flashlight; belt-tension/deflection reference for the exact engine; straightedge; cooling-system pressure tester; infrared thermometer; replacement clamps only after diagnosis.\n\n**Steps:**\n1. Inspect the alternator/water-pump drive belt for breakage, looseness, glazing, cracking, contamination, and misalignment. Mazda explicitly warns that a loose or broken belt can stop water-pump drive and lead to overheating.\n2. Inspect every accessible cooling and heater hose for swelling, soft spots, hardening, cracks, chafing, and leaking connections. Replace deteriorated hoses rather than tightening a clamp onto damaged rubber.\n3. Check the radiator core and fins for blockage, bent fins, external contamination, and evidence that air can bypass the core. Check that shrouds, seals, and the undertray are present where applicable.\n4. Test the thermostat and radiator cap against exact-vehicle specifications if symptoms support them. A thermostat swap without confirming the symptom pattern can hide a leak, air pocket, fan fault, or restriction.\n5. Refill and bleed with a compatible ethylene-glycol coolant mixture and demineralized/soft water as specified by Mazda’s owner information; do not exceed the owner-manual mixture limits.\n\n**Tests:** Belt condition and drive must be confirmed before blaming the pump. Pressure-test for hose/radiator leaks. Use temperature comparison across the radiator only as a clue; an infrared reading is not a substitute for the correct service test.\n\n**Verify:** Cold level is stable over repeated heat cycles, hoses remain dry, belt tracks correctly, heater output is stable, and operating temperature is repeatable.\n\n**Mistakes:** Running with a loose belt, using plain water or an unsuitable coolant, over-tightening hose clamps, or assuming a new radiator fixes poor airflow.\n\n### 4. Cooling-fan electrical diagnosis without guessing\n\n**Symptom:** Overheats in traffic or at idle; fan never runs; fan runs only with A/C; intermittent operation; blown fuse or melted connector.\n\n**Safety:** The fan can start with ignition on and the engine stopped. Use fused test leads, back-probe carefully, and never short unknown terminals. Disconnect the battery only when the test requires it, because some checks need ignition power.\n\n**Tools:** Wiring diagram for the exact year/market; digital multimeter; fused jumper leads; test light; current clamp if available; serviceable fuse of the specified rating.\n\n**Steps:**\n1. Confirm the symptom with the engine cold-to-warm while monitoring temperature; do not intentionally overheat the engine.\n2. Check the fan blade for obstruction and the motor connector for corrosion, heat damage, loose terminals, or broken ground. A brief direct motor test uses a fused supply and ground, with hands clear.\n3. Check the fan fuse for continuity and verify power at the supply side. A visually good fuse is not enough if the socket or terminal is heat-damaged.\n4. Check relay feed and ignition/control supply, then check continuity from the relay output toward the fan. A voltage-drop test under load is better than an open-circuit voltage check alone.\n5. Check the control side: the ECU/temperature-switch command path and the diagnostic-box fan test point vary by year and market. Use the correct diagram; do not transplant NB1 wire colors or relay positions into an NB2 car.\n6. Test the A/C request path separately. A/C fan operation can prove part of the fan-power path but does not prove that the temperature-triggered control path works.\n\n**Tests:** The enthusiast wiring reference describes a useful logical sequence: supply at fuse, fuse continuity, relay feed, relay-switched output continuity, motor ground, and control-path continuity. Treat its wire-color examples as model-specific clues only. If a motor runs directly but not through the car, move upstream to fuse, relay, connector, ground, and command—not to another motor.\n\n**Verify:** Both the normal temperature-triggered behavior and the A/C-related behavior match the exact vehicle’s wiring information, with no overheated terminals and no repeat fuse failure.\n\n**Mistakes:** Installing a larger fuse, jumping unknown relay terminals, permanently paralleling fans as a “fix,” or assuming the A/C fan logic is identical to the engine-cooling-fan logic.\n\n### 5. Modified or track-driven NB: diagnose airflow before adding parts\n\n**Symptom:** Stock-like street driving is acceptable but temperature climbs on track, in hot weather, with A/C, or after intake/intercooler/undertray changes.\n\n**Safety:** Validate the street cooling system first. Do not use a manual fan switch as a substitute for automatic protection. Secure all test wiring away from hot and moving parts.\n\n**Tools:** Temperature logger or scan tool; inspection light; anemometer only if available; checklist of ducting, undertray, radiator, fan shroud, and intercooler changes.\n\n**Steps:**\n1. Confirm coolant level, pressure integrity, belt, thermostat, fan operation, radiator condition, and correct bleeding before evaluating modifications.\n2. Inspect whether air is forced through the radiator rather than around it. Missing seals, a damaged undertray, and intercooler openings can pressurize the engine bay and reduce radiator pressure differential.\n3. Check that the radiator is not over-thick for the available airflow. Improving ducting and extraction can be more effective than simply adding core thickness.\n4. Compare temperature versus speed, load, A/C state, and ambient temperature. Record conditions instead of relying on memory.\n5. Restore a known-good configuration before changing one item at a time.\n\n**Tests:** The 949 Racing technical article attributes common NA/NB track problems to airflow leakage and the OEM coolant path, while noting that conclusions are based on enthusiast testing and consensus. Use it to form hypotheses, then verify with repeatable temperature data.\n\n**Verify:** The car remains stable in the intended duty cycle with automatic fan control intact and no coolant loss.\n\n**Mistakes:** Adding larger intake openings that bypass the radiator, removing the undertray, stacking modifications, or accepting a fan-parallel modification that overloads a relay.\n\n## Simplified wiring notes\n\n### Fan power and control are separate paths\n\n**Diagram:** `battery/fusible supply → fan fuse → relay contacts → fan motor → ground`; `temperature/ECU or A/C request → relay coil/control → relay contacts`\n\n**Explanation:** A fan can be electrically healthy yet not run because its fuse feed, relay contacts, connector, ground, or control command is open. A direct motor test checks only the motor and part of its ground/supply path. A/C operation may exercise a different request or relay path than temperature-triggered cooling.\n\n**Limits:** This is a conceptual circuit, not a year-specific pinout. Relay locations, fan count, control strategy, and colors differ across NB1/NB2 and markets.\n\n### Use voltage drop under load, not continuity alone\n\n**Diagram:** `loaded supply → meter across each connection → unexpectedly high drop identifies the restriction`\n\n**Explanation:** A corroded fuse socket, relay contact, crimp, or ground can show continuity and near-battery voltage with no load, then fail when the fan draws current. Measure across the fuse, relay path, connector, and ground while the fan is commanded on.\n\n**Limits:** Exact acceptable voltage-drop limits depend on the circuit and test setup. Follow the exact service information and use a fused test lead.\n\n### Diagnostic-box or relay jump tests are conditional\n\n**Diagram:** `approved test point → control/relay command → fan circuit`\n\n**Explanation:** Some enthusiast references describe grounding a designated diagnostic-box point to command the fan. This can isolate the control side from the motor/fuse/relay side, but only when the exact year/market diagram confirms the terminal. If the fan still does not run, continue downstream testing rather than repeatedly swapping relays.\n\n**Limits:** Do not copy a terminal name or wire color from an NA, NB1, NB2, or different-market diagram without verification. Never jumper unknown terminals or bypass the specified fuse.\n\n## References\n\n[1]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2002/mx5-miata/2002-mx-5-miata-owners-manual.pdf \"2002 Mazda MX-5 Miata Owner's Manual\"\n[2]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2005/mx5-miata/2005-mx-5-miata-owners-manual.pdf \"2005 Mazda MX-5 Miata Owner's Manual\"\n[3]: https://949racing.com/supermiata/tech-info/na-nb-cooling-system-performance/ \"90-05 NA/NB Miata Cooling System Performance, 949 Racing\"\n[4]: https://www.miata.net/garage/parallel_fan.html \"Parallel Fan Operation - '99-2000, Miata.net Garage\"\n[5]: https://forum.miata.net/vb/showthread.php?t=607253 \"General Wiring Question - Cooling Fan, MX-5 Miata Forum\"\n",
        "references": "## References\n\n[1]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2002/mx5-miata/2002-mx-5-miata-owners-manual.pdf \"2002 Mazda MX-5 Miata Owner's Manual\"\n[2]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2005/mx5-miata/2005-mx-5-miata-owners-manual.pdf \"2005 Mazda MX-5 Miata Owner's Manual\"\n[3]: https://949racing.com/supermiata/tech-info/na-nb-cooling-system-performance/ \"90-05 NA/NB Miata Cooling System Performance, 949 Racing\"\n[4]: https://www.miata.net/garage/parallel_fan.html \"Parallel Fan Operation - '99-2000, Miata.net Garage\"\n[5]: https://forum.miata.net/vb/showthread.php?t=607253 \"General Wiring Question - Cooling Fan, MX-5 Miata Forum\""

        "markdown": "# NB chassis: clutch, transmission, differential, brakes, steering, suspension, rust, and top\n\n**Scope.** Generation NB means Mazda MX-5/Miata model years 1999–2005 in the common North American naming convention. Confirm the VIN, market, engine, ABS fitment, transmission, limited-slip differential, and soft-top/glass-window configuration before applying any test. The 2003 Mazda owner manual explicitly covers multiple equipment combinations, so not every described feature is installed on every car [1].\n\n## Diagnostic posture\n\nStart with a road-test symptom and a visual/physical inspection. Check fluid level and condition, leaks, fastener security, boots, lines, mounts, and obvious structural damage before condemning a component. A failed part may be the result of rust, misadjustment, air, contamination, worn bushings, or a preceding hydraulic/electrical fault. Raise the car only on rated stands with the wheels chocked; never rely on a jack. Brake and clutch hydraulic work requires clean compatible fluid and a controlled bleed, not repeated pedal pumping against an unknown corroded master cylinder.\n\n## Procedures\n\n### 1. Clutch complaint: separate release hydraulics from clutch or gearbox wear\n\n**Symptom:** hard shifting, reverse crunch, clutch engagement near the floor, slipping under load, or pedal that changes after repeated use.\n\n**Safety:** Engine off for linkage checks; keep hands clear when testing with the engine running. Do not drive if the clutch cannot reliably disengage.\n\n**Tools:** flashlight; gloves; catch bottle and hose; compatible brake/clutch fluid; basic hand tools; ruler or tape measure; optional pressure/vacuum bleeder.\n\n**Steps:**\n1. Record whether the fault is pedal feel, incomplete release, or clutch slip. With the engine off, select every gear; then check whether reverse engagement changes when the pedal is held down.\n2. Inspect the reservoir, master-cylinder area, pipe, flexible hose, slave cylinder, and bellhousing for wetness. Look for a damaged dust boot or fluid emerging from the slave.\n3. Observe slave-cylinder movement while an assistant operates the pedal. Movement that is low, delayed, or inconsistent points first to air, leakage, flexing hose, or master/slave wear; no movement requires hydraulic tracing before transmission removal.\n4. Bleed only after finding and correcting leaks. If release travel is normal but the clutch slips in a higher gear under steady load, inspect clutch friction, pressure plate, and flywheel rather than adjusting the pedal to hide it.\n5. If release is normal but one gear remains difficult, compare engine-off and engine-running behavior and inspect shift mechanism/oil level before blaming synchronizers.\n\n**Tests:** Hold the pedal down for 30–60 seconds; sinking indicates hydraulic bypass or leakage. Check reverse with the pedal fully down after a short pause. During a cautious road test, note whether engine speed rises without matching road speed (slip) or whether selecting gears is the primary issue.\n\n**Verify:** No leaks, stable pedal, repeatable release, quiet engagement, and no slip on a controlled load test. Exact free-play and fluid specification should be taken from the VIN/market-specific service information, not assumed from an internet guide.\n\n**Mistakes:** Replacing the clutch before proving hydraulic travel; forcing reverse; bleeding with an empty reservoir; confusing worn engine/transmission mounts or low gearbox oil with clutch failure.\n\n### 2. Transmission and differential noise: locate the source before opening either unit\n\n**Symptom:** whine, rumble, clunk on throttle transition, vibration, hard shifts, or fluid spots.\n\n**Safety:** Inspect hot components cautiously. Support the driveline and never run a driven wheel while the car is supported unsafely.\n\n**Tools:** inspection light; clean drain pan; gloves; suitable fill pump; magnet; chassis ears or mechanic’s stethoscope if available; service-level fluid information for the exact gearbox/differential.\n\n**Steps:**\n1. Road-test in a repeatable loop: coast, light acceleration, steady cruise, and on/off throttle in the same gear. Record whether noise follows vehicle speed, engine speed, or torque direction.\n2. Inspect transmission, propeller shaft, differential case, axle seals, boots, and mounts. Check for impact damage and loose fasteners before interpreting a clunk as gear damage.\n3. Confirm fluid level through the correct fill point before draining. Look for metallic paste or chips on the drain plug magnet; a small paste film is not equivalent to large chips.\n4. Check driveshaft and axle play with the car safely supported, distinguishing normal backlash from a sharp knock, loose flange, or failed joint. Do not rotate parts with fingers near pinch points.\n5. If the symptom changes with steering load, tire condition, or wheel bearing play, rule out those sources. If it is torque-direction-specific and fluid/ mounts are sound, escalate to a driveline specialist.\n\n**Tests:** Compare noise in neutral while stationary, at constant speed in different gears, and on coast versus drive. Verify that a suspected wheel bearing changes with corner loading; this is not proof by itself.\n\n**Verify:** The confirmed source reproduces the original symptom and the repair removes it without introducing driveline vibration. Fluid intervals and grades vary by market and LSD/gearbox configuration; Mazda’s later owner schedule demonstrates that transmission and differential service are configuration- and condition-dependent rather than universal NB values [2].\n\n**Mistakes:** Filling through the wrong plug; using an LSD additive or fluid without confirming differential type; diagnosing by noise alone; ignoring axle boots, mounts, or bent underbody parts.\n\n### 3. Brake pull, low pedal, or ABS warning: hydraulic and mechanical sequence\n\n**Symptom:** pull, vibration, low/spongy pedal, uneven pad wear, dragging wheel, or ABS lamp.\n\n**Safety:** Brakes are safety-critical. Stop driving if the pedal is sinking, fluid is leaking, a hose is damaged, or a wheel is overheating. Use proper stands and protect friction surfaces from fluid.\n\n**Tools:** flashlight; brake-fluid tester if available; temperature comparison tool; line clamp only where appropriate; scan/diagnostic capability for ABS; pressure or vacuum bleeder.\n\n**Steps:**\n1. Check warning lamps, reservoir level, visible lines/hoses, calipers, pad thickness, rotor condition, wheel torque, and tire pressures. The public NB inspection guide specifically recommends checking pad/rotor condition through the wheel and looking for leaks and bent suspension [3].\n2. For a pull, compare tire pressures and tire condition, then inspect caliper slide/piston operation, hose restriction, pad contamination, and wheel-bearing play. Do not assume the steering rack is at fault.\n3. For a low pedal, check for external leaks first, then air, excessive pad/caliper travel, rear adjustment condition where applicable, and master-cylinder bypass. A firm pedal that slowly sinks under constant pressure is a different path from a pedal that is spongy immediately.\n4. For vibration, separate pedal pulsation from steering-wheel shake and inspect rotor runout, hub face cleanliness, wheel bearing, and suspension play.\n5. For ABS faults, inspect sensor wiring, tone-ring/reluctor condition, connectors, fuses, and stored codes before replacing a hydraulic unit. The 2003 public wiring reference shows ABS as a fused system with a brake switch, hydraulic/control module, four wheel-speed sensors, cluster, and data-link connections [4].\n\n**Tests:** Static pedal-hold test; low-speed controlled stop; wheel-temperature comparison after equal braking; ABS code and live wheel-speed comparison where supported. Never test ABS on public roads beyond a safe, legal low-speed check.\n\n**Verify:** Straight, repeatable stops; stable pedal; no leaks or drag; warning lamps self-check then extinguish as expected for that car’s equipment. Mazda owner information treats brake lines, hoses, disc brakes, parking brake, steering linkages, and suspension as recurring inspection items [1][2].\n\n**Mistakes:** Bleeding around a hidden leak; replacing pads without correcting a seized slider; using contaminated pads; clearing ABS codes without checking sensor wiring; mixing market-specific ABS assumptions.\n\n### 4. Steering and suspension: identify play, collapsed mounts, and structural risk\n\n**Symptom:** wandering, shimmy, clunk, uneven tire wear, harsh ride, nose dive, or poor return-to-center.\n\n**Safety:** Do not road-test a car with loose steering, a cracked/rusted structural member, a separated ball joint, or a damaged tire. Support the car at approved structural points and keep fingers away from loaded joints.\n\n**Tools:** pry bar; inspection light; wheel chocks; jack/stands; torque wrench; tread-depth gauge; alignment measurement or shop alignment equipment.\n\n**Steps:**\n1. Check tires and pressures, then inspect ride height, leaks, bent arms, tie rods, ball joints, sway-bar links, bushings, wheel bearings, and shock bodies.\n2. Rock the wheel at 3/9 o’clock and 12/6 o’clock, then isolate play by watching each joint while an assistant moves the wheel. Play can be steering linkage, bearing, or suspension; the observation matters more than the position alone.\n3. Inspect upper shock mounts/top hats and bump stops. The NB inspection guide identifies shocks, mounts, and bump stops as age-sensitive items and notes that collapsed mounts can create a harsh ride [3].\n4. Inspect front frame rails, rocker panels, floor pans, suspension pickup areas, and rear structure before alignment. NB frame-rail corrosion is a known structural inspection item [3].\n5. Correct worn or bent parts, set tire pressures, then obtain a four-wheel alignment. Alignment readings are evidence of geometry; they are not a substitute for finding looseness or rust.\n\n**Tests:** Bounce/settle comparison is only a screen. Use joint-play observation, wheel-bearing feel, tire wear pattern, and alignment printout together. Recheck fasteners and steering-center after repair.\n\n**Verify:** No detectable safety-critical play, no contact or fluid leak, predictable steering, even braking, and alignment within the chosen road/track specification.\n\n**Mistakes:** Installing lowering springs before checking rust and mounts; aligning around a bent or loose part; calling every clunk a sway-bar link; relying on a visual rust check from outside the rocker alone.\n\n### 5. Rust, water ingress, and soft top: diagnose the path, not the symptom\n\n**Symptom:** bubbling paint, wet carpet/trunk, musty smell, corroded hardware, torn top, cloudy window, or top that binds.\n\n**Safety:** Structural corrosion can make lifting and suspension loads unsafe. Keep fingers clear of folding top bows and do not operate a zipper under tension.\n\n**Tools:** flashlight; trim-safe probe; magnet; absorbent paper; low-pressure water source; gloves; drain-cleaning tool that cannot puncture a tube; camera.\n\n**Steps:**\n1. Inspect NB rocker panels, fender arches, floor pans, jack/spare area, suspension pickup zones, and especially front frame rails. Bubbles or external rocker rust may conceal deeper structural corrosion; the Miata.net guide calls this out explicitly [3].\n2. Check inside the cabin and trunk after a controlled low-pressure water test, following the water path from top/rain rail to drains. Do not use a pressure washer as a diagnostic.\n3. Inspect drain openings and tubes for blockage, disconnection, kinks, or crushed exits. Dry the area and check for secondary corrosion before patching trim or carpet.\n4. For the soft top, unlatch it from the windshield header before moving a zippered rear window. Lower and raise it slowly; zip the window before clamping the header. Inspect seams, rain rail, window, latches, and frame alignment. These operating sequences and window failure signs are documented in the NB inspection guide [3].\n5. Classify corrosion as cosmetic panel rust, repairable localized metal, or structural/section loss requiring a qualified body or chassis shop. Do not seal over active rust or use filler as structural repair.\n\n**Tests:** Repeat the water test after clearing a drain. Compare wet location with the suspected entry point. Photograph metal before cleaning so the extent is not lost.\n\n**Verify:** Drains flow freely, cabin/trunk remain dry, top latches without force, window is not being twisted, and a competent inspector confirms structural soundness.\n\n**Mistakes:** Poking through a soft drain tube; lowering the top with a zippered window still tensioned; treating frame-rail rust as cosmetic; replacing carpet before finding the water path.\n\n## Wiring notes (simplified; no pinouts)\n\n### Brake/ABS topology\n\n`battery/fuse protection → brake switch → stop lamps / cluster / control inputs`\n\n`wheel-speed sensors (4) → ABS control/hydraulic unit → warning cluster + diagnostic connector`\n\nThe 2003 public diagram supports this block-level topology. It is a routing aid, not a substitute for the exact year/market diagram; do not infer wire colors or connector cavities from this summary [4].\n\n### Engine-control power as a diagnostic boundary\n\n`ignition RUN/START → engine fuse → ECU/main relay control → relay-switched ECU and actuator power`\n\nThe 2003 rusEFI reference describes the ECU/main-relay relationship and notes a year change from 2002, which is a useful warning against carrying NA/NB or year-to-year pin assumptions forward [5]. Test power, grounds, relay command, and load-side voltage under the actual fault instead of probing a connector by color alone.\n\n### Clutch/starting interlock caveat\n\n`pedal switch(es) → starter/cruise/engine-control logic (equipment-dependent) → relay or ECU decision`\n\nA manual-transmission clutch switch may be involved in starting or cruise-control logic, but exact implementation varies by market, year, and cruise/immobilizer equipment. Confirm the relevant circuit in the VIN-specific wiring diagram and test continuity/state change at the switch before bypassing anything. Never defeat an interlock as a permanent repair.\n\n## Model-year and market differences\n\n- NB is commonly 1999–2005, but “NB” includes early and facelift cars, different engines, ABS availability, cruise/immobilizer equipment, transmissions, and differential choices.\n- North American, European, Japanese, and other-market cars can differ in emissions, lighting, ABS, immobilizer, wiring, and service intervals. The 2003 Mazda manual says its descriptions cover options that may not be fitted [1].\n- The 2003 wiring reference is useful for topology but is a Mitchell-derived public reference and should not be treated as an authoritative pinout for another year or market [4].\n- Enthusiast inspection material is valuable for recurring NB issues such as frame-rail rust, collapsed mounts, and top handling, but it is not a substitute for structural inspection, measured diagnosis, or the applicable Mazda service information [3].\n\n## References\n\n[1]: https://www.mazda.ca/globalassets/mazda-canada/en/pdf/manuals/vehicles/mx-5/2003_mx-5_manual_en_optimized.pdf \"2003 Mazda MX-5 Owner’s Manual\"\n[2]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07020100.html \"Mazda MX-5 Scheduled Maintenance\"\n[3]: https://www.miata.net/garage/Checking%20Out%20a%20Used%20Miata%20-%20Update%202018.pdf \"Checking Out a Used NA or NB Miata\"\n[4]: https://www.mellens.net/mazda/mazda_miata_extra_manual/2003_wiring.pdf \"2003 Mazda MX-5 Miata System Wiring Diagrams\"\n[5]: https://wiki.rusefi.com/Mazda-Miata-2003/ \"rusEFI 2003 Mazda Miata reference\"\n[6]: https://bofiracing.com/blog/mx5-miata-workshop-manuals/ \"BOFI Racing MX-5/Miata workshop-manual index\"\n",
        "references": "## References\n\n[1]: https://www.mazda.ca/globalassets/mazda-canada/en/pdf/manuals/vehicles/mx-5/2003_mx-5_manual_en_optimized.pdf \"2003 Mazda MX-5 Owner’s Manual\"\n[2]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07020100.html \"Mazda MX-5 Scheduled Maintenance\"\n[3]: https://www.miata.net/garage/Checking%20Out%20a%20Used%20Miata%20-%20Update%202018.pdf \"Checking Out a Used NA or NB Miata\"\n[4]: https://www.mellens.net/mazda/mazda_miata_extra_manual/2003_wiring.pdf \"2003 Mazda MX-5 Miata System Wiring Diagrams\"\n[5]: https://wiki.rusefi.com/Mazda-Miata-2003/ \"rusEFI 2003 Mazda Miata reference\"\n[6]: https://bofiracing.com/blog/mx5-miata-workshop-manuals/ \"BOFI Racing MX-5/Miata workshop-manual index\""
