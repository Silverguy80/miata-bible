  {id:'timing-belt-na-nb',book:'engine',system:'Engine timing drive',title:'Replace the NA/NB timing belt and inspect the front cover',applies:['NA','NB'],tags:['timing belt','water pump','cam seals','crank seal','front cover'],difficulty:'Advanced',time:'5–10 hr',symptoms:'Unknown service history, belt age, oil contamination, water-pump noise, cam-seal leak, front-cover leak, or a broken belt/no-start condition.',tools:['Quality jack and stands','Crank-holding method','Pulley puller as required','Torque wrench','Cam/crank timing references','Cooling-system fill and bleed equipment','Paint marker and inspection light'],safety:'Support the vehicle securely, disconnect the battery where appropriate, control coolant and oil spills, and never rotate the engine with tools or fingers in a pinch point. Confirm the exact engine, market, and service information before using timing marks or torque values.',steps:['Record the exact chassis, engine, transmission, market, mileage, prior belt date, and any leak or overheating symptoms before disassembly.','Remove the required covers, accessory drive components, crank pulley, and timing covers using an organized fastener map. Photograph routing and label connectors and brackets.','Rotate the engine by hand in its normal direction to the verified reference position. Confirm crank and cam marks using the exact engine procedure; do not trust paint marks from a previous repair.','Inspect the old belt for oil, coolant, glazing, fraying, missing teeth, abnormal tracking, and tension. If the belt failed, inspect the cam drive, valves, tensioner path, and compression before assuming only a belt is needed.','With access available, inspect or renew the water pump, tensioner or idler components, cam seals, crank seal, front-cover sealing surfaces, and any oil or coolant source that could contaminate the new belt. Replace only with parts matched to the exact engine and belt system.','Clean sealing and mating surfaces without gouging aluminum. Keep oil, coolant, sealant, and fingerprints off the new belt and pulley teeth.','Install the belt with the tension side controlled, maintain the verified cam/crank relationship, set tension using the engine-specific method, and tighten fasteners to the authorized specification.','Rotate the engine by hand through at least two complete crank revolutions. Return to the reference position and confirm the marks, belt tracking, tension, and absence of binding.','Reassemble covers, accessory drives, hoses, connectors, and coolant plumbing. Refill and bleed the cooling system using the generation-appropriate method.','Start the engine and monitor oil pressure indication, belt tracking, coolant temperature, leaks, idle quality, and abnormal noise. Recheck after a complete heat cycle and document the parts, date, mileage, and observations.'],verify:'The engine rotates freely by hand, cam and crank references return correctly, the belt tracks centrally, there are no oil or coolant leaks, coolant temperature is stable, and the build record contains the service date and mileage.',mistakes:'Replacing only the belt after an oil leak; relying on old paint marks; turning the crank backward as a timing method; reusing a contaminated belt; pinching the belt between teeth; skipping the two-revolution recheck; failing to bleed the cooling system.',sources:['Mazda service information for the exact engine and market','Mazda owner information for maintenance context','Verified belt, pump, seal, and tensioner manufacturer instructions'],related:['compression-plan','cooling-triage','maintenance-baseline']},
  {id:'timing-chain-boundary-nc-nd',book:'engine',system:'Engine timing drive',title:'NC/ND timing-chain service boundary and diagnosis',applies:['NC','ND'],tags:['timing chain','cam timing','VVT','chain noise','diagnosis'],difficulty:'Advanced',time:'Diagnosis: 2–6 hr',symptoms:'Timing correlation codes, chain noise, VVT faults, extended cranking, cam/crank mismatch, or suspected chain wear.',tools:['Scan tool where supported','Compression or leak-down tools','Mechanical timing references','Oil-pressure test method','Engine-specific locking tools'],safety:'Do not apply the NA/NB belt procedure to an NC or ND. Timing-chain work can require engine-specific locking, cover removal, oil control, and calibration procedures.',steps:['Confirm the exact engine and revision, record codes and freeze-frame data, and listen for when the noise or starting symptom occurs.','Check oil level, oil condition, oil-pressure evidence, VVT control, battery voltage, and cam/crank correlation before condemning chain components.','Inspect for mechanical timing errors, guide or tensioner concerns, and prior repair evidence using the engine-specific service procedure.','If the chain must be serviced, use the exact locking, mark, tensioner, guide, sealant, and verification sequence for the engine.','After assembly, verify hand rotation, correlation data, oil pressure, leak-free operation, and the original symptom under the same conditions.'],verify:'The timing fault is separated from low voltage, oil-pressure, VVT, sensor, wiring, and calibration causes before chain parts are ordered.',mistakes:'Assuming every timing code means a stretched chain; using NA/NB belt marks; ignoring oil pressure or VVT control; starting without the required locking method.',sources:['Mazda service information for the exact NC or ND engine','Authorized parts and timing-component instructions'],related:['trouble-crank-no-start','compression-plan']}

  {id:'maintenance-fluid-map',book:'maintenance',system:'Routine service',title:'Build a generation-correct fluid and filter service plan',applies:['NA','NB','NC','ND'],tags:['maintenance','fluids','filters','service schedule'],difficulty:'Foundational',time:'1–3 hr planning',symptoms:'Unknown history, overdue service, new ownership, or preparing for long storage.',tools:['VIN and fitment record','Service log','Drain pans','Labels'],safety:'Use the exact fluid specification and disposal method for the vehicle and market. Never mix fluids because a container looks similar.',steps:['Record engine, transmission, differential, brake, clutch, coolant, A/C, and power-assist system configuration.','Separate time-based, mileage-based, condition-based, and event-based service items.','Inspect filters, belts, hoses, seals, plugs, battery, tires, brakes, and fluid contamination before ordering a kit.','Write a service sequence that prevents cross-contamination and leaves a verification step after each fluid is filled.','Record brand, specification, quantity, date, mileage, and any abnormal finding.'],verify:'The car has a traceable service record and no fluid level, leak, specification, or disposal question is left undocumented.',mistakes:'Using a generic internet capacity; filling to a mark without the correct surface or temperature; mixing coolant or brake fluids.',...common},
  {id:'spark-plug-service',book:'fuel',system:'Ignition',title:'Inspect and replace spark plugs by engine and use case',applies:['NA','NB','NC','ND'],tags:['spark plugs','ignition','misfire','maintenance'],difficulty:'Foundational',time:'45–90 min',symptoms:'Scheduled service, misfire, hard start, poor fuel economy, or plug-reading investigation.',tools:['Correct plug socket','Torque wrench','Gap gauge only where specified','Compressed air'],safety:'Keep debris out of the plug well and use the correct plug type. Do not force a plug into a damaged aluminum thread.',steps:['Confirm engine, plug application, heat range, reach, and any forced-induction or track requirement.','Clean around the plug before removal and remove one plug at a time if maintaining cylinder evidence.','Read deposits, wear, oil, fuel fouling, and insulator condition as clues—not as a single diagnosis.','Install the correct plug without cross-threading, use the manufacturer’s installation method, and restore coil or wire routing.','Start, scan or road-test as appropriate, and compare the original symptom and plug evidence.'],verify:'Every plug is correctly seated, the engine starts cleanly, and the old plugs are labeled by cylinder when diagnosis matters.',mistakes:'Changing heat range to hide a tune problem; using anti-seize without manufacturer approval; over-gapping a plug for boost.',...common},
  {id:'valve-clearance',book:'engine',system:'Valve train',title:'Check valve clearance and interpret the result',applies:['NA','NB','NC','ND'],tags:['valve clearance','lash','tappet','noise','maintenance'],difficulty:'Advanced',time:'2–6 hr',symptoms:'Valve noise, hard starting, compression variation, scheduled inspection, or camshaft work.',tools:['Feeler gauges or engine-specific measurement tools','Crank-turning tool','Service record','Torque wrench'],safety:'Use the exact cold or warm condition, cylinder position, and adjustment method for the engine. Do not rotate a cam or crank with interference risk ignored.',steps:['Confirm the engine’s valve-train design and the specified inspection condition.','Record each measurement by cylinder and valve before changing anything.','Compare to the exact engine limits and look for patterns rather than adjusting blindly.','If adjustment is supported, calculate the correction, install the correct component, and remeasure.','Investigate abnormal clearance with compression, leak-down, cam wear, lubrication, or timing evidence as appropriate.'],verify:'The record shows original and final measurements, the correct adjustment method, and a follow-up start or compression check where needed.',mistakes:'Using a generic clearance; measuring on the wrong cam position; treating one outlier as proof of a bent valve without further evidence.',...common},
  {id:'oil-pressure-test',book:'engine',system:'Lubrication',title:'Test low oil pressure before replacing parts',applies:['NA','NB','NC','ND'],tags:['oil pressure','warning light','lubrication','diagnosis'],difficulty:'Advanced',time:'1–3 hr',symptoms:'Oil warning lamp, hot-idle pressure concern, ticking, knocking, or a new leak after service.',tools:['Verified mechanical pressure gauge','Correct adapter','Oil-temperature measurement','Scan data where supported'],safety:'Stop operating the engine if oil pressure is genuinely low or a mechanical noise indicates damage. Keep the gauge and fittings away from belts and exhaust heat.',steps:['Confirm oil level, viscosity, filter, temperature, warning-light behavior, and the sensor circuit.','Test with a verified gauge at the engine using the exact adapter and conditions.','Compare cold, warm idle, and specified-speed behavior to the correct engine information.','If low, inspect pickup, filter, relief valve, pump, bearing clearance, leaks, and oil condition in a logical order.','Repair the proven cause and retest before returning the vehicle to load.'],verify:'The mechanical measurement explains the warning or rules out low pressure without guessing from lamp behavior alone.',mistakes:'Replacing the sender before measuring pressure; using the wrong oil viscosity as a universal cure; continuing to drive after a real low-pressure finding.',...common},
  {id:'fuel-pressure-test',book:'fuel',system:'Fuel delivery',title:'Test fuel pressure, volume, and hold behavior',applies:['NA','NB','NC','ND'],tags:['fuel pressure','pump','injector','no-start','lean'],difficulty:'Advanced',time:'1–3 hr',symptoms:'Crank/no-start, lean operation, stumble under load, hard hot start, fuel smell, or suspected pump fault.',tools:['Model-correct pressure test method','Fuel-safe gauge','Catch and containment equipment','Multimeter'],safety:'Fuel is flammable and pressurized. Work in ventilation, eliminate ignition sources, protect paint, and follow the vehicle-specific test connection and depressurization method.',steps:['Record the symptom, fuel quality, battery voltage, and whether the issue occurs hot, cold, idle, or load.','Measure pressure with the correct reference condition and compare prime, idle, load, and shutdown hold behavior.','Check pump power and ground under load before condemning the pump.','If pressure is high or low, separate regulator, return, filter, line restriction, pump, injector leak, and control faults.','Repair, clean spills, and verify pressure and driveability under the original complaint.'],verify:'Pressure and electrical evidence identify the failed portion of the fuel-delivery system before replacement.',mistakes:'Testing with an unsafe improvised fitting; replacing an injector for a pump fault; ignoring fuel contamination or low voltage.',...common},
  {id:'smoke-test-intake',book:'fuel',system:'Intake / vacuum',title:'Smoke-test an intake or vacuum leak without masking the fault',applies:['NA','NB','NC','ND'],tags:['smoke test','vacuum leak','intake','lean','idle'],difficulty:'Intermediate',time:'1–2 hr',symptoms:'Lean codes, high idle, hunting, poor cold start, brake-booster concern, or unexplained fuel trims.',tools:['Approved low-pressure smoke tester','Plugs and adapters','Scan tool where supported','Soapy-water method optional'],safety:'Use low pressure and keep smoke equipment away from fuel vapors, hot surfaces, and sensitive sensors unless the approved method protects them.',steps:['Record trims, idle speed, symptoms, and whether the leak appears cold or warm.','Seal or isolate the system using the engine-appropriate method and introduce low-pressure smoke.','Inspect hoses, manifold joints, throttle body, PCV, brake-booster circuit, evaporative connections, intercooler plumbing, and shaft seals.','Repair one leak at a time and confirm the fuel-trim or idle change after the repair.','Repeat the test if the first leak was large enough to hide smaller leaks.'],verify:'The leak path is visually located and the post-repair data moves toward normal under the same conditions.',mistakes:'Using shop air at damaging pressure; spraying flammable cleaner around a running engine; stopping after the first leak.',...common},
  {id:'water-pump-thermostat',book:'cooling',system:'Cooling service',title:'Replace a thermostat or water pump and prove circulation',applies:['NA','NB','NC','ND'],tags:['water pump','thermostat','coolant','overheating'],difficulty:'Advanced',time:'3–8 hr',symptoms:'Overheating, coolant leak, pump noise, thermostat fault, poor heater output, or scheduled timing-system access work.',tools:['Cooling drain and fill equipment','Pressure tester','Pulley or timing tools as applicable','Torque wrench'],safety:'Cool the engine fully, contain coolant, protect belts from contamination, and confirm whether pump access overlaps timing-belt or chain work.',steps:['Prove the suspected fault with leak, temperature, circulation, or pressure evidence before removing parts.','Drain and contain coolant, then document hose and fastener routing.','Replace the component with the exact engine and gasket or seal method; correct any contaminated belt or chain component.','Inspect mating surfaces, bleed paths, fan operation, and cap condition before refill.','Refill, bleed, pressure-test cold, heat-cycle, and retest the original complaint.'],verify:'The system reaches stable temperature, produces expected heater output, holds pressure, and remains leak-free after a heat cycle.',mistakes:'Installing a thermostat backward; using excess sealant; ignoring a contaminated timing belt; releasing coolant without a plan.',...common},
  {id:'hvac-heater-diagnosis',book:'cooling',system:'HVAC',title:'Diagnose heater airflow, temperature, and control complaints',applies:['NA','NB','NC','ND'],tags:['heater','HVAC','blower','airflow','defrost'],difficulty:'Intermediate',time:'1–4 hr',symptoms:'No heat, weak airflow, stuck mode door, fogging, blower speeds missing, or temperature that changes with RPM.',tools:['Thermometer','Multimeter','Fuses and wiring reference','Trim tools','Cooling-system test method'],safety:'Protect airbags and wiring when removing trim. Do not bypass a fuse or disturb refrigerant circuits without the correct equipment and qualification.',steps:['Separate coolant-temperature, airflow, blend-door, mode-door, blower, and electrical symptoms.','Confirm engine reaches normal temperature and heater hoses show the expected temperature relationship.','Test blower power, ground, resistor or controller, switch inputs, and airflow restrictions.','Inspect filters where fitted, ducts, drains, blend and mode control, and cable or actuator travel.','Verify defrost and demist function before returning the car to road use.'],verify:'The fault is attributed to heat supply, airflow, door control, blower control, or wiring and the defrost path works.',mistakes:'Changing the heater core before proving coolant flow; bypassing a blower resistor; ignoring a low engine operating temperature.',...common},
  {id:'transmission-fluid-service',book:'driveline',system:'Transmission',title:'Service manual transmission fluid and inspect the shift system',applies:['NA','NB','NC','ND'],tags:['transmission fluid','gear oil','shifter','shift quality'],difficulty:'Intermediate',time:'1–3 hr',symptoms:'Routine service, gear noise, difficult shifting, leaks, or unknown fluid history.',tools:['Correct fill method','Drain pan','Inspection light','Torque wrench','Fluid pump'],safety:'Support the car level and securely. Confirm fluid specification and filling order before opening a plug; do not rely on color alone.',steps:['Inspect case, plugs, shifter area, driveshaft, mounts, and PPF or braces for leaks or damage.','Open the fill point before the drain point when practical, then inspect fluid for metal, water, odor, and level clues.','Refill with the exact fluid and quantity method for the transmission, then clean and monitor the plugs and case.','Road-test all gears under the original complaint conditions and check for leaks after heat.'],verify:'Correct fluid is documented, shift quality and noise are recorded, and the case remains dry after a heat cycle.',mistakes:'Using differential oil in a synchronized gearbox; opening a drain before proving fill access; overfilling while the car is not level.',...common},
  {id:'differential-fluid-service',book:'driveline',system:'Differential',title:'Service differential fluid and investigate gear noise',applies:['NA','NB','NC','ND'],tags:['differential','gear oil','LSD','whine','service'],difficulty:'Intermediate',time:'1–3 hr',symptoms:'Routine service, whine, clunk, leak, limited-slip concern, or track-preparation service.',tools:['Correct fluid and additive guidance','Fluid pump','Drain pan','Torque wrench','Road-test notes'],safety:'Use the exact differential and limited-slip requirements. Support the car level and never confuse a gear-oil leak with an axle-seal or pinion-seal leak.',steps:['Record when the noise occurs: acceleration, deceleration, steady speed, cornering, or coast.','Inspect mounts, axle seals, pinion area, breather, cover, and driveshaft before draining.','Drain into a clean pan and inspect for water, glitter, chunks, or burnt odor.','Refill with the correct specification, clean the area, and repeat the exact road test.'],verify:'The fluid, leak source, and noise condition are documented, and the differential remains dry and quiet within the expected baseline.',mistakes:'Adding friction modifier without knowing the LSD requirement; blaming gears before checking bearings or tires; ignoring a blocked breather.',...common},
  {id:'hub-bearing-service',book:'driveline',system:'Hubs and bearings',title:'Diagnose wheel-bearing play and replace the correct hub assembly',applies:['NA','NB','NC','ND'],tags:['wheel bearing','hub','play','hum','ABS'],difficulty:'Advanced',time:'2–6 hr',symptoms:'Hum, growl, wheel play, uneven ABS signal, vibration, or a loose-feeling corner.',tools:['Lift and stands','Dial indicator where useful','Hub tools','Torque wrench','ABS inspection tools'],safety:'A loose hub is a safety-critical fault. Support the car correctly and do not treat a tire or suspension defect as a bearing diagnosis.',steps:['Road-test to determine whether noise follows speed, load, or cornering.','Inspect tire and wheel condition, then check play and roughness with the correct unloaded and loaded method.','Consider bearing, hub, knuckle, ball joint, tie rod, axle nut, and ABS sensor causes separately.','Replace the bearing or hub with the correct generation and press or torque method.','Verify sensor clearance, torque, wheel rotation, and post-repair road behavior.'],verify:'Play and noise are eliminated without an ABS or wheel-clearance fault, and final torque is documented.',mistakes:'Pressing on the wrong bearing race; reusing a torque-to-yield or damaged axle nut; blaming ABS for a mechanical hub fault.',...common},
  {id:'brake-pad-rotor-service',book:'chassis',system:'Brake service',title:'Replace pads and rotors while preserving caliper function',applies:['NA','NB','NC','ND'],tags:['brakes','pads','rotors','caliper','bed-in'],difficulty:'Intermediate',time:'2–5 hr',symptoms:'Worn friction material, vibration, noise, overheating, or a pad-and-rotor refresh.',tools:['Brake tools','Torque wrench','Micrometer','Brake cleaner','Bleed equipment'],safety:'Never contaminate friction surfaces. Support calipers without hanging them from hoses, and verify the pedal before moving the car.',steps:['Confirm brake-package fitment and measure pad, rotor, hose, caliper, and hardware condition.','Inspect piston and guide movement before installing new parts.','Install the matched pad and rotor package, clean friction surfaces, and restore hardware and torque.','Check fluid level and pedal travel, then perform a controlled low-speed test.','Bed in only according to the pad and rotor maker’s method, then inspect for abnormal heat or pull.'],verify:'Pedal is firm, wheel rotates freely, braking is straight, and bed-in evidence is recorded.',mistakes:'Replacing pads over a seized guide; machining below minimum thickness; contaminating a rotor; bedding with one hard stop.',...common},
  {id:'brake-fluid-bleed',book:'chassis',system:'Brake hydraulics',title:'Flush and bleed brake fluid without introducing air',applies:['NA','NB','NC','ND'],tags:['brake fluid','bleeding','pedal','ABS'],difficulty:'Intermediate',time:'1–3 hr',symptoms:'Soft pedal, old fluid, track preparation, hydraulic component replacement, or air in the system.',tools:['Correct fluid','Bleed equipment','Catch bottles','Wrench set','Pressure or vacuum tool as appropriate'],safety:'Use the correct fluid, protect paint, keep the reservoir from running dry, and follow ABS or DSC bleeding requirements for the generation.',steps:['Inspect hoses, calipers, master cylinder, reservoir, and leak points before bleeding.','Confirm the fluid specification and bleeding sequence for the exact system.','Flush until clean fluid appears without allowing air into the system.','If the pedal remains soft, separate trapped air, hose expansion, caliper movement, pad knockback, and master-cylinder bypass.','Perform a stationary pedal check and controlled road test before returning the car to service.'],verify:'Fluid is clean, the pedal is consistent, and no leak or ABS/DSC fault is present after the procedure.',mistakes:'Letting the reservoir empty; forcing a seized bleeder; using contaminated fluid; pumping the pedal past a damaged master-cylinder travel range.',...common},
  {id:'abs-dsc-warning',book:'diagnostics',system:'ABS / DSC',title:'Diagnose ABS, DSC, and traction-control warnings',applies:['NA','NB','NC','ND'],tags:['ABS','DSC','traction control','warning light','scan tool'],difficulty:'Advanced',time:'1–4 hr',symptoms:'ABS, DSC, traction, brake, or stability-control warning lamps; inconsistent intervention; or a dead speed signal.',tools:['Compatible scan tool','Multimeter','Wheel-speed inspection tools','Wiring reference','Brake inspection tools'],safety:'Do not road-test an unstable car in traffic. Do not bypass safety systems or clear codes before recording them.',steps:['Record every module code, freeze-frame, warning sequence, and whether the fault is key-on, moving, braking, or cornering related.','Inspect tire size, pressure, wheel bearings, tone rings, sensors, wiring, battery voltage, and brake-fluid level.','Compare live wheel-speed data and sensor power or signal behavior under the correct test conditions.','Separate a mechanical wheel or tire fault from sensor, wiring, module, hydraulic, or network faults.','Repair the proven cause, clear codes only after recording them, and verify the warning does not return in a controlled test.'],verify:'The system fault is identified at the correct module or mechanical source and the vehicle’s braking and stability behavior is confirmed.',mistakes:'Replacing a sensor without checking the hub or tone ring; ignoring low battery voltage; treating a stored code as a current failure.',...common},
  {id:'scan-code-workflow',book:'diagnostics',system:'Scan data',title:'Capture codes and live data before clearing anything',applies:['NA','NB','NC','ND'],tags:['scan tool','DTC','freeze frame','diagnosis'],difficulty:'Foundational',time:'30–90 min',symptoms:'Any warning light, intermittent fault, failed inspection, or repair that may erase evidence.',tools:['Compatible scan tool','Battery support','Notebook or camera','VIN and fitment record'],safety:'Use the scan tool’s correct vehicle profile. Do not reprogram modules or clear safety-system codes without the exact procedure.',steps:['Record VIN, mileage, warning lamps, customer symptom, recent work, battery state, and environmental conditions.','Read all available modules and save codes, status, freeze-frame, monitor state, and live data snapshots.','Separate a code’s monitored circuit from the failed component; test power, ground, signal, plausibility, and mechanical cause.','Only clear codes after the evidence is saved and the repair is complete.','Repeat the drive cycle or self-test required to verify the repair.'],verify:'A repair record contains the original evidence, the test path, the correction, and the post-repair result.',mistakes:'Clearing codes before saving them; replacing the named sensor automatically; ignoring module communication and low-voltage codes.',...common},
  {id:'aftermarket-wiring',book:'electrical',system:'Accessory wiring',title:'Install aftermarket power and signal wiring without creating a new fault',applies:['NA','NB','NC','ND'],tags:['wiring','accessories','relay','fuse','ground','mods'],difficulty:'Intermediate',time:'1–4 hr',symptoms:'Adding lights, gauges, pumps, fans, audio, ECU equipment, or a forced-induction accessory.',tools:['Wire tools','Crimper','Heat-shrink','Fuse and relay selection','Multimeter','Harness loom'],safety:'Every added power branch needs appropriate overcurrent protection close to the source. Protect heat, movement, water, SRS, CAN, fuel, and high-current paths.',steps:['Define load current, duty cycle, source, control method, fuse location, ground path, heat exposure, and service access.','Use a relay when the switch or module should not carry the load; size wire and fuse to the load and routing.','Make grounds clean and mechanically secure without sharing sensitive sensor grounds casually.','Protect the harness with loom, grommets, strain relief, labels, and a reversible connector strategy.','Load-test the circuit, inspect voltage drop and heat, then verify factory systems and sleep current.'],verify:'The accessory works at the intended load without excess voltage drop, heat, fuse failure, warning lights, network faults, or parasitic draw.',mistakes:'Using an add-a-fuse with no load analysis; grounding sensors to a noisy high-current point; twisting wires together; routing near exhaust or moving parts.',...common},
  {id:'prepurchase-inspection',book:'fitment',system:'Vehicle buying',title:'Perform a Miata pre-purchase inspection that separates urgent risk from deferred work',applies:['NA','NB','NC','ND'],tags:['pre-purchase','inspection','rust','used car','buying'],difficulty:'Intermediate',time:'2–4 hr',symptoms:'Evaluating a used Miata, project car, modified car, or incomplete service history.',tools:['Flashlight','Mirror','Tire gauge','Paint meter optional','Scan tool where supported','Inspection sheet'],safety:'Do not crawl under an unsupported vehicle or road-test a car with unsafe tires, brakes, steering, fuel leaks, or structural corrosion.',steps:['Verify VIN, title, market, generation, engine, transmission, trim, modifications, and service records.','Inspect structure, rails, rockers, floors, suspension pickups, brake lines, fuel lines, drains, top, seals, and collision evidence.','Cold-start and road-test the vehicle while recording temperature, warning lamps, smoke, noises, clutch, gearbox, brakes, steering, and vibration.','Scan supported modules and photograph evidence before changing anything.','Classify findings as stop-driving, immediate service, planned repair, monitor, or cosmetic.'],verify:'The report explains condition, risk, likely cost bands, evidence gaps, and whether the car matches the intended use.',mistakes:'Focusing on paint before structural rust; accepting a warm engine as proof of health; ignoring modified wiring; treating a seller’s parts list as service evidence.',...common},
  {id:'storage-winterization',book:'maintenance',system:'Storage',title:'Prepare a Miata for seasonal or long-term storage',applies:['NA','NB','NC','ND'],tags:['storage','winterization','battery','fluids','tires'],difficulty:'Foundational',time:'1–3 hr',symptoms:'Winter storage, long travel, project pause, or preserving a car that will not be driven.',tools:['Battery maintainer','Tire gauge','Cover or breathable storage materials','Fuel and fluid plan','Desiccant where appropriate'],safety:'Do not store a fuel-leaking, coolant-leaking, rodent-damaged, or structurally unsafe car. Use a safe battery-maintainer installation.',steps:['Service urgent leaks, tires, brakes, cooling, and battery issues before storage.','Choose fuel strategy, oil service timing, tire-pressure plan, moisture control, and battery isolation for the storage length.','Clean and dry the interior, clear drains, protect the top, and avoid trapping moisture under a non-breathable cover.','Record mileage, fluids, tire pressure, battery state, and any open repair.','On return to service, inspect rodents, leaks, brakes, tires, battery, fluids, and warning lamps before driving normally.'],verify:'The storage record contains preparation and return-to-service checklists rather than only a cover and a disconnected battery.',mistakes:'Storing a dirty wet car; parking on low tires; leaving the parking brake seized; starting briefly without reaching full temperature.',...common},
  {id:'post-mod-validation',book:'builds',system:'Modification validation',title:'Validate a modification before calling the build finished',applies:['NA','NB','NC','ND'],tags:['mods','validation','build log','road test','track prep'],difficulty:'Advanced',time:'1–3 sessions',symptoms:'Any new power, fuel, suspension, brake, wheel, tire, safety, or electrical modification.',tools:['Build log','Torque record','Scan tool where supported','Tire gauge','Inspection tools','Data notes'],safety:'Use a staged low-risk test. Do not validate an unknown power or safety modification at the limit or in traffic.',steps:['Record part numbers, fitment, installed torque evidence, fluids, wiring changes, settings, and baseline symptoms.','Inspect clearance, heat, leaks, connectors, fastener witness marks, tire rub, brake-line routing, and safety-system compatibility.','Perform a gentle stationary test, then a low-load road test, then a controlled load test appropriate to the modification.','Capture temperatures, pressures, codes, noises, handling changes, and driver observations.','If the result is not understood, return to the last known-good configuration instead of stacking another change.'],verify:'The modification has a documented baseline, staged validation result, and a clear return-to-known-good plan.',mistakes:'Testing several mods at once; skipping post-install torque checks; assuming no warning light means no fault; chasing dyno numbers before heat and reliability.',...common},

{"id":"radiator-remove-install","book":"cooling","system":"Cooling","title":"Remove, inspect, and replace the radiator","applies":["NA","NB","NC","ND"],"tags":["radiator","cooling","replacement"],"difficulty":"Intermediate","time":"3–6 hr","symptoms":"Aged radiator, cracked tank, blocked core, repeated coolant loss, or poor temperature control.","tools":["Drain pan","Cooling-system pressure tester","Hose-pinch tools","Correct coolant and clamps"],"safety":"Never open a hot system. Capture and dispose of coolant responsibly; keep pets away from antifreeze.","steps":["Record the symptom and inspect the radiator, cap, tanks, fins, mounts, hoses, and fan clearance before removal.","Drain the cool system and label hoses, connectors, shrouds, and brackets.","Remove the radiator without levering against brittle tanks or condenser fins.","Compare replacement dimensions, necks, mounts, drain, and fan/shroud interfaces before installation.","Refill and bleed using the generation-specific method, then pressure-test and road-test."],"verify":"No leaks, correct fan operation, stable temperature, and a dry system after heat cycles.","mistakes":"Installing a radiator without checking the cap, hose condition, fan control, or trapped-air risk.","sources":["Mazda owner/service information for the exact VIN, engine, transmission, market, and model year","Verify current torque values, clearances, fluid specifications, and calibration procedures against authorized service information"],"related":[]},

{"id":"ac-leak-diagnosis","book":"cooling","system":"A/C","title":"Diagnose A/C leaks and cooling performance","applies":["NA","NB","NC","ND"],"tags":["air conditioning","refrigerant","leak","compressor"],"difficulty":"Advanced","time":"2–6 hr diagnosis","symptoms":"Weak cooling, cycling, oily residue, pressure loss, or compressor concern.","tools":["Approved manifold or service equipment","Electronic leak detector or approved dye method","Thermometer","Scan data where supported"],"safety":"Refrigerant recovery and charging require approved equipment and legal handling. Do not vent refrigerant.","steps":["Confirm ambient conditions and blower performance first.","Inspect fittings, condenser, compressor, hoses, evaporator drain, and service ports for evidence.","Use approved recovery, vacuum, and leak-test procedures rather than guessing from pressure alone.","Separate a leak from airflow, blend-door, compressor-clutch, sensor, or control faults.","Document the refrigerant and oil specification for the exact system."],"verify":"The source of loss or control failure is identified and the system passes leak and performance checks after authorized service.","mistakes":"Adding refrigerant repeatedly without finding the leak.","sources":["Mazda owner/service information for the exact VIN, engine, transmission, market, and model year","Verify current torque values, clearances, fluid specifications, and calibration procedures against authorized service information"],"related":[]},

{"id":"clutch-master-slave","book":"driveline","system":"Clutch hydraulics","title":"Replace and set up the clutch master or slave cylinder","applies":["NA","NB","NC","ND"],"tags":["clutch","master cylinder","slave cylinder","hydraulic"],"difficulty":"Intermediate","time":"2–5 hr","symptoms":"Fluid loss, sinking pedal, difficult bleeding, clutch drag, or inconsistent engagement.","tools":["Line wrench set","Bleed equipment","Correct fluid","Torque wrench"],"safety":"Keep hydraulic fluid off paint. Do not drive if the clutch cannot reliably disengage.","steps":["Identify the leaking or bypassing cylinder and inspect the line, firewall, pedal, and slave pushrod.","Replace the correct cylinder without stressing the hard line or cross-threading fittings.","Bench-prime or prefill only when appropriate for the component and generation.","Bleed using a controlled sequence and maintain reservoir level.","Set or verify pedal free play and confirm release at cold and hot conditions."],"verify":"No leaks, consistent pedal, complete clutch release, and normal engagement without creep or forced shifts.","mistakes":"Bleeding until the pedal feels better without finding the leak or bypass path.","sources":["Mazda owner/service information for the exact VIN, engine, transmission, market, and model year","Verify current torque values, clearances, fluid specifications, and calibration procedures against authorized service information"],"related":[]},

function productMatch(p){const text=[p.id,p.title,p.system,p.symptoms,p.tags].flat().join(' ').toLowerCase();let keys=[];
  if(/oil|lubric|filter/.test(text))keys.push('oil','oilfluid','fluidsafe');
  if(/cool|overheat|water pump|thermostat|heater|hvac|a\/c/.test(text))keys.push('coolant','thermostat','hose','radiator');
  if(/timing|belt|chain/.test(text))keys.push('timing','belt','seal','fastener');
  if(/spark|ignition|no start|crank|rough|fuel|injector|intake|vacuum|compression|engine/.test(text))keys.push('plug','coil','fuel','sensor','compression','leakdown','smoke');
  if(/charge|battery|electrical|lighting|wire|parasitic|scan|abs|dsc/.test(text))keys.push('battery','alternator','wire','scan','sensor');
  if(/brake|abs|track/.test(text))keys.push('brakefluid','brakepad','rotor','hosebrake');
  if(/clutch|transmission|differential|driveline|gear/.test(text))keys.push('clutch','gearfluid','diff','seal');
  if(/wheel|tire|hub|bearing|alignment|suspension|steering|noise|vibration/.test(text))keys.push('bearing','alignment','bushing','damper');
  if(/top|water leak|convertible/.test(text))keys.push('top','seal');
  if(/rust|body|chassis/.test(text))keys.push('rust','seal','fastener');
  if(/track|performance/.test(text))keys.push('track','alignment','damper');
  if(!keys.length)keys=['oem','fluidsafe','fastener'];
  const unique=[...new Set(keys)].map(k=>repairProducts.find(x=>x.k===k)).filter(Boolean);
  return unique.slice(0,5).map(x=>({kind:x.kind,name:x.name,price:x.price,url:x.url,why:x.why}));
}

function createGarageStore(key, defaultsFactory){
  return {
    load(){
      try{
        const raw=JSON.parse(localStorage.getItem(key)||'null');
        return raw ? {...defaultsFactory(),...raw,profile:{...defaultsFactory().profile,...(raw.profile||{})}} : defaultsFactory();
      }catch{return defaultsFactory()}
    },
    save(value){
      try{localStorage.setItem(key,JSON.stringify(value));return {ok:true,status:'local'}}
      catch{return {ok:false,status:'offline'}}
    },
    clear(){try{localStorage.removeItem(key)}catch{}}
  };
}

        "title": "NA Miata electrical: starting, charging, grounds, lighting, and fuse strategy",
        "markdown": "# NA Miata electrical: starting, charging, grounds, lighting, and fuse strategy\n\n**Scope.** Original-generation MX-5/Miata NA, broadly 1990–1997. This is an original diagnostic outline, not a reproduction of Mazda diagrams, tables, connector pinouts, or factory wording. The public 1997 wiring reference separates charging, automatic- and manual-transmission starting, ground distribution, power distribution, exterior lamps, and headlamps into different circuit views [1]. Treat it as a navigation aid only; confirm the car’s own fuse/relay labels and wiring for its model year, market, transmission, engine, ABS/DRL equipment, and modifications.\n\n## Diagnostic procedures\n\n### 1. Establish the symptom and baseline power state\n\n**Use for:** no crank, click/no crank, slow crank, dimming lights, battery warning, or repeated flat battery.\n\n**Safety:** Park/neutral, parking brake set, ignition off for inspection, and keep hands/leads away from belts and fans. When cranking for a test, disable fuel/ignition if needed so the engine cannot start; Fluke explicitly recommends this approach for starter voltage-drop work [3].\n\n**Tools:** DMM, eye protection, battery terminal brush, known-good charger or load tester, serviceable jumper leads.\n\n**Steps:**\n1. Record whether the starter is silent, clicks, cranks slowly, or cranks at normal speed but the engine does not fire. Do not call a crank-no-start a starter fault.\n2. Inspect battery posts, clamps, the main positive cable, engine/body ground straps, alternator belt, starter connections, and the under-hood high-current fuse/fusible-link area for looseness, heat damage, or corrosion.\n3. Measure directly at the battery posts, not on a convenient accessory feed. Check resting voltage after the battery has been allowed to stabilize, then perform a proper battery load/conductance test if the resting result or symptom is suspect.\n4. If voltage collapses under cranking or the battery fails its test, repair/charge or replace the battery before condemning the starter. If battery voltage is credible, continue with voltage-drop tests.\n\n**Tests:** Compare battery-post voltage with the same reading at the cable clamps; a meaningful difference indicates a connection problem. A battery test is required before interpreting starter or alternator results.\n\n**Verify:** The car now has a known-good, charged battery and clean, tight primary connections, with the original symptom reproduced under controlled conditions.\n\n**Mistakes:** Replacing a starter or alternator because an old battery reads near 12 V at rest; measuring on painted/corroded surfaces; confusing “cranks normally but will not start” with “does not crank.”\n\n### 2. Isolate a no-crank or slow-crank fault with voltage drop\n\n**Use for:** slow cranking, a single click, intermittent no-crank, hot-start trouble, or a starter that tests good off the car.\n\n**Safety:** Transmission in neutral/park, parking brake on, wheels secured. Disable fuel/ignition before repeated cranking. Keep the probes from bridging adjacent terminals.\n\n**Tools:** DMM with min/max or a helper, back-probe leads, wiring diagram for the exact year/market.\n\n**Steps:**\n1. For the positive side, place the meter across the battery positive post and the starter motor’s main battery stud; crank for a few seconds and capture the peak drop. Fluke describes this placement and interprets excessive drop as cable/connection resistance [3].\n2. For the ground side, place one lead on the battery negative post and the other on clean starter housing/engine-block metal; crank again.\n3. If either side is high, move the probes in smaller sections: post-to-clamp, clamp-to-cable, cable-to-starter stud, battery negative-to-body, and engine/starter housing-to-battery negative. The section that accounts for the drop contains the likely fault.\n4. Clean and tighten the identified connection or replace a damaged cable/strap, then repeat the same test. Do not use a temporary jumper as the final repair.\n\n**Tests:** Fluke gives a practical total starter-circuit guideline of about 0.2–0.5 V, with roughly 0.3 V positive-side and 0.2 V or less ground-side examples; use the exact vehicle service specification when available [3].\n\n**Verify:** Cranking speed is consistent hot and cold, the key-start signal reaches the starter control path, and both side drops remain within the chosen specification during a repeat crank.\n\n**Mistakes:** Ohming a cable with no load and declaring it good; probing the battery clamp instead of the post; assuming a visual ground inspection proves a low-resistance ground.\n\n### 3. Confirm charging output and alternator-circuit integrity\n\n**Use for:** charge warning lamp, low battery after driving, dimming with loads, overcharging, or alternator replacement decisions.\n\n**Safety:** Keep clothing and probes clear of the rotating belt/pulleys. Do not disconnect the battery with the engine running. Stop if the belt is damaged, slipping, or contaminated.\n\n**Tools:** DMM, belt-tension/inspection tools, clamp meter if available, exact-year wiring reference.\n\n**Steps:**\n1. Inspect belt condition, alignment, and tension before electrical conclusions. DENSO lists belt condition/tension, battery connections, fuses/fusible links, and wiring among the first checks [2].\n2. With the engine running, measure at the alternator output and at the battery. DENSO’s general passenger-vehicle check uses about 2,000 rpm and expects approximately 13–15 V, then repeats with headlights, blower, and defroster loads; the car-specific specification takes precedence [2].\n3. Measure positive-side charging drop from alternator output stud to battery positive post, and negative-side drop from alternator case/ground strap to battery negative post. DENSO gives 0.2 V or less on each side as its general target [2].\n4. If alternator output is present but battery voltage is low, trace the cable, fusible link/high-current fuse, grounds, and sense/indicator wiring before replacing the alternator. If output is high, investigate regulation and sense connections; protect the battery and electronics from continued overvoltage.\n\n**Tests:** Compare no-load and loaded voltage, alternator-to-battery drop, belt condition, and battery condition. A good alternator cannot overcome a high-resistance cable.\n\n**Verify:** Charging remains in the vehicle-specific range at idle and approximately 2,000 rpm, with normal loads applied, and the charge warning behavior is normal after a restart.\n\n**Mistakes:** Testing only at the alternator; ignoring belt slip; accepting a brief no-load voltage as proof of charging health; installing a new alternator before checking the high-current path.\n\n### 4. Trace lighting and accessory failures by branch, ground, and load\n\n**Use for:** one lamp out, one side dim, headlights/turn/brake lights interacting, intermittent lamps, or radio/blower changes when lights are switched.\n\n**Safety:** Switch the lighting circuit off before opening connectors or removing fuses. Use fused test equipment; do not probe airbag/SRS wiring or short a lighting socket.\n\n**Tools:** DMM/test light, back-probes, wiring reference for exact year/market, terminal-cleaning tools, correct replacement bulbs and fuses.\n\n**Steps:**\n1. Classify the failure: one bulb, one side, an entire function, or several loads changing together. Several loads changing together favors a shared feed, ground, switch/relay, or distribution issue over multiple bulbs.\n2. Verify the bulb, socket contact, connector condition, and ground under load. Measure voltage at the socket while the lamp is commanded on, then measure voltage drop on the ground side from socket ground to battery negative/body ground.\n3. Work upstream in order: socket → branch connector → switch/relay output → fuse output → fuse input → main feed. Probe both sides of a fuse with the circuit energized; a fuse can look intact while its holder or upstream feed is corroded.\n4. For a blown fuse, find the short/overload before replacement. Fit only the same type and rating shown for that vehicle; never bridge a fuse or substitute a higher rating.\n\n**Tests:** Compare left/right lamp voltage and ground drop under the same load. DENSO’s general method likewise emphasizes checking every component, connections, wires, and voltage drop rather than jumping straight to a part [2].\n\n**Verify:** The affected lamp/function operates at normal brightness, related loads no longer interact, and the fuse survives repeated operation with the original load.\n\n**Mistakes:** Replacing bulbs repeatedly; testing continuity with the circuit off but never testing loaded voltage; adding a larger fuse; assuming a modern LED conversion follows the stock load behavior.\n\n### 5. Check the NA fuse/distribution strategy without trusting a generic map\n\n**Use for:** multiple dead accessories, intermittent electrical resets, recurring fuse failures, or corrosion around the engine-bay distribution area.\n\n**Safety:** Disconnect the negative battery cable before removing high-current links or cleaning exposed high-current hardware. The main feed can remain live until the battery is disconnected; avoid tools bridging the feed to body metal.\n\n**Tools:** Exact-year owner/service wiring reference, DMM, test light, terminal tools, contact cleaner, replacement fuses/fusible links of the specified type and rating.\n\n**Steps:**\n1. Use the vehicle’s fuse-box cover/manual and VIN/year/market match first. The public 1997 reference shows that power distribution, ground distribution, starting/charging, exterior lamps, and headlamps are separate circuit groups [1]; it is not a universal NA fuse chart.\n2. Inspect the fuse/relay box, high-current links, mounting hardware, and nearby connectors for oxidized contact surfaces, heat discoloration, water entry, or loose fasteners.\n3. With the battery reconnected, test for power at fuse input and output under the relevant key/switch state. A missing input points upstream; input present but no output with a good fuse points to the fuse/holder; output present but load dead points downstream.\n4. After repair, load the circuit and recheck voltage drop and heat. Document any non-factory alarm, audio amplifier, lighting, or engine-swap wiring before declaring the stock circuit faulty.\n\n**Tests:** Fuse continuity is only a first screen. Loaded voltage on both sides and voltage drop across the holder/connection are more diagnostic.\n\n**Verify:** All related branches operate, no fuse or high-current connection heats abnormally, and the repair remains stable after vibration and a repeat load test.\n\n**Mistakes:** Using an internet fuse map from another year; cleaning only the visible blade while ignoring the holder/feed; replacing a fusible link with ordinary wire; overlooking aftermarket wiring.\n\n## Simplified wiring notes\n\n### Starting path (conceptual)\n\n**Diagram:** `Battery + → main protection/distribution → ignition/start switch → transmission safety path (if equipped) → starter solenoid/control → starter motor → engine/transmission case → engine/body ground strap → battery −`\n\n**Explanation:** A no-crank diagnosis follows control permission and high-current delivery separately. Manual- and automatic-transmission starting circuits are shown as distinct in the public 1997 reference [1]. Use voltage drop while the starter is loaded to find resistance; do not infer cable health from an unloaded resistance check.\n\n**Limits:** Exact relay placement, switch logic, connector names, and market equipment vary. This is intentionally not a pinout or factory diagram.\n\n### Charging path (conceptual)\n\n**Diagram:** `Alternator output → high-current cable/protection → battery + / distribution`; `alternator case → engine ground → battery −`; `ignition/indicator and sense wiring → regulator/control path`\n\n**Explanation:** Charging is a loop, not just an alternator test. Belt condition, battery connections, the positive cable/protection path, and the ground path all affect battery voltage. DENSO recommends positive- and negative-side charging voltage-drop checks at roughly 0.2 V or less each, plus loaded output testing [2].\n\n**Limits:** Output targets and regulator/sense details are general guidance, not a universal NA specification. Confirm 1.6 vs 1.8, year, market, and replacement-alternator configuration.\n\n### Lighting and fuse branching (conceptual)\n\n**Diagram:** `Battery/distribution → fuse or fusible link → switch/relay → branch fuse/feed → lamp/socket → body ground`\n\n**Explanation:** The 1997 public wiring index separates exterior lamps, headlamps, power distribution, and ground distribution [1]. A shared symptom across radio, blower, and lights makes the common feed/ground/distribution path more likely than several independent bulbs. Test at the load with the circuit energized, then move upstream.\n\n**Limits:** DRL-equipped and non-DRL markets differ in lamp control; bulb wattage, added relays, LED conversions, alarms, and audio wiring can change loads and failure modes. Do not apply a generic fuse number or color without the car-specific source.\n\n## Model-year and evidence caveats\n\nThe NA spans 1990–1997 and includes 1.6 L and later 1.8 L cars, manual and automatic transmissions, and market/equipment differences. The accessible public wiring reference is specifically labeled 1997 and includes separate DRL/non-DRL lamp views [1], so it supports system relationships but not every earlier NA fuse or connector detail. The Manualslib-hosted Miata service information is a secondary reproduction; it emphasizes checking battery connections, fuses, and electrical connections before deeper starting/engine diagnosis [4]. The Miata Forum discussion is enthusiast evidence only: it reports real-world intermittent voltage/ground and high-current fuse-box corrosion observations, but its anecdotal measurements and advice are not factory specifications [5].\n\n## References\n\n[1]: https://www.mellens.net/mazda/Mazda-Miata-1997/wiring.pdf \"1997 Mazda MX-5 Miata System Wiring Diagrams\"\n[2]: https://www.densoautoparts.com/reference-charging-system-troubleshooting/ \"DENSO Charging System Troubleshooting\"\n[3]: https://www.fluke.com/en-us/learn/blog/digital-multimeters/how-to-check-starter-circuit-voltage-drop-with-a-multimeter \"Fluke: How to Check Starter Circuit Voltage Drop with a Multimeter\"\n[4]: https://www.manualslib.com/manual/1001464/Mazda-Miata.html \"Mazda Miata Service Manual reproduction\"\n[5]: https://forum.miata.net/vb/showthread.php?t=472045 \"MX-5 Miata Forum: Ground Problem or Voltage Supply Problem?\"\n",
        "references": "## References\n\n[1]: https://www.mellens.net/mazda/Mazda-Miata-1997/wiring.pdf \"1997 Mazda MX-5 Miata System Wiring Diagrams\"\n[2]: https://www.densoautoparts.com/reference-charging-system-troubleshooting/ \"DENSO Charging System Troubleshooting\"\n[3]: https://www.fluke.com/en-us/learn/blog/digital-multimeters/how-to-check-starter-circuit-voltage-drop-with-a-multimeter \"Fluke: How to Check Starter Circuit Voltage Drop with a Multimeter\"\n[4]: https://www.manualslib.com/manual/1001464/Mazda-Miata.html \"Mazda Miata Service Manual reproduction\"\n[5]: https://forum.miata.net/vb/showthread.php?t=472045 \"MX-5 Miata Forum: Ground Problem or Voltage Supply Problem?\""

      {
        "file": "docs/research/na-nb/03-na-engine.md",
        "title": "NA engine mechanical, fuel, ignition, emissions, and no-start diagnosis",
        "markdown": "# NA engine mechanical, fuel, ignition, emissions, and no-start diagnosis\n\nThis note covers first-generation MX-5/Miata (NA, roughly 1989–1997) diagnosis without reproducing factory manual language, diagrams, or proprietary connector pinouts. The safest order is to prove the failure mode before replacing parts: battery/cranking, ECU power and codes, mechanical timing, spark, fuel delivery/injection, then emissions-control faults. A “new coil,” “pump noise,” or wet plug is not proof that the complete subsystem works.\n\n## Model-year and market caveats\n\n- NA cars use more than one engine/control configuration. Early cars are commonly 1.6 L B6; later cars commonly 1.8 L BP. Harness routing, sensors, relay logic, emissions equipment, and test values vary by year, market, transmission, and California/non-California specification. Use the VIN/year-specific service information for any numerical limit or connector identification.\n- The public Miata fault-code reference describes two-digit self-diagnosis for 1990–1993 and a different 1994–1995 code set; it also says 1996-on cars use OBD and need a scanner. Treat that as a strong model-year guide, not a substitute for confirming the car’s market and ECU. [1]\n- The public 1991 wiring reference is useful for circuit relationships, but it is explicitly a 1991 diagram. Do not transfer its wire colors, terminal numbers, or relay details to every NA. [2]\n- Mazda’s owner information is newer than NA, but its general safety point remains relevant: ignition, fuel, and emissions systems are interdependent and should not be tampered with; inspect fuel lines/hoses, battery, air filter, evaporative equipment, and exhaust as applicable to the actual car. [3]\n\n## Procedure 1 — Establish the symptom and make the car safe\n\n**Symptom:** “Won’t start” is ambiguous: no crank, slow crank, crank/no-fire, starts then stalls, or runs badly. Separate it before testing.\n\n**Safety:** Work outdoors or with strong ventilation. Keep sparks, cigarettes, and hot lamps away from fuel vapour. Disable ignition/fuel as appropriate before extended cranking. Support the hood and keep hands, clothing, and test leads clear of belts and fans.\n\n**Tools:** Charged battery or approved jump pack, multimeter, insulated hand tools, eye protection, scan/code-reading equipment appropriate to year.\n\n**Steps:** Confirm fuel level and battery condition; observe whether the starter turns the engine at a normal, even speed. Note whether the check-engine lamp illuminates with key ON. Inspect for loose grounds, disconnected intake hoses, damaged wiring, blown fuses, rodent damage, and obvious timing-belt debris. Do not use repeated starting-fluid tests as a repair strategy.\n\n**Tests:** If there is no crank, test battery voltage under load, starter control, and starter current path before investigating fuel or spark. If it cranks, stop treating the starter circuit as the primary fault and proceed to the engine-control checks.\n\n**Verify:** The symptom is recorded as one precise state, with key-ON lamp behavior and any recent work or event documented.\n\n**Mistakes:** Replacing plugs, wires, coil, pump, or ECU because the engine “sounds like” a fuel or ignition fault; continuing to crank with a flooded cylinder or a weak battery.\n\n## Procedure 2 — Check ECU power, diagnostic status, and mechanical timing\n\n**Symptom:** Cranks but does not fire, or the check-engine lamp is absent when it should be on.\n\n**Safety:** Disconnect battery power before disturbing fuses or major connectors; reconnect only when the work area is safe. Never bridge random diagnostic terminals. A paper clip method is only for the specific diagnostic procedure and terminal labels verified for that car.\n\n**Tools:** Year-appropriate code reader or a verified NA self-diagnosis procedure, multimeter, timing-light or inspection tools, helper.\n\n**Steps:** Record codes before clearing them. For early NA self-diagnosis, the published procedure uses the under-hood diagnostic connector and the car’s GND/TEN positions; later configurations require the applicable procedure or scanner. [1] If the check-engine lamp does not illuminate at key ON, check the relevant fuses, main relay/ECU supply, grounds, lamp circuit, and ignition-switch feed rather than assuming the ECU has failed. Remove the oil filler cap and observe cam movement while cranking; absent cam motion strongly indicates a broken timing belt or valvetrain drive fault. If the cam turns, verify crank/cam timing marks before pursuing sensors.\n\n**Tests:** Confirm battery voltage remains adequate during cranking. Confirm ECU power and grounds with a voltage-drop test under load. Retrieve and document codes; a no-code result does not prove the system is healthy. A moving cam does not prove correct valve timing.\n\n**Verify:** There is a documented power/ground result, code result, and mechanical-timing result before parts are replaced.\n\n**Mistakes:** Treating an old stored code as the current cause; using a 1991 wiring diagram or 1990–1993 blink-code procedure on a different year/market without verification; assuming a spinning cam means the belt has not jumped.\n\n## Procedure 3 — Prove ignition output and engine-position signaling\n\n**Symptom:** Crank/no-fire with dry plugs, no visible spark, intermittent spark, or a sudden stall.\n\n**Safety:** Use an approved adjustable spark tester or an insulated test method; do not hold a plug wire by hand. Keep the tester away from fuel vapour. Do not repeatedly crank with disconnected high-tension leads.\n\n**Tools:** Spark tester, multimeter, service data for the exact coil/igniter/CAS configuration, timing light if the engine can run.\n\n**Steps:** Test for spark at more than one cylinder, not just by fitting a new plug. If all cylinders lack spark, work upstream: ignition-switch/relay/fuse power, coil feed, igniter control, engine-position/CAS signal, ECU grounds, and the ECU’s ignition command. If one cylinder differs, inspect that lead, plug, coil tower, and mechanical condition. If spark is present but badly timed, return to belt alignment and position-signal checks. Use resistance checks only as a screen; a component can pass an ohms test and fail under heat or load.\n\n**Tests:** Compare coil supply voltage during crank with battery voltage; perform voltage-drop checks on grounds; observe spark strength and consistency during repeated cranking. Do not infer spark from a new coil or wires. The 1991 public wiring reference shows the ECU, igniter, coil, crank-angle signal, injectors, airflow meter, and circuit-opening relay as connected parts of one control system, which is why a single “bad ignition part” assumption is unsafe. [2]\n\n**Verify:** A repeatable spark result is recorded for each tested cylinder, and timing is verified if spark exists.\n\n**Mistakes:** Testing only one plug; confusing an ignition-power fault with an ECU-command fault; declaring a CAS or igniter bad before checking power, ground, connectors, and timing.\n\n## Procedure 4 — Prove fuel-pump power, pressure, and injector operation\n\n**Symptom:** Cranks with strong spark but does not run; plugs remain dry; starts briefly only with enrichment.\n\n**Safety:** Relieve fuel pressure using the exact vehicle procedure. Use a rated fuel-pressure gauge and catch fuel safely. Do not clamp old or brittle hoses aggressively. Wipe spills and wait for vapour to clear before sparking or cranking.\n\n**Tools:** Fuel-pressure gauge and adapters, multimeter, noid light or injector test equipment, mechanic’s stethoscope, fused jumper only where the verified diagnostic procedure calls for it.\n\n**Steps:** Listen for the pump only as an initial clue. Prove power at the pump with the correct diagnostic test and verify the circuit-opening relay, fuse, grounds, and harness. The enthusiast no-start guide describes an FP-to-ground diagnostic test for applicable NA layouts; verify terminal labels and year before using it. [4] Measure pressure while cranking/running against the exact engine’s service specification. Check injector electrical feed and listen for consistent injector operation; a wet plug proves fuel reached that cylinder but not that pressure, pulse width, or spray quality is correct.\n\n**Tests:** If pump power is present but pressure is low, distinguish pump/filter/line restriction from regulator or return-path faults using the service procedure. If pressure is correct but injectors do not pulse, check injector power, ECU ground, engine-position signal, and ECU control. If one cylinder differs, compare injector resistance and pulse with the others rather than replacing the whole rail.\n\n**Verify:** Pressure, hold/decay behavior, injector power, and injector pulse are each recorded; the engine responds consistently to a controlled fuel test only if it is safe and permitted by the service information.\n\n**Mistakes:** Equating pump noise with correct pressure; bypassing a relay and leaving the pump powered; using starting fluid near an intake backfire risk; replacing the pump before testing voltage drop and pressure.\n\n## Procedure 5 — Diagnose emissions and mixture faults after basic operation is proven\n\n**Symptom:** Starts but stalls, runs rich/lean, has unstable idle, fails emissions, or logs sensor/evaporative/EGR/oxygen-related faults.\n\n**Safety:** Exhaust gas is toxic; run only outdoors or with extraction. Do not defeat emissions equipment as a “test.” Avoid probing sealed connectors with oversized probes.\n\n**Tools:** Year/market-appropriate scanner or blink-code method, multimeter, vacuum gauge or smoke tester, fuel-pressure gauge, exhaust-gas analyzer if available, service information.\n\n**Steps:** First repair vacuum leaks, intake restrictions, poor grounds, and ignition misfire. Then use codes as direction, not verdict: the published NA list includes airflow, coolant-temperature, intake-temperature, throttle-position, oxygen, purge, EGR, and idle-control faults depending on year. [1] Compare sensor plausibility cold and warm; check wiring and reference/ground circuits before condemning a sensor. Inspect purge and EGR hoses/solenoids for routing, leaks, and stuck valves. Check fuel pressure and ignition timing under the condition that creates the complaint.\n\n**Tests:** Clear codes only after recording them, reproduce the symptom, and rescan. Verify closed-loop behavior only after the engine reaches operating temperature and has a stable ignition/fuel base. Confirm exhaust leaks near the oxygen sensor before interpreting oxygen readings.\n\n**Verify:** The repair changes the measured condition (mixture, vacuum, pressure, sensor plausibility, or code state) and the vehicle completes a cold/warm road test without the original symptom.\n\n**Mistakes:** Replacing an oxygen sensor for every emissions code; adjusting the airflow meter or ignition timing to hide a vacuum/fuel fault; applying modern OBD-II assumptions to an earlier NA.\n\n## Simplified wiring notes\n\n### 1. ECU power and ground are prerequisites, not a diagnosis\n\n**Diagram:** `Battery → fuses/main relay/ignition switch → ECU + engine-control loads; engine/body grounds → battery negative`\n\n**Explanation:** The ECU, igniter, injectors, sensors, and relays need both stable supply and low-resistance grounds. A relay click or a static 12 V reading does not prove usable voltage during cranking; measure voltage drop under load. The 1991 public diagram shows the ECU in the same control network as the main relay, injector feed, ignition switch, and diagnostic connector. [2]\n\n**Limits:** This is a functional block diagram, not a pinout. Wire colours, terminal numbers, fuses, and relay layouts vary by year and market.\n\n### 2. The fuel-pump path is conditional\n\n**Diagram:** `Key/ECU logic + safety inputs → circuit-opening relay → pump → fuel rail → regulator/return`\n\n**Explanation:** Pump operation is controlled through a relay and safety/airflow logic on applicable NA configurations; the public NA guide uses a verified diagnostic jumper to separate relay/control faults from pump and wiring faults. [4] Use pressure measurement to confirm delivery rather than listening for a brief prime.\n\n**Limits:** Do not assume every NA has identical relay logic or diagnostic-terminal behavior. Never leave a bypass jumper installed for normal driving.\n\n### 3. Ignition is a chain from position signal to spark\n\n**Diagram:** `Crank/CAS signal → ECU timing decision → igniter/coil → plug wires → plugs → cylinder`\n\n**Explanation:** No spark can originate from missing position information, ECU power/ground, igniter control, coil supply, high-tension hardware, or mechanical timing. The public 1991 diagram identifies these functional links without making them interchangeable across all NA years. [2]\n\n**Limits:** The diagram intentionally omits proprietary connector pinouts and does not provide resistance/voltage limits; use exact service data.\n\n### 4. Emissions sensors influence mixture but do not replace fundamentals\n\n**Diagram:** `Airflow/throttle/temperature inputs → ECU → injector/ignition commands; oxygen feedback + purge/EGR status → corrections/diagnostics`\n\n**Explanation:** NA self-diagnostics can report sensor and actuator circuits, but a code can be caused by wiring, vacuum leaks, exhaust leaks, or a real mechanical/mixture problem. Mazda’s owner guidance reinforces treating ignition, fuel, and emissions as linked systems. [1] [3]\n\n**Limits:** California and export cars may have additional emissions hardware. Confirm equipment by VIN and under-hood labels before testing or deleting anything.\n\n## References\n\n[1]: https://www.miata.net/garage/faultcodes.html \"Miata Engine Computer Self Diagnostics\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/1991_wiring.pdf \"1991 Mazda MX-5 Miata Wiring Diagrams\"\n[3]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07020100.html \"Mazda MX-5 Scheduled Maintenance and Emission Control Guidance\"\n[4]: https://forum.miata.net/vb/showthread.php?t=279746 \"Miata No-Start Troubleshooting Guide\"\n[5]: https://forum.miata.net/vb/showthread.php?p=9468381 \"Miata Forum No-Start Diagnostic Discussion\"\n[6]: https://archive.org/details/1990-mazda-mx-5-miata-workshop-manual \"1990 Mazda MX-5 Miata Workshop Manual scan listing\"\n",
        "references": "## References\n\n[1]: https://www.miata.net/garage/faultcodes.html \"Miata Engine Computer Self Diagnostics\"\n[2]: https://www.mellens.net/mazda/Mazda-Miata-1991-1993/1991_wiring.pdf \"1991 Mazda MX-5 Miata Wiring Diagrams\"\n[3]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07020100.html \"Mazda MX-5 Scheduled Maintenance and Emission Control Guidance\"\n[4]: https://forum.miata.net/vb/showthread.php?t=279746 \"Miata No-Start Troubleshooting Guide\"\n[5]: https://forum.miata.net/vb/showthread.php?p=9468381 \"Miata Forum No-Start Diagnostic Discussion\"\n[6]: https://archive.org/details/1990-mazda-mx-5-miata-workshop-manual \"1990 Mazda MX-5 Miata Workshop Manual scan listing\""
