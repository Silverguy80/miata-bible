  <noscript><main class="noscript"><h1>The Miata Bible</h1><p>This workshop requires JavaScript for its manual reader, garage, and build tools.</p></main></noscript>
  <script>
const generations = [
  { id:'NA', years:'1990–1997 US', engine:'1.6L / 1.8L BP', note:'The original lightweight roadster. Pop-up lamps, simple systems, and the widest restoration spread.', image:'assets/na.jpg', imageCredit:'Ondroeu / Wikimedia Commons', source:'https://commons.wikimedia.org/wiki/File:Mazda_MX-5_NA.jpg', watch:['Rust in sills, rails, and front chassis legs','Cooling-system age and brittle plastics','Timing-belt service history'] },
  { id:'NB', years:'1999–2005 US', engine:'1.8L BP / Mazdaspeed', note:'Fixed lamps, sharper bodywork, and a familiar mechanical core with more trim variation.', image:'assets/nb.jpg', imageCredit:'Elise240SX / Wikimedia Commons', source:'https://commons.wikimedia.org/wiki/File:1999_Mazda_MX-5_Miata_Base_in_Highlight_Silver_Metallic,_Front_Left,_08-06-2022.jpg', watch:['Front frame rails and rocker corrosion','Variable trim and brake-package fitment','Timing-belt and cooling history'] },
  { id:'NC', years:'2006–2015 US', engine:'2.0L MZR', note:'A larger, more planted generation. More room, more weight, and more powertrain variations.', image:'assets/nc.jpg', imageCredit:'M 93 / Wikimedia Commons', source:'https://commons.wikimedia.org/wiki/File:Mazda_MX-5_NC_front.JPG', watch:['Chassis weight and ride-height choices','PRHT hardware and drains','Cooling, belt, and suspension wear'] },
  { id:'ND', years:'2016–present US', engine:'1.5L / 2.0L SKYACTIV-G', note:'Modern lightness with electronic systems, ND1/ND2/ND3 changes, and the RF fastback.', image:'assets/nd.jpg', imageCredit:'Flyz1 / Wikimedia Commons', source:'https://commons.wikimedia.org/wiki/File:Mazda_MX-5_(MSP16).jpg', watch:['ND1/ND2/ND3 engine and ECU deltas','Electronic diagnostics before parts swapping','RF roof and body-seal inspection'] }
];

const books = [
  {id:'orientation', number:'01', title:'Orientation & workshop practice', pages:18, description:'How to use this manual, work safely, identify the car, and set up a repeatable inspection.'},
  {id:'fitment', number:'02', title:'Identification & fitment', pages:16, description:'Generation, engine, market, transmission, trim, and part-number discipline.'},
  {id:'maintenance', number:'03', title:'Maintenance & inspection', pages:22, description:'Service cadence, fluids, belts, hoses, storage, and inspection sheets.'},
  {id:'diagnostics', number:'04', title:'Diagnostics & electrical testing', pages:30, description:'Symptom-first diagnosis, voltage drop, grounds, scan data, and test strategy.'},
  {id:'engine', number:'05', title:'Engine mechanical systems', pages:34, description:'Compression, leak-down, timing, lubrication, sealing, and mechanical health.'},
  {id:'fuel', number:'06', title:'Fuel, intake, ignition & emissions', pages:22, description:'Air metering, fuel delivery, ignition, sensors, vacuum, and ECU context.'},
  {id:'cooling', number:'07', title:'Cooling, heating & A/C', pages:18, description:'Thermal management, fans, radiators, thermostats, HVAC, and refrigerant safety.'},
  {id:'driveline', number:'08', title:'Clutch, transmission & driveline', pages:28, description:'Clutch hydraulics, gearboxes, differential, axles, hubs, and driveline noise.'},
  {id:'chassis', number:'09', title:'Brakes, steering & suspension', pages:34, description:'Brake systems, ABS, steering, alignment, suspension, tires, and chassis setup.'},
  {id:'body', number:'10', title:'Body, top, leaks & corrosion', pages:18, description:'Soft tops, RF/PRHT notes, drains, seals, rust triage, glass, and trim.'},
  {id:'electrical', number:'11', title:'Electrical, lighting & accessories', pages:22, description:'Lighting, windows, instruments, charging, starting, switches, and accessories.'},
  {id:'generation', number:'12', title:'Generation books: NA / NB / NC / ND', pages:54, description:'Known differences, recurring checks, engine families, and fitment deltas by chassis.'},
  {id:'builds', number:'13', title:'Modification & build engineering', pages:20, description:'Wheels, tires, suspension, brakes, power, cooling, safety, and track preparation.'},
  {id:'index', number:'14', title:'Indexes, forms & job sheets', pages:14, description:'Symptom index, component index, sources, inspection logs, and printable worksheets.'}
];

const common = {tools:['Floor jack and stands','Torque wrench','Inspection light','Nitrile gloves'], sources:['Mazda owner/service information for the exact VIN and market','OEM parts catalog or verified supplier fitment'], related:[]};

const procedures = [
  {id:'safe-lift',book:'orientation',system:'Safety',title:'Lift and support the Miata safely',applies:['NA','NB','NC','ND'],tags:['lift','jack','stands','safety'],difficulty:'Foundational',time:'30–45 min',symptoms:'Before any under-car inspection or repair.',tools:['Quality floor jack','Four rated stands','Wheel chocks','Flat working surface'],safety:'Never work under a vehicle supported only by a jack. Confirm the stand points for your generation before loading them.',steps:['Park on a hard, level surface and set the parking brake.','Chock the wheels that remain on the ground.','Use the correct front or rear lift point for the chassis, then place stands at verified structural support points.','Lower the car onto the stands, test stability, and keep the jack lightly positioned only as a secondary support.'],verify:'The vehicle is stable, level enough for the job, and cannot roll or rock under controlled hand pressure.',mistakes:'Using a pinch weld that is already rust-thinned; lifting one corner when the procedure requires a level car.',...common},
  {id:'fitment-id',book:'fitment',system:'Identification',title:'Build a fitment record before ordering parts',applies:['NA','NB','NC','ND'],tags:['fitment','vin','part number','trim'],difficulty:'Foundational',time:'15 min',symptoms:'Any repair or modification with multiple trim or market variants.',tools:['Phone camera','Notebook or build log'],safety:'A fitment record prevents expensive mistakes; it does not replace checking the current parts catalog.',steps:['Record VIN, production date, generation, engine, transmission, market, body style, ABS status, and current wheel/brake setup.','Photograph the original part, connector, mounting pattern, and label.','Record the old part number and compare it to the replacement supplier’s application notes.','Keep uncertain fitment marked as conditional until a physical or catalog match is confirmed.'],verify:'The part can be traced to the car’s exact configuration and the replacement number is documented.',mistakes:'Assuming all NB, ND, or “Club” parts are interchangeable.',...common},
  {id:'maintenance-baseline',book:'maintenance',system:'Inspection',title:'Create a first-day condition baseline',applies:['NA','NB','NC','ND'],tags:['inspection','baseline','used car'],difficulty:'Foundational',time:'2–4 hr',symptoms:'A newly purchased or newly acquired Miata with incomplete records.',tools:['Tire gauge','Flashlight','Paper towels','Paint marker'],safety:'Do not road-test a car with an active fuel leak, unsafe tire, severe brake fault, or loose wheel.',steps:['Photograph the car, odometer, warning lights, engine bay, underbody, tires, and fluid reservoirs.','Record cold-start behavior, idle quality, temperature behavior, clutch feel, brake feel, steering feel, and noises.','Mark urgent safety items separately from deferred maintenance and cosmetic work.','Create a parts-and-evidence list before buying anything.'],verify:'The baseline separates “must not drive,” “service soon,” and “monitor” items.',mistakes:'Starting with cosmetic upgrades before verifying brakes, tires, fluids, cooling, and rust.',...common},
  {id:'oil-service',book:'maintenance',system:'Lubrication',title:'Plan an engine oil and filter service',applies:['NA','NB','NC','ND'],tags:['oil','filter','service'],difficulty:'Foundational',time:'45–75 min',symptoms:'Routine service, unknown history, or oil contamination concern.',tools:['Drain pan','Filter wrench','Correct oil and filter','New sealing washer if specified'],safety:'Confirm the exact oil specification and capacity for the engine before filling. Keep hot oil off skin.',steps:['Confirm engine, market, capacity, filter, and service interval.','Warm the engine appropriately, then secure the vehicle if access requires lifting.','Drain into a clean pan and inspect for coolant, fuel smell, glitter, or unusual debris.','Install the correct filter and sealing hardware, fill in stages, check the level, and inspect for leaks.'],verify:'Oil level is correct on the specified measurement surface and the filter/drain area remains dry after running.',mistakes:'Overfilling; relying on a generic capacity; tightening a filter dry or with the wrong seal.',...common},
  {id:'cooling-triage',book:'cooling',system:'Cooling',title:'Diagnose an overheating complaint',applies:['NA','NB','NC','ND'],tags:['overheating','radiator','fan','thermostat'],difficulty:'Intermediate',time:'1–3 hr diagnosis',symptoms:'Temperature rise, coolant loss, fan concern, hot smell, or heater output change.',tools:['Cooling-system pressure tester','Infrared thermometer','Scan tool where supported'],safety:'Never open a hot pressurized cooling system. Let the car cool fully before removing a cap or hose.',steps:['Record when the temperature rises: idle, highway, load, or after shutdown.','Inspect level, cap, radiator airflow, hoses, belt routing, and visible leak paths cold.','Verify fan command and actual fan operation using the generation-appropriate procedure.','Pressure-test only with a cool system and trace leaks before replacing parts.','Refill and bleed using the correct method for the chassis and confirm stable temperature.'],verify:'The original symptom is reproduced or eliminated, and the system holds pressure without unexplained loss.',mistakes:'Replacing a thermostat without checking airflow, fan control, cap, leaks, or trapped air.',...common},

function createGarageStore(key, defaultsFactory){
  return {
    load(){
      try{
        const raw=JSON.parse(localStorage.getItem(key)||'null');
        return raw ? {...defaultsFactory(),...raw,profile:{...defaultsFactory().profile,...(raw.profile||{})}} : defaultsFactory();
      }catch{return defaultsFactory()}
    },
    save(value){
      try{localStorage.setItem(key,JSON.stringify(value));return {ok:true,status:'local'}}
      catch{return {ok:false,status:'offline'}}
    },
    clear(){try{localStorage.removeItem(key)}catch{}}
  };
}

function $(selector,root=document){return root.querySelector(selector)}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(value){return '$'+Number(value||0).toLocaleString('en-US',{maximumFractionDigits:0})}
function genKey(value=state.profile.generation){return String(value).slice(0,2).toUpperCase()}
function currentGeneration(){return generations.find(g=>g.id===genKey())||generations[3]}
function showToast(message){const node=$('#toast');if(!node)return;node.textContent=message;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),2200)}
function toast(message){showToast(message)}
function record(type,description,cost=0,notes=''){state.history.unshift({id:Date.now()+Math.random(),date:new Date().toISOString().slice(0,10),type,description,cost:Number(cost)||0,notes,mileage:state.profile.mileage})}
function setView(view){state.view=view;render()}
function activeBook(){return books.find(b=>b.id===state.activeBook)||books[0]}
function filteredProcedures(){
  const q=state.query.trim().toLowerCase(); const g=state.generationFilter==='all'?null:state.generationFilter;
  return procedures.filter(p=>p.book===state.activeBook && (!g||p.applies.includes(g)) && (!q||[p.title,p.system,p.symptoms,p.tags.join(' '),p.applies.join(' ')].join(' ').toLowerCase().includes(q)));
}

function renderManual(){const book=activeBook();const list=filteredProcedures();return `<div class="view">${renderHead('02 · workshop manual',book.title,'A structured, original reference layer. Filter by chassis before reading a procedure; verify exact specifications against authorized service information.','<button class="button" data-action="print">Print chapter</button>')}
  <div class="top-nav" aria-label="Primary navigation">${navButton('garage','Garage','01')}${navButton('manual','Manual','02')}${navButton('builds','Builds','03')}${navButton('history','History','04')}${navButton('facts','Facts','05')}</div>
  <div class="workbench"><section class="sheet"><div class="index-tabs"><span class="index-tab active">book ${book.number}</span><span class="index-tab">original content</span><span class="index-tab">fitment-aware</span></div><div class="notice danger"><strong>Use this as a companion reference.</strong> Exact torque values, wiring, fluid specifications, and safety procedures vary by year, market, engine, trim, and modification. Verify them in the correct service information before work.</div><div class="filter-bar"><input class="search-input" aria-label="Search this manual" placeholder="Search title, symptom, system, tag…" value="${esc(state.query)}" data-field="query"><select class="search-input" aria-label="Filter by generation" data-field="generationFilter"><option value="all">All generations</option>${generations.map(g=>`<option value="${g.id}" ${state.generationFilter===g.id?'selected':''}>${g.id} · ${g.years}</option>`).join('')}</select><button class="button" data-action="clear-search">Clear filters</button></div><div class="procedure-list">${list.length?list.map(renderProcedure).join(''):`<div class="empty-state"><h3>No procedure matches this filter.</h3><p>Try another generation, system, or symptom. Do not broaden fitment assumptions just to make a part fit.</p></div>`}</div></section><aside class="context-rail"><div class="context-card"><h3>Manual index</h3><div class="chapter-list">${books.map(b=>`<button class="chapter-link ${b.id===book.id?'active':''}" data-action="open-book" data-book="${b.id}"><span class="chapter-number">${b.number}</span><span>${esc(b.title)}</span></button>`).join('')}</div></div><div class="context-card"><h3>Reading state</h3><div class="metric-row"><span>Procedures in book</span><b>${procedures.filter(p=>p.book===book.id).length}</b></div><div class="metric-row"><span>Saved procedures</span><b>${state.savedProcedures.length}</b></div><p>Use the save control inside a procedure to build your own service queue.</p></div></aside></div></div>`}
function renderProcedure(p){const saved=state.savedProcedures.includes(p.id);return `<details class="procedure-card" ${saved?'open':''}><summary><div class="procedure-title">${esc(p.title)}</div><div class="procedure-meta"><span class="meta-tag">${esc(p.system)}</span><span class="meta-tag">${esc(p.difficulty)}</span><span class="meta-tag">${esc(p.time)}</span>${p.applies.map(g=>`<span class="meta-tag">${g}</span>`).join('')}</div></summary><div class="procedure-body"><p><strong>Use when:</strong> ${esc(p.symptoms)}</p><h4>Before you begin</h4><div class="notice danger">${esc(p.safety)}</div><h4>Tools & supplies</h4><ul>${p.tools.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><h4>Procedure</h4><ol>${p.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h4>Verification</h4><p>${esc(p.verify)}</p><h4>Common mistakes</h4><p>${esc(p.mistakes)}</p><div class="notice"><strong>Sources to check:</strong> ${p.sources.map(s=>esc(s)).join(' · ')}</div><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="button small ${saved?'primary':''}" data-action="save-procedure" data-id="${p.id}">${saved?'Saved to queue':'Save to service queue'}</button><button class="button text small" data-action="view" data-view="builds">Open parts / build ledger →</button></div></div></details>`}
function renderBuilds(){const total=state.plan.reduce((s,p)=>s+p.cost,0);return `<div class="view">${renderHead('03 · build ledger','Builds / parts / budget','A configuration is not just a shopping list. It is a sequence of choices with fitment, dependencies, cost, and history.','<button class="button primary" data-action="export">Export garage JSON</button>')}
  <div class="workbench"><section class="sheet"><div class="index-tabs"><span class="index-tab active">current setup</span><span class="index-tab">planned</span><span class="index-tab">history-safe</span></div><h2>Current installed parts</h2>${state.parts.length?state.parts.map(renderPart).join(''):`<div class="empty-state"><h3>Nothing installed yet.</h3><p>Start with reliability work. A build ledger is most useful when it records what is actually on the car.</p></div>`}<div class="section-band"><h2>Part catalog</h2><span class="eyebrow">fitment-aware suggestions</span></div><div class="procedure-list">${parts.map(p=>`<div class="procedure-card"><div class="procedure-title">${esc(p.name)}</div><div class="procedure-meta">${p.generations.map(g=>`<span class="meta-tag">${g}</span>`).join('')}<span class="meta-tag">${money(p.cost)}</span></div><p>${esc(p.impact)}</p><p class="muted"><strong>Check:</strong> ${esc(p.prereq)}</p><button class="button small" data-action="add-part" data-part="${p.id}">Add to build ledger</button></div>`).join('')}</div></section><aside class="context-rail"><div class="context-card"><h3>Budget</h3><div class="metric-row"><span>Budget ceiling</span><b>${money(state.budget)}</b></div><div class="metric-row"><span>Planned total</span><b>${money(total)}</b></div><div class="metric-row"><span>Remaining</span><b class="${total>state.budget?'warn':''}">${money(state.budget-total)}</b></div><div class="field"><label for="budget-input">Budget (USD)</label><input id="budget-input" type="number" value="${state.budget}" data-field="budget"></div><div class="field"><label for="plan-name">Plan name</label><input id="plan-name" value="${esc(state.planName)}" data-field="planName"></div><button class="button small primary" data-action="save-plan">Save plan settings</button></div><div class="context-card"><h3>Suggested paths</h3>${buildPaths.map(path=>`<div class="build-card" style="margin:8px 0;padding:12px"><h3 style="font-size:19px">${esc(path.title)}</h3><p>${esc(path.summary)}</p><button class="button text small" data-action="load-path" data-path="${path.id}">Load path →</button></div>`).join('')}</div><div class="context-card"><h3>Build rule</h3><p>Every replacement keeps the previous part in history. Nothing disappears because you changed your mind.</p></div></aside></div></div>`}
function renderPart(p){return `<div class="part-row"><div><div class="fitment-stamp">${esc(p.category)} · ${esc(p.slot)}</div><h3>${esc(p.part)}</h3><p>${esc(p.notes||'No install notes yet.')} · installed ${esc(p.date)}</p></div><div><div class="price">${money(p.cost)}</div><button class="button text small" data-action="remove-part" data-id="${p.id}">Archive</button></div></div>`}
function renderHistory(){return `<div class="view">${renderHead('04 · service ledger','History / every mile','A plain-language record of what changed, why it changed, and what it cost.','<button class="button primary" data-action="export">Export history</button>')}<div class="workbench"><section class="sheet"><div class="index-tabs"><span class="index-tab active">append-only ledger</span><span class="index-tab">service notes</span></div><h2>Record service</h2><div class="form-grid"><div class="field"><label for="history-type">Type</label><select id="history-type"><option>Service</option><option>Repair</option><option>Inspection</option><option>Modification</option><option>Note</option></select></div><div class="field"><label for="history-cost">Cost (USD)</label><input id="history-cost" type="number" min="0" value="0"></div></div><div class="field"><label for="history-title">What happened?</label><input id="history-title" placeholder="Timing belt and water pump service"></div><div class="field"><label for="history-notes">Notes</label><textarea id="history-notes" placeholder="Parts, measurements, symptoms, next check…"></textarea></div><button class="button primary" data-action="add-history">Add ledger entry</button><div class="section-band"><h2>Recorded work</h2><span class="eyebrow">${state.history.length} events</span></div>${state.history.length?state.history.map(h=>`<div class="history-row"><div><div class="fitment-stamp">${esc(h.type)} · ${esc(h.date)}</div><h3>${esc(h.description)}</h3><p>${esc(h.notes||'No notes recorded.')} · ${Number(h.mileage||0).toLocaleString()} mi</p></div><div class="price">${money(h.cost)}</div></div>`).join(''):`<div class="empty-state">Your service ledger is empty. Add the first honest note.</div>`}</section><aside class="context-rail"><div class="context-card"><h3>Ledger rules</h3><p>Entries are append-only in this version. Replaced parts stay visible so future-you can understand the car’s history.</p><div class="metric-row"><span>Vehicle mileage</span><b>${Number(state.profile.mileage).toLocaleString()}</b></div><div class="metric-row"><span>Tracked spend</span><b>${money(state.history.reduce((s,h)=>s+h.cost,0))}</b></div></div></aside></div></div>`}
function renderFacts(){return `<div class="view">${renderHead('05 · chassis archive','Generations / fitment atlas','A visual reference for the four chassis families. Use the manual filter after choosing the car, not before.')}<div class="photo-grid">${generations.map(g=>`<article class="generation-card"><img src="${g.image}" alt="${g.id} generation Mazda MX-5 Miata"><div class="generation-copy"><span class="fitment-stamp">${g.id} · ${g.years}</span><h3>${g.engine}</h3><p>${esc(g.note)}</p><p><strong>Watch first:</strong> ${esc(g.watch[0])}</p><a href="${g.source}" target="_blank" rel="noreferrer">Photo: ${esc(g.imageCredit)} ↗</a><button class="button text small" data-action="filter-generation" data-generation="${g.id}">Filter manual to ${g.id} →</button></div></article>`).join('')}</div><div class="section-band"><h2>Workshop manual architecture</h2><span class="eyebrow">${books.reduce((s,b)=>s+b.pages,0)} planned pages</span></div><div class="chapter-list">${books.map(chapterRow).join('')}</div></div>`}
function bind(){
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',handleAction));
  document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',handleField));
  document.querySelectorAll('[data-field="query"]').forEach(el=>el.addEventListener('input',e=>{state.query=e.target.value;renderManualOnly()}));
}
function handleField(e){const field=e.currentTarget.dataset.field;state[field]=e.currentTarget.value;if(field==='year'||field==='mileage'||field==='budget')state[field]=Number(state[field])||0;if(field.startsWith('profile'))state.profile[field.replace('profile-','')]=e.currentTarget.value;persistSilent()}
function persistSilent(){store.save(state)}
function handleAction(e){const el=e.currentTarget;const action=el.dataset.action;
  if(action==='view'){setView(el.dataset.view);return}
  if(action==='edit-vehicle'){setView('garage');setTimeout(()=>$('#profile-name')?.focus(),0);return}
  if(action==='open-book'){state.activeBook=el.dataset.book;state.view='manual';state.query='';render();return}
  if(action==='clear-search'){state.query='';state.generationFilter='all';render();return}
  if(action==='filter-generation'){state.generationFilter=el.dataset.generation;state.activeBook='generation';state.view='manual';render();return}
  if(action==='save-profile'){saveProfile();return}
  if(action==='save-procedure'){const id=el.dataset.id;state.savedProcedures=state.savedProcedures.includes(id)?state.savedProcedures.filter(x=>x!==id):[...state.savedProcedures,id];persist();return}
  if(action==='print'){window.print();return}
  if(action==='export'){exportState();return}
  if(action==='add-part'){addCatalogPart(el.dataset.part);return}
  if(action==='remove-part'){removePart(el.dataset.id);return}
  if(action==='save-plan'){state.budget=Number($('#budget-input')?.value)||0;state.planName=$('#plan-name')?.value||'Build plan';persist();return}
  if(action==='load-path'){loadPath(el.dataset.path);return}
  if(action==='add-history'){addHistory();return}
}
function renderManualOnly(){const main=$('.main');if(state.view==='manual'&&main){main.innerHTML=renderManual();bind()}}
function saveProfile(){state.profile={...state.profile,buildName:$('#profile-name')?.value||state.profile.buildName,market:$('#profile-market')?.value||state.profile.market,generation:$('#profile-generation')?.value||state.profile.generation,year:Number($('#profile-year')?.value)||state.profile.year,trim:$('#profile-trim')?.value||state.profile.trim,mileage:Number($('#profile-mileage')?.value)||state.profile.mileage};record('Vehicle','Updated vehicle record');persist()}
function addCatalogPart(id){const item=parts.find(p=>p.id===id);if(!item)return;if(!item.generations.includes(genKey())){toast(`${item.name} needs ${item.generations.join('/')} fitment review`);return}const prior=state.parts.find(p=>p.slot===item.slot);if(prior){record('Replaced',`${prior.part} replaced in ${prior.slot}`,0,`New part: ${item.name}`);state.parts=state.parts.filter(p=>p.id!==prior.id)}const part={id:Date.now(),category:item.category,slot:item.slot,part:item.name,cost:item.cost,date:new Date().toISOString().slice(0,10),notes:item.impact};state.parts.push(part);record('Installed',`${item.name} → ${item.slot}`,item.cost,item.impact);persist()}
function removePart(id){const item=state.parts.find(p=>String(p.id)===String(id));if(!item)return;state.parts=state.parts.filter(p=>String(p.id)!==String(id));record('Archived',`${item.part} archived from ${item.slot}`);persist()}
function loadPath(id){const path=buildPaths.find(p=>p.id===id);if(!path)return;path.items.forEach(itemId=>{const item=parts.find(p=>p.id===itemId);if(item&&!state.plan.some(x=>x.source===item.id))state.plan.push({id:Date.now()+Math.random(),source:item.id,name:item.name,cost:item.cost,done:false})});state.planName=path.title;persist()}
function addHistory(){const type=$('#history-type')?.value||'Service';const description=$('#history-title')?.value?.trim();if(!description){toast('Add a short description first');return}record(type,description,Number($('#history-cost')?.value)||0,$('#history-notes')?.value||'');persist()}
function exportState(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`miata-bible-garage-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('Garage export downloaded')}
window.addEventListener('hashchange',()=>{const match=location.hash.match(/manual\/([^/]+)/);if(match){state.activeBook=match[1];state.view='manual';render()}});
render();

</script>
</body>
</html>
