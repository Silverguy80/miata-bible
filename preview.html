        "markdown": "# Mazda MX-5 ND Electrical and Diagnostic Systems (2016–present)\n\nThis note is an original, non-factory-manual research outline for *Modified Miata*. It describes system relationships and safe diagnostic logic without reproducing Mazda wiring diagrams, connector pinouts, proprietary service-manual text, or fuse-box artwork.\n\n## 1. Generation facts and caveats\n\n### ND1, ND2, ND3 in practical diagnostic terms\n\nThe ND is the fourth-generation MX-5 and begins with the 2016 model year in North America. Mazda’s 2016 material identifies it as the fourth generation. [1] The labels **ND1**, **ND2**, and **ND3** are enthusiast shorthand rather than three clean electrical platforms. They are useful for parts and symptom context, but the exact equipment mix depends on market, trim, transmission, body style, and build date.\n\n- **ND1 (roughly 2016–2018):** early fourth-generation cars. The 2.0-liter North American car used the earlier engine calibration and equipment set. Some cars have simpler lighting and driver-assistance content than later cars. Treat a 2016–2018 car as a specific VIN/build configuration, not as a universal “ND1 circuit.”\n- **ND2 (roughly 2019–2023):** Mazda’s 2019 update increased the 2.0-liter output to 181 hp and raised the redline to 7,500 rpm. Mazda also added a standard rearview camera and made additional i-ACTIVSENSE features available. [2] These changes matter diagnostically because a later car may have different camera, safety, calibration, and module behavior even when the basic 12-volt architecture looks familiar.\n- **ND3 (2024–present in the current run):** the 2024 refresh added revised exterior lighting, updated steering/electronic-control content, and new driver-assistance or display behavior depending on market and trim. Independent contemporary coverage highlights the all-LED exterior lighting change; Mazda’s owner information lists LED assemblies that are replaced as a unit rather than as a conventional bulb. [3] [4] Do not use an ND1 lighting assumption to diagnose an ND3 lamp or its control fault.\n- **RF versus soft top:** the RF arrived as a 2017 model with an electronically operated retractable fastback roof; the soft top is manually operated. Mazda describes the RF roof as an electronically operated hard retractable fastback and separately documents operation prerequisites and emergency manual closing. [4] [5] The RF adds motors, position/operation logic, switches, and body-side wiring that are not present on a soft top.\n\n### Electrical-system caveats that apply across the range\n\nThe ND is a modern networked 12-volt vehicle. A weak battery, bad terminal, or poor engine/body ground can create a large-looking collection of unrelated symptoms: slow or no crank, warning lamps, communication DTCs, intermittent lighting, keyless complaints, i-stop warnings, or a roof that refuses to move. Stabilize power and grounds before condemning a control module. Fluke’s general automotive guidance notes that low-current computer circuits are especially sensitive to small voltage drops and recommends checking grounds before replacing modules. [7]\n\nThe owner manual is market-specific. Mazda USA explicitly says its manuals refer to U.S. vehicles only. [6] Fuse labels, lamps, emissions equipment, i-stop availability, and driver-assistance content can differ in other markets. Use the VIN-specific owner information and the vehicle’s own fuse-cover legend as the final authority.\n\nFor cars equipped with **i-stop** or an equivalent battery-monitoring strategy, replacement and charging are not merely mechanical operations. Mazda owner information describes lead-acid battery safety and maintenance, while ND owner reports describe battery-state-of-charge learning and an i-stop initialization process after battery replacement or extended external charging. Treat the owner-forum procedure as secondary evidence, not as a substitute for the correct market service information. [8]\n\n### Battery, charging, and starting architecture\n\nThe useful abstraction is: battery and high-current cables feed the starter and the under-hood distribution/fuse center; the alternator replenishes the battery and supplies vehicle loads after the engine starts; an engine/body ground network completes both high-current and low-current paths; control modules supervise the engine, transmission, stability, body, lighting, keyless, infotainment, and (on RF cars) roof functions. The alternator is not proven healthy merely because the engine runs. Ripple, voltage drop, loose grounds, and intermittent terminals can remain hidden until the car is loaded.\n\nA conventional open-circuit battery reading is only a state-of-charge clue. A battery can show a reasonable resting voltage and still collapse during crank. DENSO recommends beginning with a fully charged battery and clean cables, then combining cranking voltage/current and voltage-drop tests. It cites approximately 9.6 V as a usual minimum cranking voltage at 20–25 °C, but the vehicle maker’s specification takes precedence. [9]\n\n### Lighting and body electronics\n\nMazda’s 2024 information lists many exterior lamps as integrated LED units and warns that a short can occur if a tool contacts a lamp terminal during removal. [10] Therefore, a dead lamp is not automatically a replaceable “bulb” problem. Start with the complaint pattern: one lamp, one side, an entire function, or several unrelated body functions. Then check power, ground, connector condition, fuse protection, network/body-module data, and the unit itself. If one fuse blows repeatedly, Mazda says to stop using that system and have it checked rather than repeatedly installing a new fuse. [11]\n\n### RF roof cautions\n\nThe RF roof should be diagnosed as a complete electromechanical system, not as a convenience accessory. Mazda’s 2024 operating conditions include ignition ON, selector not in reverse, vehicle speed at or below 10 km/h, trunk closed, and vehicle angle within the specified limit. [5] If those conditions are satisfied and the roof still will not close, Mazda directs the owner to have it checked; emergency manual closing requires two adults and leaves electric operation unavailable until the system is restored by an authorized repairer. [12] Keep hands, tools, and loose trim clear of moving panels and linkages. Do not bypass interlocks or repeatedly cycle a stalled roof to “see if it catches.”\n\n### Cooling fan and overheat cautions\n\nThe fan is capable of running after the engine is switched off. Mazda warns that it may continue running indefinitely when the engine compartment is hot and says not to touch rotating parts or remove a hot cooling-system cap. [13] An overheating diagnosis starts with cooling-system level, leaks, and actual temperature—not with a hand placed near the fan. A fan that runs with A/C demand does not prove that its temperature-triggered path is healthy; a fan that never runs may reflect a fuse, relay/control command, motor, wiring, ground, sensor input, or a genuine lack of command because the engine has not reached the relevant condition.\n\n## 2. Diagnostic procedures\n\n### Procedure 1 — Battery health, charging output, and parasitic symptom triage\n\n**Symptom:** slow crank, clicking, random warning lamps after startup, i-stop unavailable, battery warning, flickering lamps, or a battery that repeatedly goes flat.\n\n**Safety:** wear eye protection around a lead-acid battery; keep sparks and metal tools away from the terminals; do not work around belts or a fan with the engine running unless the test requires it and the tool/lead routing is secure. Mazda warns about sulfuric acid, hydrogen gas, and accidental shorting at the positive terminal. [14]\n\n**Tools:** digital multimeter, battery conductance/load tester if available, charger, scan tool with live data for battery-state information where supported, and a current clamp for deeper diagnosis.\n\n**Steps and tests:**\n\n1. Record the symptom, recent battery age, jump-starts, accessories, and whether the car is an RF or i-stop-equipped variant.\n2. Inspect the battery case, hold-down, terminal posts, cable ends, current-sensor connection if fitted, and visible engine/body ground straps. Clean and tighten only after the ignition is off and the vehicle is safely secured.\n3. Measure resting voltage after the car has been undisturbed long enough to settle. Use the result as a screening value, not a pass/fail verdict.\n4. Perform a controlled load or conductance test. During cranking, watch the minimum voltage and compare it with the tester’s temperature-corrected guidance and the vehicle specification. DENSO gives approximately 9.6 V at 20–25 °C as a usual minimum, while emphasizing manufacturer limits. [9]\n5. With the engine running, measure charging voltage at the battery posts at idle and with electrical loads. A stable number is more useful than a single “14-volt” snapshot. Check for warning-lamp behavior and scan-tool charging/battery PIDs if the platform exposes them.\n6. If symptoms persist, screen alternator ripple in AC-volts mode at the battery with loads on. Fluke describes ripple as the AC component riding on the DC charging output and gives 0.30–0.50 V AC as a fault range that commonly points to diode or stator trouble; use that as a screening reference, not a Mazda-specific specification. [15]\n7. If the battery is good but goes flat while parked, perform a timed key-off current test only after the vehicle has entered sleep. Do not infer a parasitic draw while the RF roof, trunk, keyless system, infotainment, or diagnostic tool is still awake.\n\n**Verification:** the car starts repeatedly, charging warning does not return, resting voltage recovers after a drive, and scan data no longer shows implausible battery-state or communication symptoms.\n\n**Common mistakes:** replacing the alternator before testing grounds; judging battery health from resting voltage alone; leaving a scan tool or phone accessory connected during a parasitic test; confusing i-stop inhibition with a charging failure; and using an incorrect battery type or skipping the required battery-monitor learning on equipped cars.\n\n### Procedure 2 — No-crank, slow-crank, and ground-side voltage-drop test\n\n**Symptom:** no starter operation, a single click, intermittent crank, or a starter that turns too slowly despite a battery that appears charged.\n\n**Safety:** transmission in the required safe position, parking brake applied, wheels secured, and ignition/fuel disabled as appropriate for the test. Keep hands and leads away from moving parts. Mazda’s jump-start guidance also requires a 12-volt booster system, a remote ground point, and cable routing away from fans and belts. [16]\n\n**Tools:** high-impedance DMM with min/max capture, test leads with long extensions, battery tester, and optionally a current clamp.\n\n**Steps and tests:**\n\n1. Verify the complaint and note whether the dash blacks out, clicks, or remains powered. Confirm the key is recognized and that the clutch/selector interlock is being satisfied.\n2. Measure battery voltage at the posts while attempting to crank. If it collapses, prove the battery and high-current connections before chasing the starter control circuit.\n3. Test the positive side under crank: battery positive post to starter B+ connection. DENSO describes more than about 0.5 V across the complete positive side as excessive, with about 0.2 V or less expected across a cable and about 0.3 V or less across the magnetic switch as general starter guidance. [9]\n4. Test the negative side under crank: starter housing to battery negative post. DENSO gives about 0.2 V or less as an acceptable negative-side drop and specifically calls out the battery ground, engine/chassis straps, and starter mounting path. [9]\n5. If high drop is found, move one probe at a time across the terminal, cable, strap, and mounting interface to isolate the exact restriction. Clean, repair, or replace the failed connection, then retest.\n6. If power and ground drops are acceptable, check the starter-control command at the starter while the start request is made. Compare the result with the vehicle-specific specification; do not bridge terminals as a casual test.\n\n**Verification:** the engine cranks at normal speed repeatedly, the voltage-drop readings remain within the applicable specification, and no ground-related warning or communication cascade returns.\n\n**Common mistakes:** measuring resistance with the circuit off and assuming it proves a high-current connection; probing painted or corroded metal; blaming the starter before testing the negative side; and using a 24-volt jump source. Mazda explicitly warns that a 24-volt source can damage the starter, ignition, and other electrical parts. [16]\n\n### Procedure 3 — Scan-tool workflow for engine, body, chassis, and network faults\n\n**Symptom:** warning lamps, multiple U-codes, intermittent body behavior, i-stop or keyless faults, unexplained limp mode, or a fault that disappears after a battery disconnect.\n\n**Safety:** save vehicle state before clearing anything. Do not disconnect the battery or erase codes until freeze-frame and module data have been recorded. Observe airbag and high-current safety rules; do not probe unknown connectors.\n\n**Tools:** a scan tool that can access more than generic OBD-II powertrain data, stable battery support, DMM, and a way to save a vehicle report.\n\n**Steps and tests:**\n\n1. Identify VIN, model year, ND generation shorthand, engine/transmission, soft top or RF, market, and modifications. This prevents applying an ND1 assumption to an ND3 body or lighting system.\n2. Before clearing codes, capture all modules, code status, freeze-frame, system voltage, and communication faults. A low-voltage event can make several modules report secondary communication codes.\n3. Run a global scan if supported: PCM/engine, transmission, ABS/DSC, restraint, body/BCM, instrument cluster, keyless, infotainment, camera/ADAS, and RF roof-related modules where fitted.\n4. Triage by first occurrence and power/ground plausibility. If many modules logged faults at the same time, test battery voltage, grounds, ignition feeds, and network integrity before replacing a module.\n5. Use live data to validate the complaint: engine coolant temperature against a cold-soak ambient reading; commanded versus actual fan state; steering-angle and vehicle-speed plausibility; battery state or current-sensor values; roof operation prerequisites; and switch/door/trunk status.\n6. Repair the physical cause, then clear codes only when appropriate and perform the required relearn/calibration. A battery disconnect can erase learned values or create initialization requirements; the ND i-stop evidence describes battery-state and steering-angle learning after disconnection. [8]\n7. Repeat a global scan and road-test under the original conditions. A generic code reader that sees only P0xxx codes is not a complete ND diagnostic workflow.\n\n**Verification:** the relevant module communicates, live data changes plausibly, the original symptom is gone, and a post-repair scan does not show new low-voltage, lost-communication, calibration, or safety-system faults.\n\n**Common mistakes:** clearing codes before recording them; treating every U-code as a failed module; failing to support the battery during a scan or programming operation; ignoring the vehicle’s market/trim; and assuming the 16-pin connector guarantees full-system access.\n\n### Procedure 4 — Body electronics and lighting fault isolation\n\n**Symptom:** one lamp out, a whole lighting function dead, flicker, repeated fuse failure, power-window/lock/keyless oddities, or several body systems failing together.\n\n**Safety:** ignition and lighting switch off before disconnecting lamp units; do not short a connector with a probe; use fused test equipment; and keep airbag/pretensioner connectors out of the test path.\n\n**Tools:** wiring information appropriate to the VIN, DMM, fused test lead, low-current test probe, scan tool with body access, and a known-good load where appropriate.\n\n**Steps and tests:**\n\n1. Define the scope: one side, one lamp, one switch position, all lamps on a fuse, or several unrelated functions. Check whether the fault follows a lamp unit or stays with the vehicle-side connector.\n2. Inspect the fuse by the correct circuit description, then test for voltage on both sides of the fuse with the circuit commanded on. If the same fuse opens again, stop cycling replacements; Mazda directs owners to discontinue use and seek service. [11]\n3. At the failed load, test command voltage and ground under load. A DMM reading with no current flow can miss a corroded terminal; use a voltage-drop test while the lamp is commanded on.\n4. Inspect connectors, water entry, harness strain, prior accessory splices, and body grounds. For LED assemblies, do not assume a replaceable bulb; Mazda lists many 2024 exterior lamps as integrated units. [10]\n5. Use the scan tool to check body-module switch inputs, output commands, and related DTCs. Compare an inoperative lamp with its working counterpart without copying a pinout from a proprietary diagram.\n6. If multiple functions share a symptom, return to battery/ground and network testing before replacing the body module.\n\n**Verification:** the lamp or body function works under all switch positions, fuse current is stable, no connector heats or drops excessive voltage, and the body scan is clean after a full sleep/wake cycle.\n\n**Common mistakes:** installing a higher-rated fuse; condemning an LED assembly from a visual inspection alone; grounding a computer circuit with a traditional high-current test light; and chasing a body-module code without checking battery/ground voltage first. Fluke warns that computer circuits are low-current and that an ordinary test light can damage them. [7]\n\n### Procedure 5 — RF roof will not move or stops partway\n\n**Symptom:** roof switch does nothing, roof stops during a cycle, roof-operation message, windows move but roof does not, or a roof warning after low voltage or battery work.\n\n**Safety:** park level and clear of traffic, keep people clear of panel/linkage travel, and do not drive with the roof partly open. Mazda says manual emergency closing requires two adults and that electric operation is unavailable until the system is restored by an authorized repairer. [12]\n\n**Tools:** stable 12-volt supply/charger, DMM, scan tool with body/roof access if available, inspection light, and VIN-specific owner/service information.\n\n**Steps and tests:**\n\n1. Confirm the operation prerequisites: ignition ON, transmission not in reverse, speed at or below the specified limit, trunk closed, and acceptable vehicle angle. [5]\n2. Check battery voltage and ground integrity before cycling. A low-voltage event can mimic a roof-module or position-sensor failure.\n3. Inspect the trunk latch/status, roof switch, window state, visible connectors, harness routing, and mechanical obstruction. Do not force panels or bypass interlocks.\n4. Scan the body/roof system for switch, position, overcurrent, communication, and calibration faults. Record codes before clearing them.\n5. If the roof moves only partway, note the exact stopping point and whether the system reverses, times out, or reports a prerequisite. That symptom distinguishes a blocked/interlocked condition from a pure no-power complaint.\n6. If the roof cannot close electrically after prerequisites and power checks, secure the vehicle and use Mazda’s emergency procedure or arrange professional repair. Do not improvise a jumper across an unknown motor or sensor circuit.\n\n**Verification:** the roof completes several open/close cycles at the permitted speed and angle, windows and status messages agree with the physical position, and no roof or body DTC returns.\n\n**Common mistakes:** testing the roof with the trunk ajar; repeatedly cycling a weak battery; assuming a roof warning means only a motor; driving with a partially open roof; and treating an emergency manual close as a permanent repair.\n\n### Procedure 6 — Cooling-fan complaint: no fan, always on, or overheating at idle\n\n**Symptom:** temperature rises in traffic, fan never appears to run, fan runs after key-off, fan runs continuously, or A/C performance changes with fan behavior.\n\n**Safety:** never open a hot cooling-system cap. Keep hands, clothing, and leads clear of the fan and belt. Mazda warns that the fan can continue running after the engine stops and may run indefinitely while the engine compartment is hot. [13]\n\n**Tools:** scan tool with coolant-temperature and fan-command data, DMM, fused jumper/appropriate back-probing tools, infrared thermometer used cautiously, and VIN-specific fuse information.\n\n**Steps and tests:**\n\n1. If the vehicle is overheating, stop safely, switch off, and allow it to cool. Check the reservoir and visible leaks only when safe; do not use fan operation as the first or only test.\n2. Compare scan-tool coolant temperature to a cold-soak ambient value. An implausible sensor reading can change fan command and also create mixture or warning-light faults.\n3. Check the fan fuse and control device using the vehicle’s fuse legend. Test for supply voltage and ground at the fan circuit under the commanded condition.\n4. Use the scan tool’s output-control test if supported. If the module commands the fan but the motor does not run, isolate power, ground, connector, and motor. If the motor runs under a safe, fused direct test but not by command, move upstream to relay/control wiring, module command, or sensor logic.\n5. Check whether A/C operation commands the fan. A fan response to A/C is evidence about one command path, not proof that the temperature-control path is correct.\n6. Inspect coolant level, hoses, radiator airflow, and signs of a leak. A fan that works cannot compensate for low coolant, air, a blocked radiator, or a thermostat/circulation problem.\n\n**Verification:** coolant temperature remains controlled during idle and road testing, the fan responds to the applicable command conditions, the engine does not overheat after shutdown, and no fan/control/sensor DTC returns.\n\n**Common mistakes:** opening the cap hot; assuming no audible fan at cold idle is a failure; replacing the sensor before verifying its data and wiring; back-probing a high-current motor circuit with an unfused short; and ignoring low coolant or airflow restrictions.\n\n## 3. Simplified circuit descriptions for abstract diagrams\n\nThese are deliberately conceptual and are suitable for new abstract diagrams. They are not pinouts or factory wiring reproductions.\n\n### A. Power, charging, and ground backbone\n\n`12-V battery → high-current fuse/distribution → starter and vehicle loads`\n\n`Engine-driven alternator → charging cable/control → battery and vehicle bus`\n\n`Battery negative → body ground → engine/transmission ground → return path for starter and sensors`\n\nDiagram note: show battery voltage/ground as a prerequisite shared by PCM, body electronics, ABS/DSC, keyless, infotainment, lighting control, and RF roof logic. Mark a “voltage drop / poor ground” fault as capable of producing many apparently unrelated symptoms.\n\n### B. Networked scan and body-control path\n\n`Switches/sensors → body or engine controller → CAN/network messages → cluster, warning lamps, actuators, and scan tool`\n\n`Battery/ignition feeds + clean module grounds → controller health`\n\nDiagram note: distinguish a **command** from an **actuator result**. A scan tool can show that a module requested a lamp, fan, or roof operation; a separate power/ground/load test proves whether the actuator circuit delivered it.\n\n### C. RF roof interlock and actuator path\n\n`Roof switch + ignition state + speed/gear + trunk/position inputs → roof controller → motor/drive mechanism → position/status feedback → cluster message`\n\nDiagram note: place low battery voltage, trunk-open status, reverse selected, excessive vehicle angle, obstruction, and position disagreement as separate inhibit branches. Show emergency manual closing outside the normal electric path and label it “temporary recovery; electric operation requires restoration.”\n\n### D. Cooling-fan control path\n\n`Coolant-temperature data and A/C demand → engine/body control decision → fuse/relay or electronic driver → fan motor → airflow through radiator`\n\n`Battery/ground integrity and coolant level → conditions that can invalidate the diagnosis`\n\nDiagram note: show fan operation after key-off as a normal possible state during high under-hood temperature, not automatically as a stuck relay. Show “fan runs” and “engine stays hot” as two different branches requiring separate coolant-flow and airflow checks.\n\n## References\n\n[1]: https://news.mazdausa.com/vehicles-2016-mx-5 \"Mazda USA 2016 MX-5 vehicle archive\"\n[2]: https://news.mazdausa.com/2018-06-20-2019-mazda-mx-5-miata-packs-more-punch-features \"Mazda USA 2019 MX-5 update release\"\n[3]: https://www.caranddriver.com/news/a45456983/2024-mazda-mx-5-miata-details/ \"Car and Driver 2024 Mazda MX-5 update\"\n[4]: https://www.mazdausa.com/vehicles/mx-5-miata-rf \"Mazda USA MX-5 Miata RF overview\"\n[5]: https://www.mazdausa.com/static/manuals/2024/mx-5/contents/64160400.html \"2024 Mazda MX-5 Owner’s Manual: retractable fastback operation\"\n[6]: https://www.mazdausa.com/owners/how-to-use-my-mazda \"Mazda USA owner resources and manual scope\"\n[7]: https://www.fluke.com/en-us/learn/blog/automotive/electrical-automotive-troubleshooting \"Fluke automotive electrical troubleshooting and voltage-drop guidance\"\n[8]: https://forum.miata.net/vb/showthread.php?t=751755 \"MX-5 Miata Forum: i-stop battery-state initialization discussion\"\n[9]: https://www.denso-am.eu/news/starter-troubleshooting \"DENSO starter troubleshooting and voltage-drop tests\"\n[10]: https://www.mazdausa.com/static/manuals/2024/mx-5/contents/69050200.html \"2024 Mazda MX-5 Owner’s Manual: replacing light bulbs\"\n[11]: https://www.mazdausa.com/static/manuals/2016/mx5/contents/07031600.html \"2016 Mazda MX-5 Owner’s Manual: fuses\"\n[12]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8fl9ee16j/contents/08120100.html \"Mazda MX-5 Owner’s Manual: when the roof cannot be closed\"\n[13]: https://www.mazdausa.com/static/manuals/2024/mx-5/contents/69040300.html \"2024 Mazda MX-5 Owner’s Manual: coolant and cooling-fan safety\"\n[14]: https://www.mazdausa.com/static/manuals/2024/mx-5/contents/69040600.html \"2024 Mazda MX-5 Owner’s Manual: lead-acid battery safety and maintenance\"\n[15]: https://www.fluke.com/en-us/learn/blog/digital-multimeters/how-to-test-alternator-ripple-voltage-with-a-multimeter \"Fluke alternator ripple-voltage test\"\n[16]: https://www.mazdausa.com/static/manuals/2016/mx5/contents/08030100.html \"2016 Mazda MX-5 Owner’s Manual: jump-starting\"\n",
        "references": "## References\n\n[1]: https://news.mazdausa.com/vehicles-2016-mx-5 \"Mazda USA 2016 MX-5 vehicle archive\"\n[2]: https://news.mazdausa.com/2018-06-20-2019-mazda-mx-5-miata-packs-more-punch-features \"Mazda USA 2019 MX-5 update release\"\n[3]: https://www.caranddriver.com/news/a45456983/2024-mazda-mx-5-miata-details/ \"Car and Driver 2024 Mazda MX-5 update\"\n[4]: https://www.mazdausa.com/vehicles/mx-5-miata-rf \"Mazda USA MX-5 Miata RF overview\"\n[5]: https://www.mazdausa.com/static/manuals/2024/mx-5/contents/64160400.html \"2024 Mazda MX-5 Owner’s Manual: retractable fastback operation\"\n[6]: https://www.mazdausa.com/owners/how-to-use-my-mazda \"Mazda USA owner resources and manual scope\"\n[7]: https://www.fluke.com/en-us/learn/blog/automotive/electrical-automotive-troubleshooting \"Fluke automotive electrical troubleshooting and voltage-drop guidance\"\n[8]: https://forum.miata.net/vb/showthread.php?t=751755 \"MX-5 Miata Forum: i-stop battery-state initialization discussion\"\n[9]: https://www.denso-am.eu/news/starter-troubleshooting \"DENSO starter troubleshooting and voltage-drop tests\"\n[10]: https://www.mazdausa.com/static/manuals/2024/mx-5/contents/69050200.html \"2024 Mazda MX-5 Owner’s Manual: replacing light bulbs\"\n[11]: https://www.mazdausa.com/static/manuals/2016/mx5/contents/07031600.html \"2016 Mazda MX-5 Owner’s Manual: fuses\"\n[12]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8fl9ee16j/contents/08120100.html \"Mazda MX-5 Owner’s Manual: when the roof cannot be closed\"\n[13]: https://www.mazdausa.com/static/manuals/2024/mx-5/contents/69040300.html \"2024 Mazda MX-5 Owner’s Manual: coolant and cooling-fan safety\"\n[14]: https://www.mazdausa.com/static/manuals/2024/mx-5/contents/69040600.html \"2024 Mazda MX-5 Owner’s Manual: lead-acid battery safety and maintenance\"\n[15]: https://www.fluke.com/en-us/learn/blog/digital-multimeters/how-to-test-alternator-ripple-voltage-with-a-multimeter \"Fluke alternator ripple-vol         "markdown": "# Mazda MX-5 ND Mechanical Research Note (2016–present)\n\nThis note is an original field-reference outline for the fourth-generation MX-5 (ND), not a reproduction of Mazda workshop-manual prose, torque tables, wiring diagrams, or illustrations. Exact fastener torque, fluid capacity, calibration, and software procedures remain VIN-, market-, transmission-, and equipment-specific; confirm them in the applicable Mazda service information before performing work.\n\n## 1. Generation facts and caveats\n\n### ND1: 2016–2018 (market timing varies)\n\nThe launch ND is the lightest and mechanically simplest branch, with the 1.5- or 2.0-liter Skyactiv-G family depending on market. North-American 2016–2018 2.0-liter cars are the important gearbox caveat: early six-speed manuals developed a documented pattern of hard use-related second-, third-, and fourth-gear failures. Mazda issued transmission-replacement policy/technical guidance during the warranty era, and the gearbox received multiple internal revisions. A symptom such as a 2–3 crunch, gear pop-out, metallic debris on the magnetic plug, or a gear that suddenly disappears should not be “fixed” by endlessly adjusting the clutch. Diagnose the gearbox and check VIN history first. [1] [2]\n\nEarly soft-top suspension tuning is also a caveat. The ND’s short-travel suspension can reach its bump stops sooner than an owner expects, especially after lowering springs or aggressive ride-height changes. A car that feels nervous, skips over bumps, or shows abrupt oversteer may have inadequate bump travel, incorrect damper/spring pairing, or bushing preload rather than a simple alignment problem. Measure ride height and inspect bump-stop engagement before chasing toe settings. Independent competition guidance treats ND alignment and rake differently from earlier Miatas, which is a useful cross-check but not a substitute for the owner’s market-specific specification. [3]\n\n### ND2: 2019–2023 (approximately)\n\nThe 2019 update brought the higher-output 2.0-liter engine in markets that previously used the lower-output version, a higher redline, revised engine calibration, and driveline refinements. Independent technical reporting identifies a dual-mass flywheel and revised shift behavior as important reasons that ordinary ND2 transmission warranty claims fell toward normal levels, although failures did not become impossible. Treat an ND2 as improved, not failure-proof, particularly if modified, tracked, or fitted with excess power. [2]\n\nThe ND2 also introduced or expanded electronic and ergonomic changes by trim and market. Do not assume that a warning light, steering behavior, infotainment symptom, or roof/window interaction is identical to an ND1. Battery disconnection can disturb power-window auto functions, and low voltage can create misleading multi-system warnings. Restore battery health and initialize affected functions before condemning a module. [4]\n\n### ND3: 2024–present (market naming varies)\n\nThe 2024 refresh is commonly called ND3, but nomenclature and equipment differ by market. The major service implication is a more extensively revised electrical/electronic platform and additional driver-assistance features on some trims. An independent road comparison reports a new infotainment/electrical platform, new displays and USB-C behavior, and features such as camera-based sign recognition and radar cruise on the tested Canadian car; those features are not universal to every ND3. Diagnose by VIN and equipment, not by internet shorthand. [5]\n\nThe 2024 update also changed lighting, steering feel, software, and limited-slip/traction-control behavior by specification. A calibration or sensor fault can present as a chassis complaint. Before replacing suspension or steering parts, scan all relevant modules, record freeze-frame data, check tire pressures and alignment, and determine whether the symptom is mechanical, electrical, or a normal characteristic of the installed control strategy.\n\n### Shared ND architecture and service boundaries\n\nAll ND variants combine a compact front-engine/rear-drive layout, independent suspension, a propeller shaft and rear differential, four-wheel disc brakes, electric power steering, and a high level of networked control. The mechanical systems are accessible, but the electronic systems are not isolated: battery voltage, wheel-speed signals, steering-angle data, brake/ABS information, roof/window interlocks, and body-control logic can interact.\n\nMazda’s scheduled-maintenance information calls for recurring inspection of cooling-system condition, battery, brake lines and discs, parking brake, steering linkages, suspension/ball joints/wheel bearings, driveshaft boots, chassis/body fasteners, exhaust/heat shields, tires, and body corrosion. It also specifies coolant replacement intervals by market and warns against using an incorrect coolant type; for the referenced owner information, FL-22 is the intended coolant family. Never transfer an interval from one market or model year to another without checking the car’s manual. [6]\n\nSoft-top and RF cars are not interchangeable for body-water diagnosis. The soft top has a drain-filter service point and fabric/seam vulnerabilities. The RF adds powered roof motors, position/interlock logic, hardtop drainage outlets, moving links, and window coordination. A water leak, roof stop, or window drop problem must be approached as a body-and-electrical system, not only as a seal problem. [4] [7]\n\n### Original simplified system flows\n\nThe following are conceptual service maps, not factory schematics.\n\n```mermaid\nflowchart LR\n    accTitle: ND cooling diagnostic flow\n    accDescr: A safe sequence from symptom to cooling-system verification.\n    A[Temperature rises] --> B[Stop safely; do not open a hot system]\n    B --> C[Check warning state, coolant level when cold, leaks, belt and fan clearance]\n    C --> D{Fan commanded and airflow present?}\n    D -- No --> E[Check fuse, relay/control command, motor, wiring, sensor data]\n    D -- Yes --> F{Coolant circulates and system holds pressure?}\n    F -- No --> G[Inspect thermostat, water pump, radiator, hose and trapped air]\n    F -- Yes --> H[Verify airflow, radiator/condenser blockage and load-related fault]\n    E --> I[Clear codes only after cause is corrected]\n    G --> I\n    H --> I\n```\n\n```mermaid\nflowchart LR\n    accTitle: RF roof service interlock flow\n    accDescr: Conditions that must be satisfied before powered RF roof operation and drain service.\n    A[Roof symptom] --> B[Confirm VIN, roof type, battery state and warning display]\n    B --> C{Ignition on; neutral/P; parking brake; trunk closed; low speed; level ground?}\n    C -- No --> D[Correct operating conditions; do not force the mechanism]\n    C -- Yes --> E[Operate switch while observing indicator and window movement]\n    E --> F{Stops, flashes rapidly, or remains partial?}\n    F -- No --> G[Confirm full latch, window operation and water drainage]\n    F -- Yes --> H[Stop; scan body/roof-related faults and inspect obstruction/drain/seal]\n    H --> I[Manual emergency closure or specialist repair only per applicable service information]\n```\n\n```mermaid\nflowchart TD\n    accTitle: ND low-voltage diagnostic flow\n    accDescr: A battery-first approach to networked warning lights and lost window or roof functions.\n    A[Multiple warnings or lost convenience functions] --> B[Measure battery state and charging voltage]\n    B --> C{Battery and grounds healthy?}\n    C -- No --> D[Repair/charge/replace battery; reconnect correctly]\n    C -- Yes --> E[Scan all modules, not only engine ECU]\n    E --> F[Record codes and freeze frame]\n    F --> G[Repair mechanical or wiring cause]\n    G --> H[Initialize windows/steering or calibrate only when the service procedure calls for it]\n    H --> I[Road-test and rescan; verify warnings do not return]\n```\n\n## 2. Repair and inspection procedures\n\n### Procedure 1 — Cooling-system triage and coolant-level verification\n\n**Symptom.** Temperature warning, coolant smell, level falling, heater output changing, or overheating in traffic/load.\n\n**Safety.** Park safely, shut down, keep hands clear of fans and belts, and never remove a pressure cap while hot. Mazda warns that moving fans and incorrect jump-start lead routing can injure; treat the fan as live until proven otherwise. [4]\n\n**Tools.** Flashlight, gloves/eye protection, clean inspection tray, cooling-system pressure tester appropriate to the vehicle, scan tool with live temperature data, and the correct coolant.\n\n**Steps.** Let the engine cool completely. Inspect the reservoir and visible hose/radiator/water-pump areas for wetness or dried residue. Check the cold level against the marked range. Inspect radiator/condenser fins for packed debris and confirm the fan shroud is intact. If level is low, find the leak before topping up repeatedly. Use the specified coolant family; Mazda’s maintenance information warns that the wrong coolant can damage the engine/cooling system. [6]\n\n**Tests.** Pressure-test only with the correct adapter and a cold system. Compare scan-tool temperature rise with gauge behavior and fan command. If the fan never runs when commanded, branch to power, ground, control, motor, and sensor diagnosis rather than replacing the thermostat first.\n\n**Verification.** After repair, bleed/fill using the vehicle-specific procedure, warm to operating temperature, confirm stable level after cool-down, and road-test under the condition that caused the symptom. Recheck for leaks.\n\n**Common mistakes.** Assuming a normal-looking dash gauge proves normal temperature; opening the cap hot; mixing unknown coolant; bypassing the fan with an unfused jumper; and fitting a larger radiator before proving the actual fault.\n\n### Procedure 2 — Engine oil, accessory belt, and front-of-engine leak inspection\n\n**Symptom.** Oil smell, belt chirp, visible oil/coolant residue, charging fluctuation, or unexplained low oil level.\n\n**Safety.** Keep clothing and tools away from rotating parts. Support the hood securely and keep the ignition off during static inspection.\n\n**Tools.** Inspection light, clean dipstick cloth, mirror, UV dye only if compatible with the fluid, and scan tool for charging/engine data.\n\n**Steps.** Inspect oil level on level ground after the specified wait period. Look around the filter, drain area, front cover, crank seal area, belt path, and coolant-pump region. Check belt ribs for glazing, cracks, contamination, or misalignment. Do not mistake assembly residue or spilled oil for an active leak; clean first, then recheck.\n\n**Tests.** With the engine off, rotate/inspect only as allowed by the service procedure. With the engine running, observe from a safe distance for belt tracking and charging behavior. If the belt is contaminated or frayed, stop driving until corrected.\n\n**Verification.** Confirm the oil level, charging voltage, belt tracking, and absence of fresh residue after a warm road-test. Record the fluid type and service date.\n\n**Common mistakes.** Overfilling; using the dipstick on an incline; spraying degreaser into electrical connectors; replacing a belt without finding the pulley misalignment or leak; and treating a charging warning as a battery-only issue.\n\n### Procedure 3 — Manual-transmission symptom screen and fluid/debris check\n\n**Symptom.** Crunching or lockout during 2–3/3–4 shifts, gear pop-out, whining, vibration, or a gear that no longer engages.\n\n**Safety.** Use a lift or stands rated for the car, keep the car level for fluid checks, and never run a driveline with personnel under an unsecured vehicle.\n\n**Tools.** Scan tool if transmission-related codes are present, borescope/inspection light, drain pan, magnet inspection method, and the VIN-specific fluid specification.\n\n**Steps.** Road-test only if the car can be operated safely. Separate clutch-release symptoms from gear engagement: note whether the fault changes with engine speed, clutch pedal position, temperature, and shift direction. Check for leaks and damage. If draining fluid, inspect the plug magnet and fluid for abnormal metallic fragments. Early ND1 gearbox failures are a known caveat; a hard shift is not automatically a clutch adjustment problem. [2]\n\n**Tests.** With the engine off, check static gear selection. With the engine running, compare engagement in neutral, reverse, and the affected gear without forcing the lever. Use scan data where available, but do not expect a scan tool to detect every mechanical gear failure.\n\n**Verification.** After a confirmed repair or replacement, verify every gear cold and hot, check for leaks, and use a measured break-in road-test appropriate to the replacement unit. Reinspect fluid and mount/propeller-shaft fasteners if the symptom persists.\n\n**Common mistakes.** Continuing track use after metal appears; forcing a gear; blaming synchros before checking clutch release; installing an unspecified fluid; and assuming ND2/ND3 revisions make an abused or modified transmission immune.\n\n### Procedure 4 — Clutch-release and hydraulic diagnosis\n\n**Symptom.** Clutch drag, difficulty selecting reverse, engagement near the floor/top, slipping under load, or judder.\n\n**Safety.** Secure the car against movement; keep hands clear of the rotating driveline. Brake fluid damages paint and absorbs moisture.\n\n**Tools.** Light, catch bottle and hose, fluid-condition tester if available, pedal observation aid, and VIN-specific clutch/bleeding information.\n\n**Steps.** Inspect reservoir level and fluid condition, line/connection areas, master-cylinder pushrod region, and slave-cylinder area for leakage. Check pedal free movement and whether the release point changes after pumping. Distinguish slip (engine speed rises without matching road speed) from drag (gear selection difficult with pedal down) and judder (engagement vibration).\n\n**Tests.** With the engine off, select gears. With the engine idling and clutch fully depressed, test reverse engagement without force. Check whether pumping the pedal temporarily changes the fault; this suggests hydraulic air/leakage but does not prove the component at fault.\n\n**Verification.** Bleed using the correct sequence and fluid, confirm a firm consistent pedal, clean engagement, quiet release, and no fluid loss. If the symptom remains, inspect clutch/flywheel and transmission input support rather than continuing to bleed.\n\n**Common mistakes.** Using the wrong reservoir; spilling fluid on painted parts; diagnosing a failing gearbox as clutch drag; and replacing the clutch without checking the hydraulic leak that caused it.\n\n### Procedure 5 — Propeller shaft, differential, mounts, and driveline-play inspection\n\n**Symptom.** Clunk on throttle transition, vibration by road speed, shudder on take-up, or backlash that worsens after clutch/transmission work.\n\n**Safety.** Chock wheels, use secure stands, and keep the engine off unless a documented test requires otherwise. Never rotate a shaft with hands near pinch points.\n\n**Tools.** Pry bar for controlled play checks, dial indicator if measuring runout, paint marker, torque documentation, and inspection light.\n\n**Steps.** Inspect engine/transmission mounts, propeller-shaft joints, differential mounts, axle/CV boots, and surrounding structure for looseness, cracks, grease loss, or witness marks. Check whether the noise occurs on load reversal, during acceleration, or at a fixed road speed. Mark suspect flange positions before disassembly so balance/indexing is preserved.\n\n**Tests.** Compare rotational backlash at the wheels/shaft with the transmission in neutral as appropriate. A vibration that follows road speed points toward rotating hardware, wheel/tire, shaft, or differential; one that follows engine speed points elsewhere. Check mount and Power Plant Frame alignment/fastener history after major driveline work.\n\n**Verification.** Road-test in a controlled area through light and moderate load transitions. Confirm no new vibration, leak, boot sling, or mount movement.\n\n**Common mistakes.** Replacing a differential for a tire/wheel imbalance; ignoring a torn boot because the joint is currently quiet; mixing flange orientation; and reusing damaged self-locking hardware without checking the service requirement.\n\n### Procedure 6 — Brake, ABS, and electronic-parking-brake inspection\n\n**Symptom.** Pulling, pulsation, squeal, long pedal, warning lights, uneven pad wear, or parking-brake release fault.\n\n**Safety.** Brake dust may contain hazardous material; do not blow it into the air. Support the car securely and never road-test with an uncertain hydraulic pedal.\n\n**Tools.** Thickness gauge, dial indicator, brake-fluid tester, scan tool capable of ABS/body modules, pressure bleeder if appropriate, and a brake-temperature comparison method.\n\n**Steps.** Inspect pad thickness and wear pattern, rotor face/condition, caliper slide/piston behavior, hoses, hard lines, reservoir, and parking-brake mechanism. Look for one hot wheel after a short controlled drive, which can indicate drag. Mazda schedules recurring checks of brake lines, parking brake, discs, and related components. [6]\n\n**Tests.** Check pedal firmness with the engine off and with assist available. Scan ABS for wheel-speed plausibility and compare live speeds during a slow drive. If a warning appears after battery work, still verify battery voltage and grounds before clearing codes.\n\n**Verification.** Bleed only with the correct fluid and sequence, perform a low-speed brake test, then confirm straight stops, consistent pedal height, no leaks, and no returning ABS/brake/parking-brake warnings.\n\n**Common mistakes.** Treating a wheel-speed fault as a bad bearing without checking sensor wiring and tone-ring condition; pressing an electronic parking-brake piston without the required service mode; contaminating friction surfaces; and bedding pads before proving the hydraulics are sound.\n\n### Procedure 7 — Suspension, steering, wheel-bearing, and bushing inspection\n\n**Symptom.** Clunk, wandering, uneven tire wear, steering pull, unstable braking, ride harshness, or sudden oversteer.\n\n**Safety.** Inspect at ride height where possible for bonded rubber bushings; support unsprung components before separating joints.\n\n**Tools.** Tire-pressure gauge, pry bar, dial indicator for bearing play, alignment rack or plates, ride-height measure, and inspection light.\n\n**Steps.** Set tire pressures and confirm tire condition first. Inspect ball joints, control-arm bushings, sway-bar links, dampers, springs, bump stops, wheel bearings, steering rack/links, and subframe fasteners. Measure ride height and rake before altering parts. If suspension arms with bonded rubber bushings are replaced, final tightening must account for normal ride position; torquing everything with the suspension hanging can preload the rubber and change height/feel.\n\n**Tests.** Check wheel play at appropriate positions, compare left/right damper response, and measure alignment. For modified cars, inspect for insufficient bump travel and tire/fender contact. ND-specific alignment guidance uses different rake and toe/camber targets than NA/NB; use the 949 Racing numbers only as an aftermarket reference and confirm the intended use case. [3]\n\n**Verification.** Torque at the prescribed ride position, perform alignment, road-test over the original symptom, and inspect tire contact/wear after the test.\n\n**Common mistakes.** Aligning a bent or loose car; lowering without checking bump travel; using visual tire wear alone to set camber; tightening bonded bushings at full droop; and installing offset bushings that bind or shift without confirming design suitability. [3]\n\n### Procedure 8 — Wheel/tire, hub, and alignment verification\n\n**Symptom.** Steering shake, pull, tramlining, uneven wear, or vibration that appears at a narrow speed band.\n\n**Safety.** Use correct lift points and torque procedure. Do not diagnose alignment with a damaged tire or bent wheel.\n\n**Tools.** Calibrated pressure gauge, tread-depth gauge, wheel balancer, runout gauge, alignment rack, and tire-temperature probe for advanced use.\n\n**Steps.** Record tire size, brand, age, pressures, and previous rotation. Inspect for sidewall damage, belt separation, bent wheels, hub-face corrosion, and uneven bead seating. Measure radial/lateral runout and balance before changing suspension settings. Verify wheel-lug seating and correct hardware for the wheel.\n\n**Tests.** Swap front tires side-to-side only when directionality permits, or move a suspect wheel to identify whether the symptom follows the assembly. Compare steering-wheel angle and toe/camber/caster side-to-side. Confirm that electronic steering-angle data is plausibly centered after alignment when the platform requires it.\n\n**Verification.** Rebalance/repair, align, center the steering wheel, and repeat the same-speed road test. Confirm even contact and no new warning lights.\n\n**Common mistakes.** Chasing a pull with toe changes while a tire is conical or damaged; ignoring tire pressure differences; using a generic Miata alignment target; and forgetting steering-angle initialization when required by the vehicle’s control system.\n\n### Procedure 9 — Soft-top drain, fabric, and seal inspection\n\n**Symptom.** Wet carpet, damp trunk, water tracks at the window/top seam, mildew smell, or top material that will not fold cleanly.\n\n**Safety.** Keep fingers away from bows and latch points. Dry the top fully before folding; water trapped in folds accelerates deterioration.\n\n**Tools.** Soft brush, neutral synthetic detergent, clean water, trim-safe cloth, flashlight, and a non-sharp inspection probe only where appropriate.\n\n**Steps.** Remove loose debris before washing. Clean gently with mild detergent and plenty of water, rinse completely, and dry fully before lowering. Locate and remove the soft-top drain filter, clear leaves/debris, and reinstall until its retaining tab is secure. Mazda warns that blocked or incorrectly refitted filters can allow water into the vehicle. [7]\n\n**Tests.** Use a gentle controlled water test, section by section, without directing high-pressure spray at glass/top seams or body/top seams. Trace the water path before replacing seals.\n\n**Verification.** Confirm both drains pass water, the interior remains dry, the fabric folds without pinching, and seals sit evenly.\n\n**Common mistakes.** Using a pressure washer or automatic car wash; applying solvent, wax, or aggressive dressing to fabric; forcing a blocked drain with a stiff wire that damages the hose; and assuming a wet cabin is always a windshield or door seal.\n\n### Procedure 10 — RF roof operation, drainage, and electronic interlock diagnosis\n\n**Symptom.** Roof stops partway, rapid-flashing roof indicator, windows fail to dip/return, roof warning, water at rear-window area, or intermittent operation.\n\n**Safety.** The RF roof is powered and can pinch. Operate only on level ground with the trunk closed, parking brake applied, transmission in neutral/P, ignition on, and within the specified low-speed condition. For drain cleaning, raise the rear roof section as directed, switch ignition off, and keep clear of links and framework. Mazda explicitly warns that the motors can move unexpectedly if ignition remains on during this service step. [4] [7]\n\n**Tools.** Healthy 12-V battery/charger, scan tool with body/roof capability, trim-safe flashlight, soft cleaning tools, and the applicable emergency-closure information.\n\n**Steps.** Confirm battery state first. Check roof operation conditions, trunk-lid closure, seat position, window behavior, and the roof indicator/display. Do not repeatedly cycle a stalled mechanism. Inspect visible drainage outlets and foreign matter without touching moving links. If a partial roof remains, preserve its position and follow the VIN-specific emergency-closure procedure or refer to a specialist; do not improvise by levering panels.\n\n**Tests.** Scan all body/roof-related modules, record codes before clearing, and observe whether the fault correlates with low voltage, trunk switch state, window initialization, roof-position feedback, or a physical obstruction. Mazda lists ignition, selector position, speed, trunk closure, and vehicle tilt as roof-operation conditions; exceeding the speed condition can stop the cycle midstream. [4]\n\n**Verification.** After correction, complete multiple open/close cycles with the engine running, confirm the indicator extinguishes at full travel, verify windows dip/return, check trunk clearance, and perform a controlled water test at the drains and seals.\n\n**Common mistakes.** Forcing the roof by hand; cleaning with ignition on; disconnecting the battery before recording faults; replacing a roof motor when the battery or interlock is at fault; and using RF procedures on a soft-top car or vice versa.\n\n### Procedure 11 — Battery, jump-start, and post-power-loss initialization\n\n**Symptom.** Multiple warning lights, intermittent roof/window failure, lost auto-window function, no-start, or false-looking module codes after a flat battery.\n\n**Safety.** Use only a 12-V booster. Mazda directs the negative jumper to a suitable ground away from the discharged battery and warns against routing leads near fans/belts. [4]\n\n**Tools.** Battery tester, multimeter, insulated leads, memory-safe support only if approved for the operation, and scan tool.\n\n**Steps.** Test state of charge, cranking performance, terminals, ground paths, and charging output. If jump-starting, connect positive to positive, then booster negative to the designated ground point on the disabled car; disconnect in reverse. Avoid 24-V sources. After restoring power, scan all modules before clearing, then perform only the window/steering/roof initializations specified for the equipment.\n\n**Tests.** Verify charging under electrical load and inspect for parasitic drain only after the car has entered its normal sleep state. A low-voltage event can create several unrelated-looking warnings; do not replace every warning-light component before proving voltage and grounds.\n\n**Verification.** Confirm stable starting, charging, auto-window operation, roof operation if equipped, no persistent warnings, and a clean rescan after a road-test.\n\n**Common mistakes.** Reversing jumper polarity; using a 24-V booster; connecting the negative lead directly to the discharged battery terminal when a ground point is specified; clearing codes before saving them; and assuming the battery replacement is complete without initialization or charging verification.\n\n## 3. Diagnostic traps and safe sequencing rules\n\n1. **Start with identity.** Record VIN, market, model year, engine, transmission, roof type, trim, modifications, and software/recall history. “ND1/ND2/ND3” is useful shorthand, not a service specification.\n2. **Make the car safe before making it quiet.** For overheating, brake, roof, or steering symptoms, stop and secure the vehicle before testing. A warning that disappears after cycling the ignition is not proof of repair.\n3. **Battery and grounds come before network conclusions.** A weak battery can produce roof, window, ABS, steering, and body warnings at once. Measure first, scan second, clear last.\n4. **Mechanical checks precede alignment changes.** Check tire pressure, wheel/tire condition, bearing play, bent parts, loose fasteners, and bushing condition before changing toe or camber.\n5. **Use symptom reproduction, not parts roulette.** Record temperature, road speed, engine speed, gear, load direction, roof position, and warning state. Repeat only when safe.\n6. **Preserve evidence.** Photograph leaks and warning displays, save scan reports and freeze frames, inspect drained fluids and magnets, and mark shaft/flange orientation before disassembly.\n7. **Sequence RF work deliberately.** Operate the roof under its conditions; stop if it becomes partial or rapid-flashes; isolate the ignition for drain cleaning; and never put hands into links or the framework.\n8. **Verify after repair.** A successful part replacement is not the same as a successful repair. Recheck fluid levels, leaks, clearances, warnings, calibration/initialization, and the original symptom.\n\n## References\n\n[1]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2016/mx5-miata/2016-mx-5-owners-manual.pdf \"2016 Mazda MX-5 Owner’s Manual\"\n\n[2]: https://grassrootsmotorsports.com/project-cars/2019-nd-mx-5/giving-our-triple-threat-nd-miata-a-proper-bluepri/ \"Grassroots Motorsports: How to bulletproof an ND Miata transmission\"\n\n[3]: https://949racing.com/supermiata/tech-info/miata-race-alignment-info/ \"949 Racing: Miata race and street alignment information\"\n\n[4]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2022/mx-5-rf/2022-mx-5-miata-rf-owners-manual.pdf \"2022 Mazda MX-5 RF Owner’s Manual\"\n\n[5]: https://chrisirwin.ca/posts/2016-ND1-vs-2024-ND3/ \"Chris Irwin: Thoughts after a week with the 2024 MX-5 RF (ND3)\"\n\n[6]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07020100.html \"Mazda MX-5 Owner’s Manual: Scheduled Maintenance\"\n\n[7]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07040100.html \"Mazda MX-5 Owner’s Manual: Soft-top and retractable-hardtop maintenance\"\n\n[8]: https://www.mazdausa.com/owners/recalls \"Mazda Recall and SSP Information\"\n\n[9]: https://www.nhtsa.gov/vehicle/2020/Mazda/MX-5%20Miata/recalls \"NHTSA vehicle recall lookup: 2020 Mazda MX-5 Miata\"\n",
        "references": "## References\n\n[1]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2016/mx5-miata/2016-mx-5-owners-manual.pdf \"2016 Mazda MX-5 Owner’s Manual\"\n\n[2]: https://grassrootsmotorsports.com/project-cars/2019-nd-mx-5/giving-our-triple-threat-nd-miata-a-proper-bluepri/ \"Grassroots Motorsports: How to bulletproof an ND Miata transmission\"\n\n[3]: https://949racing.com/supermiata/tech-info/miata-race-alignment-info/ \"949 Racing: Miata race and street alignment information\"\n\n[4]: https://www.mazdausa.com/siteassets/pdf/owners-optimized/2022/mx-5-rf/2022-mx-5-miata-rf-owners-manual.pdf \"2022 Mazda MX-5 RF Owner’s Manual\"\n\n[5]: https://chrisirwin.ca/posts/2016-ND1-vs-2024-ND3/ \"Chris Irwin: Thoughts after a week with the 2024 MX-5 RF (ND3)\"\n\n[6]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07020100.html \"Mazda MX-5 Owner’s Manual: Scheduled Maintenance\"\n\n[7]: https://owners-manual.mazda.com/gen/en/mx-5/mx-5_8gu7ee18e/contents/07040100.html \"Mazda MX-5 Owner’s Manual: Soft-top and retractable-hardtop maintenance\"\n\n[8]: https://www.mazdausa.com/owners/recalls \"Mazda Recall and SSP Information\"\n\n[9]: https://www.nhtsa.gov/vehicle/2020/Mazda/MX-5%20Miata/recalls \"NHTSA vehicle recall lookup: 2020 Mazda MX-5 Miata\""
      }
    ]
  }
];


const STORAGE_KEY='miataBibleRebuildV1';
const baseProfile={buildName:'My Miata',generation:'ND',year:2017,trim:'RF Club',mileage:40000,market:'North America'};
const store=createGarageStore(STORAGE_KEY,()=>({view:'garage',activeBook:'orientation',query:'',generationFilter:'all',profile:{...baseProfile},parts:[],history:[],plan:[],budget:3500,planName:'Reliable street build',savedProcedures:[],generationManual:'NA'}));
let state=store.load();

function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||{};
    return {
      view:raw.view||'garage', activeBook:raw.activeBook||'orientation', query:raw.query||'', generationFilter:raw.generationFilter||'all',
      profile:{...baseProfile,...(raw.profile||{})}, parts:Array.isArray(raw.parts)?raw.parts:[], history:Array.isArray(raw.history)?raw.history:[],
      plan:Array.isArray(raw.plan)?raw.plan:[], budget:Number(raw.budget)||3500, planName:raw.planName||'Reliable street build', savedProcedures:Array.isArray(raw.savedProcedures)?raw.savedProcedures:[]
    };
  }catch{return {view:'garage',activeBook:'orientation',query:'',generationFilter:'all',profile:{...baseProfile},parts:[],history:[],plan:[],budget:3500,planName:'Reliable street build',savedProcedures:[]}}
}
function persist(){store.save(state);render();toast('Saved to this device · cloud adapter ready');}
function $(selector,root=document){return root.querySelector(selector)}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(value){return '$'+Number(value||0).toLocaleString('en-US',{maximumFractionDigits:0})}
function genKey(value=state.profile.generation){return String(value).slice(0,2).toUpperCase()}
function currentGeneration(){return generations.find(g=>g.id===genKey())||generations[3]}
function showToast(message){const node=$('#toast');if(!node)return;node.textContent=message;node.classList.add('show');setTimeout(()=>node.classList.remove('show'),2200)}
function toast(message){showToast(message)}
function record(type,description,cost=0,notes=''){state.history.unshift({id:Date.now()+Math.random(),date:new Date().toISOString().slice(0,10),type,description,cost:Number(cost)||0,notes,mileage:state.profile.mileage})}
function setView(view){state.view=view;render()}
function activeBook(){return books.find(b=>b.id===state.activeBook)||books[0]}
function filteredProcedures(){
  const q=state.query.trim().toLowerCase(); const g=state.generationFilter==='all'?null:state.generationFilter;
  return procedures.filter(p=>p.book===state.activeBook && (!g||p.applies.includes(g)) && (!q||[p.title,p.system,p.symptoms,p.tags.join(' '),p.applies.join(' ')].join(' ').toLowerCase().includes(q)));
}
function render(){
  document.querySelector('#app').innerHTML=`<div class="app-shell">
    ${renderTopbar()}
    ${renderRail()}
    <main class="main" id="main">${renderView()}</main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>`;
  bind();

function renderMarkdown(markdown){
  const lines=markdown.split(/\r?\n/); let out=''; let inFence=false; let fence=[]; let listType='';
  const closeList=()=>{if(listType){out+=`</${listType}>`;listType='';}};
  for(const line of lines){
    if(line.startsWith('```')){if(!inFence){closeList();inFence=true;fence=[];}else{inFence=false;out+=`<div class="diagram-source"><div class="eyebrow">editable source abstraction</div><pre>${esc(fence.join('\n'))}</pre></div>`;}continue;}
    if(inFence){fence.push(line);continue;}
    if(!line.trim()){closeList();continue;}
    let m=line.match(/^(#{1,4})\s+(.*)$/); if(m){closeList();const level=Math.min(4,m[1].length);out+=`<h${level}>${inlineMarkdown(m[2])}</h${level}>`;continue;}
    m=line.match(/^\s*[-*]\s+(.*)$/); if(m){if(listType!=='ul'){closeList();out+='<ul>';listType='ul';}out+=`<li>${inlineMarkdown(m[1])}</li>`;continue;}
    m=line.match(/^\s*\d+\.\s+(.*)$/); if(m){if(listType!=='ol'){closeList();out+='<ol>';listType='ol';}out+=`<li>${inlineMarkdown(m[1])}</li>`;continue;}
    closeList();
    if(line.startsWith('> ')){out+=`<div class="notice">${inlineMarkdown(line.slice(2))}</div>`;continue;}
    out+=`<p>${inlineMarkdown(line)}</p>`;
  }
  closeList(); if(inFence)out+=`<div class="diagram-source"><pre>${esc(fence.join('\n'))}</pre></div>`; return out;
}
function inlineMarkdown(text){return esc(text).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1 ↗</a>');}

  if(action==='clear-search'){state.query='';state.generationFilter='all';render();return}
  if(action==='filter-generation'){state.generationFilter=el.dataset.generation;state.activeBook='generation';state.view='manual';render();return}
  if(action==='generation-manual'){state.generationManual=el.dataset.generation;state.view='genmanual';render();return}
  if(action==='save-profile'){saveProfile();return}
  if(action==='save-procedure'){const id=el.dataset.id;state.savedProcedures=state.savedProcedures.includes(id)?state.savedProcedures.filter(x=>x!==id):[...state.savedProcedures,id];persist();return}
  if(action==='print'){window.print();return}
  if(action==='export'){exportState();return}
  if(action==='add-part'){addCatalogPart(el.dataset.part);return}
  if(action==='remove-part'){removePart(el.dataset.id);return}
  if(action==='save-plan'){state.budget=Number($('#budget-input')?.value)||0;state.planName=$('#plan-name')?.value||'Build plan';persist();return}
  if(action==='load-path'){loadPath(el.dataset.path);return}
  if(action==='add-history'){addHistory();return}
}
function renderManualOnly(){const main=$('.main');if(state.view==='manual'&&main){main.innerHTML=renderManual();bind()}}
function saveProfile(){state.profile={...state.profile,buildName:$('#profile-name')?.value||state.profile.buildName,market:$('#profile-market')?.value||state.profile.market,generation:$('#profile-generation')?.value||state.profile.generation,year:Number($('#profile-year')?.value)||state.profile.year,trim:$('#profile-trim')?.value||state.profile.trim,mileage:Number($('#profile-mileage')?.value)||state.profile.mileage};record('Vehicle','Updated vehicle record');persist()}
function addCatalogPart(id){const item=parts.find(p=>p.id===id);if(!item)return;if(!item.generations.includes(genKey())){toast(`${item.name} needs ${item.generations.join('/')} fitment review`);return}const prior=state.parts.find(p=>p.slot===item.slot);if(prior){record('Replaced',`${prior.part} replaced in ${prior.slot}`,0,`New part: ${item.name}`);state.parts=state.parts.filter(p=>p.id!==prior.id)}const part={id:Date.now(),category:item.category,slot:item.slot,part:item.name,cost:item.cost,date:new Date().toISOString().slice(0,10),notes:item.impact};state.parts.push(part);record('Installed',`${item.name} → ${item.slot}`,item.cost,item.impact);persist()}
function removePart(id){const item=state.parts.find(p=>String(p.id)===String(id));if(!item)return;state.parts=state.parts.filter(p=>String(p.id)!==String(id));record('Archived',`${item.part} archived from ${item.slot}`);persist()}
function loadPath(id){const path=buildPaths.find(p=>p.id===id);if(!path)return;path.items.forEach(itemId=>{const item=parts.find(p=>p.id===itemId);if(item&&!state.plan.some(x=>x.source===item.id))state.plan.push({id:Date.now()+Math.random(),source:item.id,name:item.name,cost:item.cost,done:false})});state.planName=path.title;persist()}
function addHistory(){const type=$('#history-type')?.value||'Service';const description=$('#history-title')?.value?.trim();if(!description){toast('Add a short description first');return}record(type,description,Number($('#history-cost')?.value)||0,$('#history-notes')?.value||'');persist()}
function exportState(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`miata-bible-garage-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('Garage export downloaded')}
window.addEventListener('hashchange',()=>{const match=location.hash.match(/manual\/([^/]+)/);if(match){state.activeBook=match[1];state.view='manual';render()}});
render();

</script>
</body>
