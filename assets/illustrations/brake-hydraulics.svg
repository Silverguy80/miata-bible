<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Brake hydraulic diagnostic path</title><desc id="d">Original schematic showing pedal, booster, master cylinder, ABS unit, brake lines, calipers, and evidence checkpoints.</desc><rect width="1200" height="700" fill="#101820"/><g fill="#f1eee4" stroke="#d94b45" stroke-width="5"><rect x="70" y="275" width="150" height="110" rx="8"/><rect x="300" y="275" width="160" height="110" rx="8"/><rect x="540" y="250" width="180" height="160" rx="8"/><rect x="820" y="175" width="150" height="100" rx="8"/><rect x="820" y="425" width="150" height="100" rx="8"/><rect x="1040" y="175" width="120" height="100" rx="8"/><rect x="1040" y="425" width="120" height="100" rx="8"/></g><g fill="none" stroke="#e6c64f" stroke-width="8" stroke-linecap="round"><path d="M220 330H300M460 330H540M720 300L820 225M720 360L820 475M970 225H1040M970 475H1040"/></g><g fill="#f1eee4" font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="90" font-size="38" font-weight="700">BRAKE HYDRAULIC PATH</text><text x="600" y="135" font-size="22" fill="#a9bdc2">Follow pressure and movement from the pedal to the tire. Do not guess from pedal feel alone.</text><g fill="#101820" font-size="22" font-weight="700"><text x="145" y="320">PEDAL</text><text x="145" y="352">INPUT</text><text x="380" y="320">BOOSTER</text><text x="380" y="352">ASSIST</text><text x="630" y="320">MASTER</text><text x="630" y="352">CYLINDER</text><text x="895" y="215">ABS / DSC</text><text x="895" y="465">ABS / DSC</text><text x="1100" y="215">FRONT</text><text x="1100" y="465">REAR</text></g><text x="600" y="610" font-size="24" fill="#e6c64f" font-weight="700">CHECKPOINTS: leaks · air · hose expansion · piston movement · pad knock-back · sensor data</text></g></svg>