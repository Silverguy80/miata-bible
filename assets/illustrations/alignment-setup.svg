<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Alignment and suspension setup plate</title><desc id="d">Original top-down setup plate showing tire contact patches, toe, camber, caster, ride height, and corner balance notes.</desc><rect width="1200" height="700" fill="#101820"/><g fill="#f1eee4" stroke="#d94b45" stroke-width="5"><rect x="180" y="190" width="150" height="280" rx="60"/><rect x="870" y="190" width="150" height="280" rx="60"/><rect x="465" y="180" width="270" height="300" rx="45"/></g><g fill="none" stroke="#e6c64f" stroke-width="7"><path d="M255 170V110M945 170V110M255 530V590M945 530V590"/><path d="M400 330H800" stroke-dasharray="16 14"/><path d="M410 230L350 160M790 230L850 160"/></g><g fill="#f1eee4" font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="75" font-size="38" font-weight="700">ALIGNMENT + SETUP PLATE</text><text x="600" y="120" font-size="22" fill="#a9bdc2">Measure the car before tuning it. Record tire, ride-height, alignment, and load assumptions together.</text><g fill="#101820" font-size="24" font-weight="700"><text x="255" y="330">LEFT</text><text x="255" y="365">CONTACT</text><text x="945" y="330">RIGHT</text><text x="945" y="365">CONTACT</text><text x="600" y="305">CHASSIS</text><text x="600" y="345">CENTERLINE</text></g><text x="600" y="610" font-size="24" fill="#e6c64f" font-weight="700">RECORD: toe · camber · caster · ride height · corner weights · tire pressures · driver load</text></g></svg>