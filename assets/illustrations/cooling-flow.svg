<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Cooling system diagnostic flow plate</title><desc id="d">Original schematic showing coolant flow between engine, thermostat, radiator, water pump, heater core, and fan control.</desc><rect width="1200" height="700" fill="#101820"/><g fill="none" stroke="#e6c64f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M230 310H420"/><path d="M620 310H840"/><path d="M970 310V520H700"/><path d="M500 520H230V310"/><path d="M420 520H420V450" stroke="#d94b45"/><path d="M840 310V210H970" stroke="#77c7c5"/><path d="M700 520V610H500" stroke="#77c7c5"/></g><g fill="#f1eee4" stroke="#d94b45" stroke-width="5"><rect x="70" y="250" width="160" height="120" rx="8"/><rect x="420" y="250" width="200" height="120" rx="8"/><rect x="840" y="250" width="260" height="120" rx="8"/><rect x="360" y="520" width="200" height="90" rx="8"/><rect x="650" y="520" width="220" height="90" rx="8"/></g><g fill="#101820" font-family="Arial, sans-serif" text-anchor="middle"><text x="150" y="300" font-size="28" font-weight="700">WATER PUMP</text><text x="150" y="338" font-size="20">flow source</text><text x="520" y="300" font-size="28" font-weight="700">ENGINE</text><text x="520" y="338" font-size="20">heat load</text><text x="970" y="300" font-size="28" font-weight="700">RADIATOR</text><text x="970" y="338" font-size="20">air-side cooling</text><text x="460" y="558" font-size="25" font-weight="700">HEATER CORE</text><text x="760" y="558" font-size="25" font-weight="700">FAN / RELAY</text><text x="600" y="105" fill="#f1eee4" font-size="38" font-weight="700">COOLING SYSTEM — TEST THE PATH, NOT JUST THE PART</text><text x="600" y="155" fill="#a9bdc2" font-size="22">Arrows show the functional relationship; confirm exact routing for your year and engine.</text><text x="600" y="665" fill="#d94b45" font-size="22" font-weight="700">RED: hot-side path · TEAL: control / return path</text></g></svg>