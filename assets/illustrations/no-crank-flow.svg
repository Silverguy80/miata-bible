<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">No crank diagnostic flow</title><desc id="d">Original decision flow for battery, cable, start request, relay, solenoid, and starter diagnosis.</desc><rect width="1200" height="700" fill="#101820"/><g fill="#f1eee4" stroke="#d94b45" stroke-width="5"><rect x="70" y="280" width="180" height="100" rx="10"/><rect x="320" y="280" width="180" height="100" rx="10"/><rect x="570" y="280" width="180" height="100" rx="10"/><rect x="820" y="170" width="160" height="100" rx="10"/><rect x="820" y="390" width="160" height="100" rx="10"/><rect x="1040" y="280" width="120" height="100" rx="10"/></g><g fill="none" stroke="#e6c64f" stroke-width="8" stroke-linecap="round"><path d="M250 330H320M500 330H570M750 330H820M900 270V390M980 220H1040M980 440H1040"/></g><g fill="#f1eee4" font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="88" font-size="38" font-weight="700">NO-CRANK DIAGNOSTIC FLOW</text><text x="600" y="133" font-size="22" fill="#a9bdc2">Measure the high-current path and the start request separately.</text><g fill="#101820" font-size="21" font-weight="700"><text x="160" y="320">BATTERY</text><text x="160" y="353">STATE</text><text x="410" y="320">CABLES +</text><text x="410" y="353">GROUNDS</text><text x="660" y="320">START</text><text x="660" y="353">REQUEST</text><text x="900" y="210">RELAY /</text><text x="900" y="242">INTERLOCK</text><text x="900" y="430">SOLENOID</text><text x="900" y="462">COMMAND</text><text x="1100" y="320">STARTER</text><text x="1100" y="353">MOTOR</text></g><text x="600" y="610" font-size="24" fill="#e6c64f" font-weight="700">EVIDENCE: resting voltage · loaded voltage drop · command voltage · current draw · hot/cold repeatability</text></g></svg>