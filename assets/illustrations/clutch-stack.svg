<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Clutch and lightweight flywheel stack</title><desc id="d">Original exploded-style side view of a crank flange, flywheel, disc, pressure plate, release bearing, and input shaft with fitment checks.</desc><rect width="1200" height="700" fill="#101820"/><g stroke="#e6c64f" stroke-width="7" fill="#f1eee4"><rect x="90" y="285" width="150" height="130" rx="10"/><rect x="330" y="250" width="150" height="200" rx="75"/><rect x="570" y="270" width="70" height="160" rx="8"/><rect x="730" y="235" width="180" height="230" rx="18"/><rect x="1000" y="305" width="120" height="90" rx="45"/></g><g stroke="#d94b45" stroke-width="5" fill="none" stroke-dasharray="12 10"><path d="M240 350H330M480 350H570M640 350H730M910 350H1000"/></g><g fill="#f1eee4" font-family="Arial, sans-serif" text-anchor="middle"><text x="600" y="100" font-size="38" font-weight="700">CLUTCH + LIGHTWEIGHT FLYWHEEL STACK</text><text x="600" y="145" font-size="22" fill="#a9bdc2">Weight is only one variable: step height, pilot support, release travel, balance, and break-in all matter.</text><g fill="#101820" font-size="24" font-weight="700"><text x="165" y="340">CRANK</text><text x="165" y="375">FLANGE</text><text x="405" y="340">FLYWHEEL</text><text x="605" y="340">DISC</text><text x="820" y="340">PRESSURE</text><text x="820" y="375">PLATE</text><text x="1060" y="340">RELEASE</text><text x="1060" y="375">BEARING</text></g><text x="600" y="600" font-size="25" fill="#e6c64f" font-weight="700">CHECK: engine / clutch diameter · flywheel step · pilot bearing · release geometry · torque sequence</text></g></svg>